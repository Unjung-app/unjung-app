    <script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
  };
  window.UnjungGame = api;
  ask('ready');
})();
/* ======================= 앱 연결 코드 끝 ======================= */

                ZOMBIE_3: '소리는 위험을 불러옵니다. 위급할수록 큰 소리를 내지 않고 침착하게 행동해야 합니다.',
                ZOMBIE_4: '대피한 뒤에는 충동적으로 위험한 곳으로 돌아가지 말고, 지정 대피소와 구조 기관의 안내를 따르세요.',
                TYPHOON_1: '태풍 때는 유리창에서 최대한 떨어지세요. 유리창에 X자로 붙이는 테이프는 파편 비산을 막는 효과가 거의 없습니다. 외출, 옥상, 운동장은 모두 금물입니다.',
                TYPHOON_2: '강풍으로 천장 구조물이 떨어질 수 있습니다. 머리와 목을 감싸고 낮은 자세를 유지하세요.',
                TYPHOON_3: '물에 젖은 상태로 전기 설비나 분전반을 만지면 감전됩니다. 정전과 누수가 함께 있으면 전기 설비에서 멀리 떨어지세요.',
                TYPHOON_4: '태풍의 눈이 지나가도 반대편의 강풍이 다시 불어옵니다. 특보 해제와 안내방송이 있을 때까지 실내에 머무르세요.',
                NUKES_1: '섬광은 절대 쳐다보지 말고 즉시 엎드려 눈을 감고 귀를 막으세요. 창문에서 멀리 떨어진 내벽 쪽이 상대적으로 안전합니다.',
                NUKES_2: '폭풍파가 지나간 직후에도 바로 밖으로 나가지 말고, 두꺼운 벽으로 둘러싸인 건물 안쪽이나 지하로 이동하세요.',
                NUKES_3: '낙진이 묻었을 수 있는 겉옷과 신발은 벗어 밀봉하고 몸을 씻으면 피폭량을 크게 줄일 수 있습니다. 환기는 금물입니다.',
                NUKES_4: '실내에 머물며 정부의 공식 안내(라디오, 재난문자)를 따르세요. 확인되지 않은 소문을 믿고 움직이면 안 됩니다.'
            };

            const CLEAR_TIPS = {
                FIRE_CLEAR: '화재 핵심 요약: 알리고 신고 → 자세 낮추고 연기 피하기 → 엘리베이터 금지 → 옥상이나 비상 출구 활용.',
                FIRE_HIDDEN_CLEAR: '완강기 순서: 지지대 고정 → 로프 내리기 → 벨트 조이기 → 벽 짚고 하강(줄은 잡지 않기). 평소 위치 확인이 생명을 구합니다.',
                EARTH_CLEAR: '지진 핵심 요약: Drop, Cover, Hold on → 멈춘 뒤 계단으로 이동 → 넓은 공터에 집결. 한 번 나온 건물엔 재진입 금지.',
                TYPHOON_CLEAR: '태풍 핵심 요약: 유리창에서 멀리 → 낙하물에서 머리 보호 → 전기와 물 조심 → 안내방송 전까지 실내 대기.',
                ZOMBIE_CLEAR: '위기 핵심 요약: 소리 줄이기 → 사람이 몰리는 곳 피하기 → 대피로 미리 알기 → 지정 대피소 이동.',
                NUKES_CLEAR: '핵 공격 핵심 요약: 엎드려 눈 감고 귀 막기 → 건물 안쪽과 지하로 이동 → 오염된 옷 밀봉 → 공식 안내 대기.'
            };

            let seenEndings = [];
            try { seenEndings = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); } catch (e) { seenEndings = []; }

            function markSeen(key) {
                if (seenEndings.includes(key)) return false;
                seenEndings.push(key);
                try { localStorage.setItem(SAVE_KEY, JSON.stringify(seenEndings)); } catch (e) {}
                try { UnjungGame.save({ endings: seenEndings }); } catch (e) {}  // 앱 안에서는 계정에 저장(폰을 바꿔도 도감 유지)
                return true;
            }

            const CLEAR_MSGS = {"FIRE_CLEAR": "소화전 진압이 불가능하다고 빠르게 판단하고 자세를 낮춰 옥상으로 향했다. 비상 열쇠함의 열쇠로 철문을 열고, 연기의 반대편에서 신호를 보낸 끝에 헬기로 무사히 구조될 수 있었다.", "FIRE_HIDDEN_CLEAR": "🏆 히든 엔딩! 복도 끝 완강기를 정확한 순서대로 사용해 연기와 불길을 모두 피하고, 3층 창문에서 안전하게 지상으로 탈출했다.", "ZOMBIE_CLEAR": "급식실에서 재활용장으로 빠져나와 빈 캔으로 좀비를 유인한 뒤 조용히 철문을 열었다. 골목길을 따라 대피소에 도착하며 수많은 좀비 떼를 완벽히 따돌릴 수 있었다.", "EARTH_CLEAR": "책상 밑에서 1차 진동을 버텨내고, 계단에서 여진까지 침착하게 넘겼다. 건물에서 멀리 떨어진 운동장 중앙에 모여 안전하게 목숨을 건질 수 있었다.", "TYPHOON_CLEAR": "창문에서 떨어진 안쪽 벽에서 낙하물과 누전의 위험까지 모두 피했다. 태풍의 눈에 속지 않고 끝까지 실내에서 버텨내어 생존할 수 있었다.", "NUKES_CLEAR": "정확한 방어 자세로 폭풍파를 견디고 지하로 대피했다. 오염된 옷을 밀봉하고 안내 방송을 기다린 덕분에, 낙진 속에서도 기적적으로 살아남을 수 있었다."};
            const SIMS = [
                { id: 'FIRE', pre: 'FIRE', name: '🔥 화재 시뮬레이션' },
                { id: 'EARTH', pre: 'EARTH', name: '🌍 지진 시뮬레이션' },
                { id: 'TYPHOON', pre: 'TYPHOON', name: '🌪️ 태풍 시뮬레이션' },
                { id: 'ZOMBIE', pre: 'ZOMBIE', name: '🧟‍♂️ 좀비 바이러스 시뮬레이션' },
                { id: 'NUKES', pre: 'NUKES', name: '☢️ 공습 경보 시뮬레이션' }
            ];
            const CLEAR_KEYS = ['FIRE_CLEAR', 'FIRE_HIDDEN_CLEAR', 'EARTH_CLEAR', 'TYPHOON_CLEAR', 'ZOMBIE_CLEAR', 'NUKES_CLEAR'];
            const simOf = (k) => SIMS.find(s => k.startsWith(s.pre)).id;

            // 엔딩 목록은 선택지가 섞이기 전에 한 번만 만들어 번호를 고정
            const ENDINGS = [];
            Object.keys(SCENARIOS).forEach(sk => SCENARIOS[sk].choices.forEach(c => {
                if (c.next === 'GAME_OVER') ENDINGS.push({ sim: simOf(sk), type: 'death', key: 'X:' + c.text, scene: sk, choice: c.text, msg: c.reason });
            }));
            CLEAR_KEYS.forEach(ck => ENDINGS.push({ sim: simOf(ck), type: 'clear', key: 'C:' + ck, scene: ck, msg: CLEAR_MSGS[ck] }));
            SIMS.forEach(sim => ['clear', 'death'].forEach(type => {
                let n = 0;
                ENDINGS.forEach(e => { if (e.sim === sim.id && e.type === type) e.num = ++n; });
            }));

            const isSeen = (e) => seenEndings.includes(e.key);
            const countSeen = () => ENDINGS.filter(isSeen).length;
            let codexSel = 0;
            let runSum = 0, runCount = 0, remainMs = 0;
            // 점수: 살아남은 선택마다 100 + 남은 초×10, 탈출 +500(히든 +800). 판이 끝나면 한 번 보낸다
            let runScore = 0, submitted = false;
            function submitRun() { if (submitted) return; submitted = true; try { UnjungGame.submitScore(runScore); } catch (e) {} }
            const scoreHTML = () => `<div class="text-lg font-bold text-amber-300 mb-3">🏅 이번 판 ${runScore}점</div>`;

            function titleOf(n) {
                if (n >= 100) return '👑 운중고 생존왕';
                if (n >= 75) return '서바이벌 마스터';
                if (n >= 50) return '재난 전문가';
                if (n >= 25) return '생존 베테랑';
                if (n >= 10) return '안전 지킴이';
                return '재난 신입생';
            }

            function gradeHTML() {
                const avg = runCount ? runSum / runCount / 1000 : 0;
                const g = avg >= 12 ? 'S' : avg >= 8 ? 'A' : avg >= 4 ? 'B' : 'C';
                return `<div class="text-sm font-bold text-sky-300 mb-4">⭐ 생존 등급 ${g} · 선택 ${runCount}번 · 평균 ${avg.toFixed(1)}초 만에 판단</div>`;
            }

            const NEWS = [
                (s) => `[속보] 운중고 ${s} 현장… 한 학생의 선택에 누리꾼 “그 선택지는 아니었다”`,
                (s) => `[긴급] ${s} 중 학생 탈락… 교사들 “교과서에 다 나와 있었는데”`,
                (s) => `[단독] ${s} 속 학생의 선택 영상 화제… 조회수 폭발`,
                (s) => `[속보] 119 “${s} 대응 요령을 꼭 읽어주세요”`,
                (s) => `[현장] ${s} 속 한 학생의 대담한 도전… 결과는 참담`
            ];
            const SHORT = { FIRE: '화재', EARTH: '지진', TYPHOON: '태풍', ZOMBIE: '좀비 사태', NUKES: '핵 공습 경보' };
            function newsHeadline() {
                const s = SHORT[simOf(gameOverScene || 'FIRE_1')];
                return NEWS[Math.floor(Math.random() * NEWS.length)](s);
            }

            function openCodex() { currentScene = 'CODEX'; render(); }
            function openEnding(i) {
                if (!isSeen(ENDINGS[i])) return;
                codexSel = i;
                currentScene = 'CODEX_DETAIL';
                render();
            }

            function tilesHTML(sim, type) {
                const color = type === 'clear' ? 'bg-emerald-700 hover:bg-emerald-600' : 'bg-red-700 hover:bg-red-600';
                return ENDINGS.map((e, i) => ({ e, i })).filter(o => o.e.sim === sim.id && o.e.type === type).map(o =>
                    isSeen(o.e)
                        ? `<button onclick="openEnding(${o.i})" class="w-10 h-10 rounded-lg ${color} text-white text-sm font-bold transition-colors shadow-sm">${o.e.num}</button>`
                        : `<div class="w-10 h-10 rounded-lg bg-slate-700 border border-slate-600 text-slate-500 flex items-center justify-center text-base" title="잠긴 엔딩">🔒</div>`
                ).join('');
            }

            function codexHTML() {
                const cards = SIMS.map(sim => {
                    const mine = ENDINGS.filter(e => e.sim === sim.id);
                    const clr = mine.filter(e => e.type === 'clear');
                    const dth = mine.filter(e => e.type === 'death');
                    const cnt = (arr) => arr.filter(isSeen).length;
                    return `
                        <div class="mb-4 p-3 bg-slate-900 rounded-lg border border-slate-700">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-sm font-bold text-white">${sim.name}</span>
                                <span class="text-xs text-slate-400">엔딩 ${mine.length}개 · 수집 ${cnt(mine)}</span>
                            </div>
                            <div class="text-xs text-emerald-400 font-bold mb-2">🎉 탈출 엔딩 ${cnt(clr)} / ${clr.length}</div>
                            <div class="flex flex-wrap gap-2 mb-3">${tilesHTML(sim, 'clear')}</div>
                            <div class="text-xs text-red-400 font-bold mb-2">💀 사망 엔딩 ${cnt(dth)} / ${dth.length}</div>
                            <div class="flex flex-wrap gap-2">${tilesHTML(sim, 'death')}</div>
                        </div>`;
                }).join('');
                return `
                    <div class="p-6 flex-1 flex flex-col bg-slate-800 overflow-y-auto">
                        <h2 class="text-xl font-bold mb-1 text-white">🏆 엔딩 도감</h2>
                        <div class="text-xs text-amber-300 font-bold mb-4">수집 ${countSeen()} / ${ENDINGS.length} · 번호를 누르면 엔딩을 다시 볼 수 있어요</div>
                        <div class="text-xs text-slate-300 mb-4">🎖️ 칭호 · ${titleOf(countSeen())}</div>
                        ${cards}
                        <button onclick="resetGame()" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-white transition-colors shadow-md">처음으로 돌아가기</button>
                    </div>`;
            }

            function endingDetailHTML() {
                const e = ENDINGS[codexSel];
                const sim = SIMS.find(s => s.id === e.sim);
                const isClear = e.type === 'clear';
                const tip = isClear ? CLEAR_TIPS[e.scene] : TIPS[e.scene];
                return `
                    <div class="p-8 flex-1 flex flex-col justify-center items-center text-center bg-slate-800">
                        <div class="text-xs text-slate-400 mb-3">${sim.name} · ${isClear ? '탈출' : '사망'} 엔딩 #${e.num}</div>
                        <div class="text-6xl mb-4">${isClear ? '🎉' : '💀'}</div>
                        <h2 class="text-2xl font-bold ${isClear ? 'text-emerald-400' : 'text-red-500'} mb-4">${isClear ? '생존 성공' : 'GAME OVER'}</h2>
                        ${e.choice ? `<p class="text-xs text-slate-400 mb-3 break-keep">선택: ${e.choice}</p>` : ''}
                        <p class="text-[15px] text-slate-300 mb-4 leading-relaxed break-keep bg-slate-900 p-4 rounded-lg border border-slate-700">${e.msg}</p>
                        <p class="text-sm text-amber-300 mb-8 leading-relaxed break-keep bg-slate-900 p-4 rounded-lg border border-slate-700 text-left">💡 ${tip || ''}</p>
                        <button onclick="openCodex()" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-white transition-colors shadow-md">도감으로 돌아가기</button>
                    </div>`;
            }

            function startTimer() {
                const key = currentScene;
                const total = TIME_LIMIT * 1000;
                let t = total;
                remainMs = total;
                timerId = setInterval(() => {
                    t -= 100;
                    remainMs = Math.max(0, t);
                    const bar = document.getElementById('timer-bar');
                    const txt = document.getElementById('timer-text');
                    if (!bar) { clearInterval(timerId); return; }
                    bar.style.width = Math.max(0, (t / total) * 100) + '%';
                    bar.className = 'h-full rounded transition-all ' + (t <= 5000 ? 'bg-red-500' : 'bg-emerald-400');
                    if (txt) txt.textContent = Math.max(0, Math.ceil(t / 1000)) + '초';
                    if (t <= 0) {
                        clearInterval(timerId);
                        gameOverReason = '망설이는 사이 골든타임이 지나가 버렸습니다. 재난 상황에서는 빠른 판단이 생명을 좌우합니다.';
                        gameOverScene = key;
                        lastNew = false;
                        submitRun();
                        currentScene = 'GAME_OVER';
                        render();
                    }
                }, 100);
            }
            let gameOverReason = '';

            function setScene(sceneName) {
                currentScene = sceneName;
                runSum = 0; runCount = 0; runScore = 0; submitted = false;
                shuffleChoices(sceneName);
                render();
            }

            function handleChoice(scenarioKey, choiceIndex) {
                const choice = SCENARIOS[scenarioKey].choices[choiceIndex];
                runSum += remainMs;
                runCount++;
                if (choice.next !== 'GAME_OVER') runScore += 100 + Math.floor(remainMs / 1000) * 10;
                if (choice.next === 'GAME_OVER') {
                    submitRun();
                    gameOverReason = choice.reason;
                    gameOverScene = scenarioKey;
                    lastNew = markSeen('X:' + choice.text);
                    currentScene = 'GAME_OVER';
                } else {
                    currentScene = choice.next;
                    shuffleChoices(choice.next);
                    if (choice.next.endsWith('_CLEAR')) { lastNew = markSeen('C:' + choice.next); runScore += choice.next === 'FIRE_HIDDEN_CLEAR' ? 800 : 500; submitRun(); }
                }
                render();
            }

            function shuffleChoices(key) {
                const s = SCENARIOS[key];
                if (!s) return;
                for (let i = s.choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [s.choices[i], s.choices[j]] = [s.choices[j], s.choices[i]];
                }
            }

            function resetGame() {
                runSum = 0; runCount = 0;
                currentScene = 'START';
                gameOverReason = '';
                render();
            }

            function render() {
                const app = document.getElementById('app');
                if (!app) return;
                if (timerId) clearInterval(timerId);

                let html = `
                    <div class="bg-slate-900 p-5 text-center border-b border-slate-700 shadow-sm">
                        <h1 class="text-xl md:text-2xl font-black tracking-wide text-white">운중고 재난 시뮬레이션</h1>
                    </div>
                `;

                if (currentScene === 'START') {
                    html += `
                        <div class="p-6 flex-1 flex flex-col justify-center bg-slate-800">
                            <div class="mb-8 p-5 bg-slate-700 rounded-lg text-sm text-slate-200 leading-relaxed shadow-inner">
                                운중고등학교에 예기치 못한 5가지 재난이 발생했습니다.<br/><br/>
                                주어진 상황 속에서 올바른 판단을 내려 끝까지 생존하십시오. 당신의 선택이 운명을 결정합니다.<br/><br/>⏱️ 선택마다 제한시간은 20초입니다!
                            </div>
                            
                            <button onclick="openCodex()" class="w-full -mt-4 mb-4 py-2 text-center text-xs text-amber-300 hover:text-amber-200 font-bold underline underline-offset-4">🏆 엔딩 도감 ${countSeen()} / ${ENDINGS.length} ▶</button>
                            <div class="text-center text-xs text-slate-300 -mt-3 mb-4">🎖️ 칭호 · ${titleOf(countSeen())}</div>

                            <div class="space-y-3">
                                <button onclick="setScene('FIRE_1')" class="w-full py-4 bg-red-600 hover:bg-red-500 rounded-lg text-white transition-colors shadow-md text-sm font-bold">🔥 화재 시뮬레이션</button>
                                <button onclick="setScene('EARTHQUAKE_1')" class="w-full py-4 bg-amber-600 hover:bg-amber-500 rounded-lg text-white transition-colors shadow-md text-sm font-bold">🌍 지진 시뮬레이션</button>
                                <button onclick="setScene('TYPHOON_1')" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-lg text-white transition-colors shadow-md text-sm font-bold">🌪️ 태풍 시뮬레이션</button>
                                <button onclick="setScene('ZOMBIE_1')" class="w-full py-4 bg-green-700 hover:bg-green-600 rounded-lg text-white transition-colors shadow-md text-sm font-bold">🧟‍♂️ 좀비 바이러스 시뮬레이션</button>
                                <button onclick="setScene('NUKES_1')" class="w-full py-4 bg-purple-700 hover:bg-purple-600 rounded-lg text-white transition-colors shadow-md text-sm font-bold">☢️ 공습 경보 시뮬레이션</button>
                            </div>
                        </div>
                    `;
                } 
                else if (currentScene === 'CODEX') {
                    html += codexHTML();
                }
                else if (currentScene === 'CODEX_DETAIL') {
                    html += endingDetailHTML();
                }
                else if (SCENARIOS[currentScene]) {
                    const scenario = SCENARIOS[currentScene];
                    html += `
                        <div class="p-6 flex-1 flex flex-col bg-slate-800 overflow-y-auto">
                            <h2 class="text-xl font-bold mb-5 text-white">${scenario.title}</h2>

                            <div class="flex items-center gap-2 mb-4">
                                <div class="flex-1 h-1.5 bg-slate-700 rounded"><div id="timer-bar" class="h-full rounded bg-emerald-400" style="width:100%"></div></div>
                                <span id="timer-text" class="text-xs text-slate-400 w-8 text-right">${TIME_LIMIT}초</span>
                            </div>
                            
                            ${scenario.mapHTML ? scenario.mapHTML : ''}

                            <div class="text-[15px] mb-8 leading-relaxed text-slate-300 break-keep">
                                ${scenario.desc}
                            </div>
                            
                            <div class="space-y-3 mt-auto">
                    `;
                    scenario.choices.forEach((choice, index) => {
                        html += `
                            <button onclick="handleChoice('${currentScene}', ${index})" class="w-full p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-left transition-colors text-sm font-medium text-slate-100 break-keep leading-snug shadow-sm">
                                ${choice.text}
                            </button>
                        `;
                    });
                    html += `</div></div>`;
                } 
                else if (currentScene.endsWith('_CLEAR')) {
                    let clearMessage = '';
                    if (currentScene === 'FIRE_CLEAR') clearMessage = '소화전 진압이 불가능하다고 빠르게 판단하고 자세를 낮춰 옥상으로 향했다. 비상 열쇠함의 열쇠로 철문을 열고, 연기의 반대편에서 신호를 보낸 끝에 헬기로 무사히 구조될 수 있었다.';
                    else if (currentScene === 'FIRE_HIDDEN_CLEAR') clearMessage = '🏆 히든 엔딩! 복도 끝 완강기를 정확한 순서대로 사용해 연기와 불길을 모두 피하고, 3층 창문에서 안전하게 지상으로 탈출했다.';
                    else if (currentScene === 'ZOMBIE_CLEAR') clearMessage = '급식실에서 재활용장으로 빠져나와 빈 캔으로 좀비를 유인한 뒤 조용히 철문을 열었다. 골목길을 따라 대피소에 도착하며 수많은 좀비 떼를 완벽히 따돌릴 수 있었다.';
                    else if (currentScene === 'EARTH_CLEAR') clearMessage = '책상 밑에서 1차 진동을 버텨내고, 계단에서 여진까지 침착하게 넘겼다. 건물에서 멀리 떨어진 운동장 중앙에 모여 안전하게 목숨을 건질 수 있었다.';
                    else if (currentScene === 'TYPHOON_CLEAR') clearMessage = '창문에서 떨어진 안쪽 벽에서 낙하물과 누전의 위험까지 모두 피했다. 태풍의 눈에 속지 않고 끝까지 실내에서 버텨내어 생존할 수 있었다.';
                    else if (currentScene === 'NUKES_CLEAR') clearMessage = '정확한 방어 자세로 폭풍파를 견디고 지하로 대피했다. 오염된 옷을 밀봉하고 안내 방송을 기다린 덕분에, 낙진 속에서도 기적적으로 살아남을 수 있었다.';

                    html += `
                        <div class="p-8 flex-1 flex flex-col justify-center items-center text-center bg-slate-800">
                            <div class="text-6xl mb-6">🎉</div>
                            <h2 class="text-2xl font-bold text-emerald-400 mb-6">생존 성공</h2>
                            ${scoreHTML()}
                            ${lastNew ? '<div class="text-xs font-bold text-amber-300 mb-3">🆕 새로운 엔딩 발견!</div>' : ''}
                            <p class="text-[15px] text-slate-200 mb-6 leading-relaxed break-keep">
                                ${clearMessage}
                            </p>
                            ${gradeHTML()}
                            <p class="text-sm text-amber-300 mb-8 leading-relaxed break-keep bg-slate-900 p-4 rounded-lg border border-slate-700 text-left">💡 ${CLEAR_TIPS[currentScene] || ''}</p>
                            <button onclick="resetGame()" class="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-white transition-colors shadow-md">처음으로 돌아가기</button>
                        </div>
                    `;
                }
                else if (currentScene === 'GAME_OVER') {
                    html += `
                        <div class="p-8 flex-1 flex flex-col justify-center items-center text-center bg-slate-800">
                            <div class="text-6xl mb-6">💀</div>
                            <h2 class="text-2xl font-bold text-red-500 mb-6">GAME OVER</h2>
                            ${scoreHTML()}
                            ${lastNew ? '<div class="text-xs font-bold text-amber-300 mb-3">🆕 새로운 엔딩 발견!</div>' : ''}
                            <div class="text-xs text-slate-400 mb-3 break-keep">📰 ${newsHeadline()}</div>
                            <p class="text-[15px] text-slate-300 mb-4 leading-relaxed break-keep bg-slate-900 p-4 rounded-lg border border-slate-700">
                                ${gameOverReason}
                            </p>
                            <p class="text-sm text-amber-300 mb-8 leading-relaxed break-keep bg-slate-900 p-4 rounded-lg border border-slate-700 text-left">💡 ${TIPS[gameOverScene] || ''}</p>
                            <button onclick="resetGame()" class="w-full py-4 bg-red-700 hover:bg-red-600 rounded-lg font-bold text-white transition-colors shadow-md">다시 도전하기</button>
                        </div>
                    `;
                }
                
                app.innerHTML = html;
                if (SCENARIOS[currentScene]) startTimer();
            }

            // 전역 함수 등록
            window.setScene = setScene;
            window.handleChoice = handleChoice;
            window.resetGame = resetGame;
            window.openCodex = openCodex;
            window.openEnding = openEnding;

            // 앱에 저장된 엔딩 도감 불러오기
            UnjungGame.load().then((d) => {
                if (d && Array.isArray(d.endings)) { d.endings.forEach((k) => { if (typeof k === 'string' && !seenEndings.includes(k)) seenEndings.push(k); }); if (currentScene === 'START' || currentScene === 'CODEX') render(); }
            }).catch(() => {});
            let paused = false;
            UnjungGame.onPause(() => { if (SCENARIOS[currentScene] && timerId) { clearInterval(timerId); timerId = null; paused = true; } });
            document.addEventListener('visibilitychange', () => { if (!document.hidden && paused && SCENARIOS[currentScene]) { paused = false; startTimer(); } });

            // 앱 시작
            render();
        });
    </script>
</body>
</html>
