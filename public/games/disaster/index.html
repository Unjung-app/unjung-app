<script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
                                  앱은 1.5초 뒤 결과 화면(한 판 더 / 나가기)으로 게임을 덮어요.
   UnjungGame.submitScore(n, { hold: true }) → 점수만 기록하고, 게임의 결과 화면을 계속 보여 줘요.
                                  그 화면의 '계속' 버튼에서 UnjungGame.done() 을 부르면 앱 결과 화면이 떠요.
   UnjungGame.done()            → (hold로 보낸 뒤) 앱 결과 화면 열기
   UnjungGame.getStudyMinutes() → 오늘 스터디 윗미 공부 시간(분). Promise<number> (연습용에선 0)
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n, opts) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n, hold: !!(opts && opts.hold) }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
    done() { if (inApp) ask('done'); },
    getStudyMinutes() { return inApp ? ask('study').then((m) => Math.max(0, Math.floor(Number(m) || 0))) : Promise.resolve(0); },
  };
  window.UnjungGame = api;
  ask('ready');
})();

</script>

/* 앱 안에서는 localStorage가 막혀 있어서 앱 계정 저장으로 대신한다(엔딩·최고 기록·숙이기 키). */
(function () {
  if (!window.UnjungGame || !UnjungGame.inApp) return;
  var mem = {}, t = 0, KEEP = ['uj', 'ujb', 'ujk'];
  function flush() { t = 0; var o = {}; KEEP.forEach(function (k) { if (k in mem) o[k] = mem[k]; }); UnjungGame.save(o).catch(function () {}); }
  var LS = { getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    setItem: function (k, v) { mem[k] = String(v); if (KEEP.indexOf(k) >= 0 && !t) t = setTimeout(flush, 1000); },
    removeItem: function (k) { delete mem[k]; }, clear: function () { mem = {}; },
    key: function (i) { return Object.keys(mem)[i] || null; }, get length() { return Object.keys(mem).length; } };
  try { Object.defineProperty(window, 'localStorage', { value: LS, configurable: true }); } catch (e) {}
  window.__ujLoad = UnjungGame.load().then(function (d) { if (d && typeof d === 'object') Object.assign(mem, d); return mem; });
  addEventListener('pagehide', function () { if (t) { clearTimeout(t); flush(); } });
})();
</script>

const ST={"EARTHQUAKE_1": {"d": "4층 일반 교실에서 수업을 듣던 중, 건물이 굉음을 내며 심하게 요동치기 시작했습니다. 천장의 형광등이 떨어질 듯 흔들리고 책상 위의 물건들이 쏟아집니다!", "c": [["지진이 멈출 때까지 가방을 메고 복도로 뛰쳐나간다", "흔들리는 건물에서 복도로 달려나가다 위에서 떨어진 유리 파편과 구조물에 크게 다쳤습니다.", ""], ["가장 튼튼해 보이는 창문 틀에 몸을 기댄다", "건물이 뒤틀리며 창문 유리가 산산조각 나 치명적인 상처를 입었습니다.", ""], ["즉시 책상 밑으로 들어가 다리를 꽉 잡고 몸을 웅크린다", "", "EARTHQUAKE_2"], ["교탁 위로 올라가 높은 곳에서 상황을 살핀다", "교탁 위는 천장 낙하물과 형광등에 가장 먼저 노출되는 위치였습니다.", ""], ["창문을 열고 4층에서 밖으로 뛰어내린다", "4층 높이에서 뛰어내리다 크게 다치고 말았습니다.", ""], ["흔들리는 형광등 아래에서 휴대폰으로 영상을 찍는다", "떨어진 형광등이 렌즈보다 먼저 당신을 찾았습니다.", ""], ["흔들림이 끝나기 전에 책상 밑에서 나와 친구들을 도우러 간다", "여진이 이어지는 중에 책상 밑을 벗어나다 쏟아진 형광등과 천장재에 맞고 말았습니다.", ""]]}, "EARTHQUAKE_2": {"d": "수 분 후, 가장 컸던 1차 진동이 멈췄습니다. 언제 여진이 올지 모르는 상황이므로 신속하게 학교 건물을 빠져나가야 합니다.", "c": [["엘리베이터를 타고 1층으로 신속히 내려간다", "지진으로 인해 끊어진 전력망 때문에 엘리베이터 안에 갇혀 고립되었습니다.", ""], ["가장 높은 5층 옥상으로 올라가 구조 헬기를 기다린다", "지진 발생 시 옥상은 붕괴 위험이 가장 크며, 고립되기 쉬운 최악의 장소입니다.", ""], ["가방으로 머리를 감싸고 계단으로 이동한다", "", "EARTHQUAKE_3"], ["교실 창가에서 선생님의 지시가 있을 때까지 대기한다", "여진으로 깨진 창문 유리와 낙하물이 쏟아졌습니다.", ""], ["휴대폰으로 부모님께 영상통화를 걸며 자리에 머문다", "통화에 정신이 팔린 사이 여진으로 천장 구조물이 무너져 내렸습니다.", ""]]}, "EARTHQUAKE_3": {"d": "계단을 내려가던 중, 강한 여진이 다시 찾아왔습니다. 계단이 크게 흔들립니다!", "c": [["놀라서 계단을 두세 칸씩 뛰어 내려간다", "균형을 잃고 계단에서 굴러떨어졌습니다.", ""], ["앞사람을 밀치며 먼저 내려가려 한다", "서로 뒤엉켜 넘어지며 계단에서 모두 큰 부상을 입었습니다.", ""], ["난간과 벽을 잡고 몸을 낮춘 채 가방으로 머리를 보호하며 멈출 때까지 기다린다", "", "EARTHQUAKE_4"], ["계단 한가운데 가만히 서서 눈을 질끈 감는다", "그대로 서 있다가 흔들림에 중심을 잃고 넘어졌습니다.", ""]]}, "EARTHQUAKE_4": {"d": "여진이 멈춘 뒤 운동장에 도착했습니다. 학생들이 하나둘 모여들고 있고, 건물 외벽에서는 콘크리트 파편이 간간이 떨어지고 있습니다.", "c": [["건물 외벽 바로 옆에 모여 앉아 쉰다", "외벽에서 떨어지는 콘크리트 파편에 맞고 말았습니다.", ""], ["두고 온 가방을 가지러 교실로 다시 올라간다", "가방은 소중했지만, 여진 속의 건물은 훨씬 더 위험했습니다.", ""], ["담장 옆 큰 나무 아래에서 쉰다", "여진으로 담장이 무너지며 나무와 함께 쓰러졌습니다.", ""], ["건물에서 멀리 떨어진 운동장 중앙으로 이동해 인원을 확인한다", "", "EARTH_CLEAR"], ["여진이 두려워 근처 건물 지하 주차장으로 들어가 숨는다", "지하 주차장 입구가 여진으로 무너지며 그 안에 고립되고 말았습니다.", ""]]}, "ZOMBIE_1": {"d": "2층 강당(체육관)에 모여있던 중, 3층 과학실 쪽에서 끔찍한 비명소리가 들려왔습니다. 정체불명의 바이러스가 퍼졌는지 피를 뒤집어쓴 좀비들이 계단을 통해 2층 복도로 쏟아져 내려오고 있습니다! 당장 이곳을 벗어나야 합니다.", "c": [["옥상으로 도망쳐 문을 굳게 잠근다", "옥상은 도망칠 곳이 없는 막다른 길입니다. 결국 문을 부수고 들어온 좀비들에게 당했습니다.", ""], ["중앙계단으로 내려가 1층 본관 교장실에 숨어들어 권총을 찾아본다", "", "ZOMBIE_GUN"], ["방송실로 가서 학교 전체에 구조 요청 방송을 한다", "방송실의 스피커 소리가 학교 안의 모든 좀비들을 방송실 앞으로 불러모으고 말았습니다.", ""], ["농구공과 배드민턴 라켓을 들고 좀비들에게 맞선다", "라켓은 한 번 휘두르자 부러졌고, 소란에 더 많은 좀비들이 몰려왔습니다.", ""], ["좀비들이 내려오는 반대 방향인 급식실 쪽 계단으로 내려간다", "", "ZOMBIE_2"], ["3층 과학실로 올라가 바이러스의 원인을 직접 조사한다", "호기심은 과학자의 덕목이지만, 오늘만큼은 생존자의 덕목이 아니었습니다.", ""], ["친구들과 소리치며 각자 흩어져 도망친다", "큰 소리가 좀비를 끌어들였고, 흩어진 사람들은 차례로 따라잡혔습니다.", ""], ["화재경보기를 눌러 학교 전체에 비상을 알린다", "경보음이 좀비들을 일제히 불러모았고, 도망칠 틈도 없이 둘러싸였습니다.", ""]]}, "ZOMBIE_2": {"d": "가까스로 1층 급식실에 도착했지만, 정문 쪽 복도에서도 이미 기괴한 울음소리와 함께 좀비들이 몰려드는 소리가 들립니다. 학교 밖으로 완전히 빠져나가려면 서둘러야 합니다.", "c": [["가장 문이 넓은 1층 운동장 정문으로 향한다", "가장 눈에 띄는 정문에는 이미 수많은 좀비들이 몰려있어 돌파가 불가능했습니다.", ""], ["넓고 시야가 트인 주차장 쪽으로 달린다", "사방이 뚫린 주차장에서는 은폐할 곳이 없어 달려오는 좀비들의 표적이 되었습니다.", ""], ["급식실 대형 냉동고 안으로 들어가 문을 닫고 숨는다", "냉동고는 안쪽에서 열리지 않는 경우가 많아 그 안에 갇히고 말았습니다.", ""], ["재활용장 뒷문을 이용해 몰래 빠져나간다", "", "ZOMBIE_3"], ["정문 쪽 복도에 남은 친구를 구하러 되돌아간다", "구하려던 친구는 이미 감염된 뒤였고, 몰려온 좀비들에게 둘러싸였습니다.", ""]]}, "ZOMBIE_3": {"d": "재활용장에 도착했습니다. 담장 너머로 도로가 보이지만 철문은 굵은 빗장으로 잠겨 있고, 철문 근처에서는 좀비 한 명이 어슬렁거리고 있습니다.", "c": [["철문을 발로 걷어차 부순다", "굉음이 학교 전체에 울려 퍼졌고, 사방에서 좀비들이 몰려왔습니다.", ""], ["빈 캔을 반대편으로 던져 좀비를 유인하고 소리 없이 빗장을 연다", "", "ZOMBIE_4"], ["재활용 수거함 뒤에 숨어 날이 밝기만 기다린다", "숨은 곳은 좀비들이 돌아다니는 길목이었고, 결국 발견되고 말았습니다.", ""], ["좀비에게 다가가 “혹시 아직 정상이세요?”라고 말을 걸어본다", "대답은 으르렁거림이었습니다. 대화는 실패했습니다.", ""]]}, "ZOMBIE_4": {"d": "재활용장을 빠져나와 학교 밖 골목에 섰습니다. 멀리서 비명소리와 사이렌이 뒤섞여 들립니다. 이제 어디로 가야 할까요?", "c": [["큰길로 전력질주해 버스 정류장에서 버스를 기다린다", "시끄러운 달리기에 좀비들이 몰려왔고, 버스는 끝내 오지 않았습니다.", ""], ["눈앞의 편의점에 들어가 유리문을 잠그고 숨는다", "유리문은 좀비들 앞에서는 얇은 종이와 다름없었습니다.", ""], ["두고 온 친구가 걱정되어 학교로 돌아간다", "마음은 따뜻했지만 상황은 냉정했습니다. 학교 안은 이미 좀비로 가득했습니다.", ""], ["골목길을 따라 조용히 이동해 인근 대피소로 향한다", "", "ZOMBIE_CLEAR"], ["안전해 보이는 아파트 단지로 들어가 현관 벨을 모두 누른다", "벨 소리에 놀란 이웃들이 문을 열었고, 소란을 듣고 달려온 좀비들까지 따라 들어왔습니다.", ""]]}, "TYPHOON_1": {"d": "역대급 강풍을 동반한 태풍이 상륙했습니다. 당신은 창문이 많은 미술실에 고립되어 있습니다. 비바람이 거세지며 커다란 창문들이 금방이라도 깨질 듯 무섭게 휘어집니다.", "c": [["창문이 깨지지 않게 몸으로 창틀을 꽉 누르며 버틴다", "결국 돌풍을 이기지 못한 유리가 산산조각 나며 파편에 치명상을 입었습니다.", ""], ["비를 맞더라도 1층 야외 운동장 중앙으로 뛰어 나간다", "운동장으로 날아온 날카로운 지붕 강판과 간판 파편에 휩쓸렸습니다.", ""], ["커튼으로 몸을 감싸고 창문 바로 옆 책상 밑에 숨는다", "깨진 유리 파편이 커튼과 책상 사이로 날아들어 다치고 말았습니다.", ""], ["창문에서 최대한 멀리 떨어진 복도 안쪽 내벽으로 이동해 낮은 자세로 몸을 숨긴다", "", "TYPHOON_2"], ["창문이 없는 중앙계단 지하 PS실 창고로 내려가 문을 닫는다", "폭우로 배수구가 넘치자 가장 낮은 지하 PS실 창고부터 순식간에 침수되었습니다. 좁은 공간에서 빠져나오지 못하고 갇히고 말았습니다.", ""], ["창문에 X자로 테이프를 붙이고 창가에서 지켜본다", "테이프는 유리가 깨지는 것을 막아주지 못했고, 파편이 그대로 날아왔습니다.", ""], ["돌풍이 잠잠해진 틈에 옥상으로 올라가 상황을 살핀다", "옥상에서 다시 몰아친 돌풍에 휩쓸리고 말았습니다.", ""], ["창문이 흔들리는 모습을 SNS 라이브로 중계한다", "시청자 수는 늘었지만, 깨진 창문 유리가 가장 먼저 중계 화면을 덮쳤습니다.", ""]]}, "TYPHOON_2": {"d": "창문에서 떨어진 안쪽 벽으로 대피하여 유리 파편의 위험은 피했습니다. 하지만 강풍으로 인해 노후된 건물이 버티지 못하고 복도 천장의 무거운 에어컨 닥트가 당신의 머리 위로 무너져 내리기 시작합니다!", "c": [["떨어지는 무거운 구조물을 양손으로 뻗어 막아낸다", "철제 닥트의 엄청난 무게를 맨몸으로 감당하지 못하고 압사당하고 말았습니다.", ""], ["머리를 두 팔로 감싸며 구석 바닥으로 납작 엎드린다", "", "TYPHOON_3"], ["무너지는 것을 보고 다시 창문이 있는 미술실로 도망친다", "미술실로 되돌아가는 순간 깨진 유리 파편과 강풍에 휩쓸려 쓰러졌습니다.", ""], ["휴대폰 손전등으로 천장 위를 비추며 상황을 살핀다", "살피는 사이 닥트가 그대로 낙하해 피할 틈이 없었습니다.", ""]]}, "TYPHOON_3": {"d": "닥트는 간신히 피했지만 곧 정전이 되었습니다. 게다가 천장 틈에서 물이 뚝뚝 떨어지며 바닥의 전선 쪽으로 번지고 있습니다.", "c": [["젖은 손으로 분전반을 열어 전원을 다시 올린다", "물과 전기의 조합은 최악이었습니다. 감전되고 말았습니다.", ""], ["물이 번지는 바닥을 걸어 전기 설비 쪽으로 향한다", "물에 젖은 바닥을 지나다 끊어진 전선에 감전되었습니다.", ""], ["전기 설비와 물이 번지는 곳에서 떨어진 벽쪽 마른 자리로 이동해 대기한다", "", "TYPHOON_4"], ["창가로 다가가 바깥 정전 상황을 확인한다", "돌풍에 창문 유리가 깨지며 파편이 얼굴로 날아들었습니다.", ""]]}, "TYPHOON_4": {"d": "거짓말처럼 바람이 잠잠해졌습니다. 태풍의 눈이 지나가고 있는 것 같습니다. 이제 어떻게 해야 할까요?", "c": [["이제 끝난 줄 알고 밖으로 나가 구경한다", "태풍의 눈이 지나가자 반대 방향에서 더 강한 후면 바람이 몰아쳤습니다.", ""], ["운동장에 떨어진 전선을 사진으로 남긴다", "끊어진 전선에는 아직 전기가 흐르고 있었습니다.", ""], ["우산을 펴고 집으로 하교한다", "우산은 0.5초 만에 날아갔고, 당신도 함께 날아갔습니다.", ""], ["아직 끝나지 않았다고 판단하고 안내방송이 있을 때까지 실내에서 대기한다", "", "TYPHOON_CLEAR"], ["피해 상황이 궁금해 건물 외벽을 따라 한 바퀴 돌아본다", "외벽에서 떨어진 간판과 타일 조각에 맞고 말았습니다.", ""]]}, "NUKES_1": {"d": "1층 행정실에 심부름을 온 순간, 고막을 찢을 듯한 요란한 민방위 사이렌과 함께 \"핵 미사일 공습 경보\"가 발령되었습니다. 폭발의 섬광과 치명적인 폭풍파가 덮치기 전까지 단 몇 초밖에 남지 않았습니다!", "c": [["창밖으로 미사일이 떨어지는 위치를 재빨리 확인한다", "핵폭발의 엄청난 열복사선과 섬광에 맨눈이 노출되어 즉각적으로 시력을 잃고 불탔습니다.", ""], ["행정실 나무 책상 밑으로 완전히 들어가 몸을 숨긴다", "거대한 폭풍파로 인해 건물 잔해와 책상이 부서지며 그 밑에 깔려버렸습니다.", ""], ["휴대폰을 꺼내 폭발 장면을 촬영한다", "렌즈를 향해 쏟아진 섬광에 시력을 잃었고, 폭풍파를 그대로 맞았습니다.", ""], ["창문 반대쪽 내벽에 팔꿈치와 무릎을 바닥에 대고 엎드려 배를 띄운다", "", "NUKES_2"], ["창가로 가서 유리가 깨지지 않게 커튼을 친다", "커튼은 폭풍파가 만든 유리 파편을 막아주지 못했습니다.", ""], ["옥상으로 올라가 높은 곳에서 대피한다", "옥상은 폭풍파와 열복사에 그대로 노출되는 가장 위험한 장소입니다.", ""]]}, "NUKES_2": {"d": "폭풍파가 지나가고 건물은 크게 흔들렸지만 무너지지는 않았습니다. 곧 방사성 낙진이 내릴 것으로 보입니다. 지금 어떻게 해야 할까요?", "c": [["바로 밖으로 나가 상황을 확인한다", "밖으로 나가자마자 방사성 낙진에 그대로 노출되었습니다.", ""], ["가족이 걱정되어 집으로 달려간다", "낙진이 내리는 거리를 달리다 치명적인 방사선에 노출되었습니다.", ""], ["유리창이 없는 건물 안쪽, 가능한 한 깊은 지하로 이동한다", "", "NUKES_3"], ["창문을 열어 연기가 어디로 가는지 확인한다", "열린 창문으로 방사성 먼지가 그대로 들어왔습니다.", ""], ["폭발 지점 방향으로 가서 피해를 직접 확인한다", "폭발 중심에 가까워질수록 방사선량이 급격히 높아졌고, 다시 돌아오지 못했습니다.", ""]]}, "NUKES_3": {"d": "지하에 도착했습니다. 겉옷과 신발에는 낙진 먼지가 묻어 있을 수 있습니다. 어떻게 해야 할까요?", "c": [["옷을 그대로 입은 채 매점에서 챙겨온 과자를 먹는다", "옷에 묻은 낙진이 음식과 함께 몸속으로 들어갔습니다.", ""], ["환기를 위해 지하 출입문을 열어 둔다", "열린 문틈으로 낙진이 계속 들어왔습니다.", ""], ["선반에 있던 소독약을 마신다", "소독약은 방사능 해독제가 아닙니다. 상황이 더 나빠졌을 뿐입니다.", ""], ["겉옷과 신발을 벗어 비닐봉지에 밀봉하고 몸의 먼지를 씻어낸다", "", "NUKES_4"]]}, "NUKES_4": {"d": "지하에서 하루가 지났습니다. 라디오에서는 지지직거리는 안내 방송이 흘러나옵니다. 이제 어떻게 해야 할까요?", "c": [["하루 지났으니 괜찮겠지 하고 밖으로 나가본다", "낙진 수치는 아직 위험한 수준이었습니다.", ""], ["친구가 말한 “방사능은 3시간이면 사라진다”를 믿고 나간다", "그 소문은 과학이 아니었습니다.", ""], ["라디오로 정부 안내 방송을 확인하며 지시가 있을 때까지 대피소에 머문다", "", "NUKES_CLEAR"], ["라디오를 끄고 잠을 자며 알아서 괜찮아지길 기다린다", "이동 지시를 놓쳐 대피 시기를 놓치고 말았습니다.", ""], ["답답하다며 마스크 하나만 쓰고 잠깐 바람을 쐬러 나간다", "마스크는 방사성 낙진 먼지를 완전히 막지 못했고, 잠깐의 외출이 치명적이었습니다.", ""]]}},TP={"EARTHQUAKE_1": "지진이 나면 몸을 낮추고(Drop), 머리를 보호하고(Cover), 흔들림이 멈출 때까지 버티세요(Hold on). 창문과 형광등, 높은 가구 근처는 피해야 합니다.", "EARTHQUAKE_2": "흔들림이 멈춘 뒤에는 엘리베이터 대신 계단으로 이동하고, 가방이나 방석으로 머리를 보호하세요. 옥상은 붕괴와 고립 위험이 큽니다.", "EARTHQUAKE_3": "이동 중 여진이 오면 난간과 벽을 잡고 몸을 낮추세요. 서로 밀고 뛰면 도미노처럼 넘어지는 2차 사고가 납니다.", "EARTHQUAKE_4": "밖으로 나오면 건물, 담장, 나무, 전선에서 멀리 떨어진 넓은 곳으로 모이세요. 한 번 나온 건물에는 다시 들어가지 않습니다.", "ZOMBIE_1": "위급 상황에서는 소음과 밀집이 위험을 키웁니다. 실제 감염병이나 재난에서도 침착하게 사람이 몰리지 않는 경로로 이동하는 것이 중요합니다.", "ZOMBIE_2": "넓은 정문과 개방된 공간은 사람이 한꺼번에 몰려 위험해집니다. 평소 비상구와 대피 경로가 몇 개인지 알아 두세요.", "ZOMBIE_3": "소리는 위험을 불러옵니다. 위급할수록 큰 소리를 내지 않고 침착하게 행동해야 합니다.", "ZOMBIE_4": "대피한 뒤에는 충동적으로 위험한 곳으로 돌아가지 말고, 지정 대피소와 구조 기관의 안내를 따르세요.", "TYPHOON_1": "태풍 때는 유리창에서 최대한 떨어지세요. 유리창에 X자로 붙이는 테이프는 파편 비산을 막는 효과가 거의 없습니다. 외출, 옥상, 운동장은 모두 금물입니다.", "TYPHOON_2": "강풍으로 천장 구조물이 떨어질 수 있습니다. 머리와 목을 감싸고 낮은 자세를 유지하세요.", "TYPHOON_3": "물에 젖은 상태로 전기 설비나 분전반을 만지면 감전됩니다. 정전과 누수가 함께 있으면 전기 설비에서 멀리 떨어지세요.", "TYPHOON_4": "태풍의 눈이 지나가도 반대편의 강풍이 다시 불어옵니다. 특보 해제와 안내방송이 있을 때까지 실내에 머무르세요.", "NUKES_1": "섬광은 절대 쳐다보지 말고 즉시 엎드려 눈을 감고 귀를 막으세요. 창문에서 멀리 떨어진 내벽 쪽이 상대적으로 안전합니다.", "NUKES_2": "폭풍파가 지나간 직후에도 바로 밖으로 나가지 말고, 두꺼운 벽으로 둘러싸인 건물 안쪽이나 지하로 이동하세요.", "NUKES_3": "낙진이 묻었을 수 있는 겉옷과 신발은 벗어 밀봉하고 몸을 씻으면 피폭량을 크게 줄일 수 있습니다. 환기는 금물입니다.", "NUKES_4": "실내에 머물며 정부의 공식 안내(라디오, 재난문자)를 따르세요. 확인되지 않은 소문을 믿고 움직이면 안 됩니다.", "ZOMBIE_GUN": "위험한 물건을 찾아 헤매느라 대피 시간을 놓치는 것이 가장 큰 위험입니다. 가장 안전한 선택은 즉시 거리를 벌리고 대피로로 이동하는 것입니다."};
Object.assign(ST,{
TFLOOD:{d:'정전된 복도 바닥으로 빗물이 번지기 시작합니다. 방송에서는 “1층 배수구가 역류해 저지대부터 침수 중”이라는 안내가 지직거리며 들립니다. 어떻게 할까요?',c:[['1층 현관 쪽으로 내려가 침수 상황을 직접 확인한다','1층으로 내려가자마자 불어난 빗물이 순식간에 차올라 휩쓸리고 말았습니다.',''],['물에 잠기기 전에 중앙계단 지하 PS실 창고로 내려가 문을 닫는다','폭우로 배수구가 넘치자 가장 낮은 PS실 창고부터 침수되었습니다. 좁은 공간에서 빠져나오지 못하고 갇히고 말았습니다.',''],['물이 닿지 않는 높은 층의 마른 자리에서 전기 설비와 떨어져 이동하지 않고 대기한다','','ok'],['젖은 바닥을 걸어 분전반이 있는 쪽으로 가 본다','물에 젖은 바닥을 걸어가다 끊어진 전선에 감전되었습니다.','']]},
