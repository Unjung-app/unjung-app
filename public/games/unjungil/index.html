<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>운중일생 — 시제품</title>
<style>
:root{
  --ink:#1d2433; --sub:#5b6476; --faint:#8a93a6; --card:#ffffffee; --line:#e3e7ef;
  --gold:#d9a514; --gold2:#fff4cc; --blue:#2f6fe4; --blue2:#e6efff; --red:#e05252; --green:#2f9e6a;
  --bg1:#bfe3ff; --bg2:#f2f9ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:#eef3f8}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:background 1.2s}
/* 상단 */
#top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
#top .who{flex:1;min-width:0}
#top .nm{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .meta{font-size:12px;color:var(--sub)}
.speed{display:flex;gap:4px}
.speed button{min-width:34px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;font-weight:700}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#btnMenu{width:36px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px}
/* 캐릭터 + 스탯 */
#hero{display:flex;gap:10px;padding:4px 12px 8px;align-items:center}
#avatar{width:92px;height:92px;flex:none;border-radius:20px;background:#ffffff88;position:relative;overflow:hidden;box-shadow:0 2px 10px #0001}
#avatar svg{width:100%;height:100%}
#place{position:absolute;right:4px;bottom:2px;font-size:20px}
#stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.st{font-size:11px;color:var(--sub)}
.st b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:4px;background:#0000000f;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
#tags{padding:0 12px 6px;display:flex;gap:4px;flex-wrap:wrap;min-height:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#ffffffaa;border:1px solid var(--line)}
.tag.gold{background:var(--gold2);border-color:var(--gold);font-weight:700}
/* 기록 */
#log{flex:1;overflow-y:auto;padding:6px 12px 14px;scroll-behavior:smooth}
.yr{margin:14px 0 4px;font-size:12px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px}
.yr::after{content:"";flex:1;height:1px;background:#0000001a}
.ln{font-size:14.5px;line-height:1.6;margin:3px 0;animation:fade .35s}
.ln.big{font-size:16px;font-weight:700}
.ln.sys{font-size:12.5px;color:var(--sub)}
.ln.fx{font-size:12px;color:var(--faint)}
.ln.gold{background:var(--gold2);border-left:3px solid var(--gold);padding:4px 8px;border-radius:6px}
.ln.memo{font-style:italic;color:#6a5a2a}
.ln.ach{background:#fff;border:1px solid var(--gold);border-radius:10px;padding:6px 10px;font-weight:700}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* 선택 시트 */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0002;padding:16px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s}
#sheet.on{transform:none}
#sheet h3{margin:0 0 6px;font-size:17px}
#sheet .txt{font-size:14.5px;line-height:1.65;color:#2b3345;white-space:pre-line;margin-bottom:12px}
.ch{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;margin:7px 0;min-height:48px;font-size:14.5px;line-height:1.45}
.ch:active{transform:scale(.99)}
.ch .d{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.ch.gold{border-color:var(--gold);background:linear-gradient(135deg,#fffaf0,#fff1c2);box-shadow:0 0 0 2px #f6d77a55;position:relative}
.ch.gold::before{content:"✨ 특수";position:absolute;right:10px;top:8px;font-size:11px;font-weight:800;color:#a57800}
.ch.rare{border-color:#8fb1f5;background:var(--blue2)}
.ch[disabled]{opacity:.45}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:96px;text-align:left}
.card .em{font-size:26px}
.card .t{font-weight:800;font-size:14px;margin-top:2px}
.card .s{font-size:11px;color:var(--faint);margin-top:2px}
.card.rare{border-color:#8fb1f5;background:var(--blue2)}
.card.gold{border-color:var(--gold);background:linear-gradient(135deg,#fffaf0,#ffe9a6);box-shadow:0 0 12px #f5c84299;animation:shine 2.4s infinite}
@keyframes shine{50%{box-shadow:0 0 22px #f5c842cc}}
/* 에너지 */
.en{display:flex;align-items:center;gap:8px;margin:6px 0}
.en .lab{width:92px;font-size:13.5px}
.en .pips{flex:1;display:flex;gap:3px}
.en .pips i{flex:1;height:12px;border-radius:3px;background:#e9edf3}
.en .pips i.on{background:var(--ink)}
.en .pips i.fix{background:#9aa3b5}
.en button{width:36px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.left{font-size:12.5px;color:var(--sub);margin:4px 0 8px}
.primary{display:block;width:100%;height:50px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;margin-top:10px}
.ghost{display:block;width:100%;height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:700;margin-top:8px}
/* 시작 화면·덮개 */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(180deg,#9fd3ff,#e9f6ff 60%,#fff);z-index:5}
.cover h1{font-size:44px;margin:4px 0;letter-spacing:2px}
.cover .han{font-size:15px;color:var(--sub);letter-spacing:6px}
.cover p{color:var(--sub);line-height:1.7;font-size:14px}
.cover .primary,.cover .ghost{max-width:320px}
.cloud{position:absolute;font-size:56px;opacity:.85;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateX(18px)}}
.hide{display:none!important}
#paused{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#1d2433e6;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;z-index:3}
/* 메뉴·도감 */
.panel{position:absolute;inset:0;background:#fff;z-index:6;overflow-y:auto;padding:16px}
.panel h2{margin:4px 0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;min-height:70px}
.cell .em{font-size:22px}
.cell.no{opacity:.35;filter:grayscale(1)}
.cell.gold{border-color:var(--gold);background:var(--gold2)}
#shareImg{width:100%;border-radius:16px;box-shadow:0 4px 18px #0002;margin:8px 0}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="who"><div class="nm" id="nm">운중일생</div><div class="meta" id="meta"></div></div>
    <div class="speed" id="speed"></div>
    <button id="btnMenu" aria-label="메뉴">☰</button>
  </div>
  <div id="hero">
    <div id="avatar"><div id="av"></div><div id="place"></div></div>
    <div id="stats"></div>
  </div>
  <div id="tags"></div>
  <div id="log"></div>
  <div id="paused" class="hide">⏸ 일시정지</div>
  <div id="sheet"></div>

  <div class="cover" id="cover">
    <div class="cloud" style="top:8%;left:6%">☁️</div><div class="cloud" style="top:16%;right:8%;animation-delay:-3s">☁️</div>
    <div class="han">雲 中 一 生</div>
    <h1>운중일생</h1>
    <p>태어날 곳은 고를 수 없지만,<br>꿈은 고를 수 있다.<br><b>당신의 선택이 한 사람의 일생을 만듭니다.</b></p>
    <button class="primary" id="btnNew">새로운 삶 시작</button>
    <button class="ghost hide" id="btnCont">이어서 살기</button>
    <button class="ghost" id="btnDex">직업 도감 · 업적</button>
    <p style="font-size:11.5px;margin-top:18px">v0.2 · made by 이호원</p>
  </div>
  <div class="panel hide" id="panel"></div>
</div>
  <script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
                                  앱은 1.5초 뒤 결과 화면(한 판 더 / 나가기)으로 게임을 덮어요.
   UnjungGame.submitScore(n, { hold: true }) → 점수만 기록하고, 게임의 결과 화면을 계속 보여 줘요.
                                  그 화면의 '계속' 버튼에서 UnjungGame.done() 을 부르면 앱 결과 화면이 떠요.
   UnjungGame.done()            → (hold로 보낸 뒤) 앱 결과 화면 열기
   UnjungGame.getStudyMinutes() → 오늘 스터디 윗미 공부 시간(분). Promise<number> (연습용에선 0)
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n, opts) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n, hold: !!(opts && opts.hold) }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
    done() { if (inApp) ask('done'); },
    getStudyMinutes() { return inApp ? ask('study').then((m) => Math.max(0, Math.floor(Number(m) || 0))) : Promise.resolve(0); },
  };
  window.UnjungGame = api;
  ask('ready');
})();
/* ======================= 앱 연결 코드 끝 ======================= */
</script>
<script>
'use strict';
/* ============================================================
   운중일생 — 엔진 (시제품 v0.1)
   - 장면은 모두 '데이터'(DATA.*)로 쓰고, 엔진은 그것을 보여 주고 결과를 적용한다.
   - 장면 형식: { id, title, text, choices:[{ t, d, gold, rare, if(S), check:{abil, base}, fx, flag, log, ok:{fx,flag,log}, fail:{...}, then(S,ok) }] }
     · fx 키: health/happy/rel/passion(생활), study/tech/art/body/lead/emp(능력치), money(만원), co.product 등(회사)
     · flag: 게임이 기억해 두는 값(문자열 또는 배열). 나중 장면의 if/text에서 S.flags로 확인
   ============================================================ */
const $ = (s) => document.querySelector(s);
const R = Math.random;
const pick = (a) => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = (items, wf) => { const ws = items.map(wf); const tot = ws.reduce((x, y) => x + y, 0); let r = R() * tot; for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; };
const QS = new URLSearchParams(location.search);
const FAST = QS.get('fast') === '1';   // 시험용: 대기 없이 진행
const AUTO = QS.get('auto') === '1';   // 시험용: 선택을 자동으로
const FORCE = AUTO ? QS.get('force') : null; // 시험용: 꿈 카드에 특정 직업을 넣고 고름
const SAVE_KEY = 'ujil-save-v2', DEX_KEY = 'ujil-dex-v1';
/* 저장: 브라우저에서는 localStorage, 앱 안(격리된 화면)에서는 앱 계정(UnjungGame.save/load, 10KB까지) */
const IN_APP = !!(window.UnjungGame && UnjungGame.inApp);
const MEM = {};
let appSaveT = 0;
function compactSave(v) { if (!v || !v.logTail) return v; return Object.assign({}, v, { logTail: v.logTail.slice(-25), story: (v.story || []).slice(-40), qc: undefined }); }
function flushApp() { clearTimeout(appSaveT); appSaveT = 0; try { UnjungGame.save({ s: compactSave(MEM[SAVE_KEY] || null), d: MEM[DEX_KEY] || null }).catch(() => {}); } catch (e) { /* */ } }
const store = {
  get(k) { if (IN_APP) return MEM[k] ? JSON.parse(JSON.stringify(MEM[k])) : null; try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { if (IN_APP) { MEM[k] = JSON.parse(JSON.stringify(v)); if (!appSaveT) appSaveT = setTimeout(flushApp, 1500); return; } try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
  del(k) { if (IN_APP) { delete MEM[k]; clearTimeout(appSaveT); appSaveT = setTimeout(flushApp, 300); return; } try { localStorage.removeItem(k); } catch (e) { /* */ } },
};
window.addEventListener('pagehide', () => { if (IN_APP && appSaveT) flushApp(); });

const STATS = [['health', '건강', '#2f9e6a'], ['happy', '행복', '#f0a020'], ['skill', '실력', '#2f6fe4'], ['rel', '관계', '#d1557a'], ['passion', '열정', '#e05252']];
const ABIL = { study: '학업', tech: '기술', art: '창의·예술', body: '신체', lead: '리더십', emp: '공감' };
const ABIL_KEYS = Object.keys(ABIL);
const LIFE_KEYS = ['health', 'happy', 'rel', 'passion'];
const BIRTH_YEAR = 2026;

let S = null;            // 지금 살고 있는 삶
let speed = 1, paused = false;

/* ---------------- 상태 ---------------- */
function skillOf(st) { const v = ABIL_KEYS.map((k) => st.abil[k]).sort((a, b) => b - a); return Math.round((v[0] + v[1] + v[2]) / 3); }
function age() { return S.age; }
function has(f) { return !!S.flags[f]; }
function setFlag(f) { if (Array.isArray(f)) f.forEach(setFlag); else if (f) S.flags[f] = true; }
function cnt(k, n = 1) { S.cnt[k] = (S.cnt[k] || 0) + n; }
function hasTrait(t) { return S.traits.includes(t); }
function fill(t) {
  if (typeof t === 'function') t = t(S);
  const val = { name: S.name, friend: S.friend, rival: S.rival, cof: S.cof || S.friend, co: S.co ? S.co.name : '회사' };
  t = String(t).replace(/\{(name|friend|rival|cof|co)\}\{(은는|이가|을를|와과)\}/g, (m, k, j) => val[k] + josa(val[k], j[0], j[1]));
  return t
    .replace(/\{name\}/g, S.name).replace(/\{given\}/g, S.name.slice(1))
    .replace(/\{friend\}/g, S.friend).replace(/\{rival\}/g, S.rival)
    .replace(/\{cof\}/g, S.cof || S.friend)
    .replace(/\{club\}/g, S.club ? DATA.clubs[S.club].n : '동아리')
    .replace(/\{dream\}/g, S.dream ? DATA.jobs[S.dream].n : '꿈')
    .replace(/\{job\}/g, S.job ? DATA.jobs[S.job].n : '일')
    .replace(/\{uni\}/g, S.uni || '대학')
    .replace(/\{co\}/g, S.co ? S.co.name : '회사')
    .replace(/\{은는\}/g, josa(S.name, '은', '는')).replace(/\{이가\}/g, josa(S.name, '이', '가'));
}
function josa(w, a, b) { const c = w.charCodeAt(w.length - 1); if (c < 0xac00 || c > 0xd7a3) return b; const jong = (c - 0xac00) % 28; if (a === '으로') return jong && jong !== 8 ? '으로' : '로'; return jong ? a : b; }

/* 능력치 성장: 타고난 재능과 특성이 배율 */
function growMul(k) {
  let m = 0.45 + (S.talent[k] / 100) * 0.6;
  for (const t of S.traits) { const d = DATA.traits[t]; if (d && d.mul && d.mul[k]) m *= d.mul[k]; }
  return m;
}
function applyFx(fx, quiet) {
  if (!fx) return '';
  const out = [];
  for (const [k, v0] of Object.entries(fx)) {
    let v = v0;
    if (typeof v === 'function') v = v(S);
    if (!v) continue;
    if (LIFE_KEYS.includes(k)) {
      if (k === 'health' && v < 0 && hasTrait('steel')) v = Math.round(v * 0.6);
      if (k === 'passion' && v > 0 && hasTrait('okto')) v = Math.round(v * 1.4);
      if (v > 0) v = v * clamp((105 - S.st[k]) / 60, 0.15, 1); // 높을수록 오르기 어렵다
      const before = S.st[k]; S.st[k] = clamp(S.st[k] + v, 0, 100); const d = Math.round(S.st[k] - before);
      if (d) out.push(STATS.find((s) => s[0] === k)[1] + (d > 0 ? ' +' : ' ') + d);
    } else if (ABIL[k]) {
      if (v > 0) v = v * growMul(k) * clamp((100 - S.abil[k]) / 70, 0.08, 1); // 높을수록 오르기 어렵다
      const before = S.abil[k]; S.abil[k] = clamp(S.abil[k] + v, 0, 100); const d = Math.round(S.abil[k] - before);
      if (d) out.push(ABIL[k] + (d > 0 ? ' +' : ' ') + d);
      if (v > 0 && !S.revealed.includes(k) && S.talent[k] >= 70 && S.abil[k] > 40) revealTalent(k, true);
    } else if (k === 'money') {
      S.money += v; out.push('돈 ' + (v > 0 ? '+' : '') + won(v));
    } else if (k.startsWith('co.') && S.co) {
      const key = k.slice(3); S.co[key] = (S.co[key] || 0) + v;
      if (key !== 'runway' && key !== 'equity') S.co[key] = clamp(S.co[key], 0, 100);

/* 판정: 기본값 + 능력치 보정 + 특성 + 운 → 5~95% */
function chance(c) {

  const ks = Array.isArray(ab) ? ab : [ab];
  const v = ks.reduce((x, k) => x + (ABIL[k] ? S.abil[k] : S.st[k] || 0), 0) / ks.length;
  let p = (c.base ?? 45) + (v - 50) * 0.7 + S.luck;

function padLog() { const sh = $('#sheet'), box = $('#log'); const h = sh.classList.contains('on') ? sh.offsetHeight : 0; box.style.paddingBottom = (h + 14) + 'px'; box.scrollTop = box.scrollHeight; }

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

/** 장면을 보여 주고 고른 선택지의 결과를 적용한다. 고른 선택지 객체를 돌려준다. */
async function scene(sc) {
  const opts = sc.choices.filter((c) => !c.if || c.if(S));
  if (!opts.length) return null;
  countQ();
  save();
  const title = fill(sc.title || '');
  const text = fill(sc.text || '');
  const html = '<h3>' + esc(title) + '</h3><div class="txt">' + esc(text) + '</div>' +
    opts.map((c, i) => {
      const cl = c.gold ? 'gold' : c.rare ? 'rare' : '';
      let d = c.d ? fill(c.d) : '';
      if (c.check) d = (d ? d + ' · ' : '') + '판정: ' + diffLabel(chance(c.check));
      return '<button class="ch ' + cl + '" data-i="' + i + '">' + esc(fill(c.t)) + (d ? '<span class="d">' + esc(d) + '</span>' : '') + '</button>';
    }).join('');
  openSheet(html);
  const i = await new Promise((res) => {
    $('#sheet').querySelectorAll('.ch').forEach((b) => b.addEventListener('click', () => res(+b.dataset.i), { once: true }));
    if (AUTO) setTimeout(() => { const gi = opts.findIndex((o) => o.gold); res(FORCE && gi >= 0 ? gi : Math.floor(R() * opts.length)); }, FAST ? 0 : 400);
  });
  closeSheet();
  const c = opts[i];
  line('▶ ' + fill(c.t), 'sys');
  await resolve(c);
  // 주의: 'then'이 있는 객체를 async 함수에서 돌려주면 Promise로 취급되므로 떼어 낸다

}
async function resolve(c) {
  let ok = true;
  if (c.check) { const r = roll(c.check); ok = r.ok; line(ok ? '— 성공!' : '— 실패…', ok ? 'big' : 'sys'); }
  const branch = c.check ? (ok ? c.ok : c.fail) : c;
  if (c.fx) applyFx(c.fx);
  if (branch && branch !== c) { if (branch.log) line(branch.log, branch.gold ? 'gold' : ''); applyFx(branch.fx); setFlag(branch.flag); if (branch.cnt) cnt(branch.cnt); if (branch.then) await branch.then(S, ok); }
  if (c.log && !c.check) line(c.log, c.gold ? 'gold' : '');
  setFlag(c.flag);
  if (c.cnt) cnt(c.cnt);
  if (c.then) await c.then(S, ok);
  refreshHud();
  return ok;
}
/* 데이터 묶음에서 조건에 맞는 장면 하나를 골라 실행 (이미 본 장면은 제외) */
async function randomScene(pool, n = 1) {
  for (let k = 0; k < n; k++) {
    if (!budgetOK()) return;
    const cand = pool.filter((sc) => (!S.seen[sc.id] || (sc.repeat && S.age - S.seen[sc.id] >= 6)) && (!sc.when || sc.when(S)));
    if (!cand.length) return;
    const sc = wpick(cand, (x) => x.w || 1);
    S.seen[sc.id] = Math.max(1, S.age);
    await beat(0.6);
    await scene(sc);
  }
}

/* ---------------- 선택 예산 ----------------
   운중고 밖에서는 1년에 평균 1~2번만 고르게 한다.
   한 해가 지날 때마다 1.3씩 쌓이고(최대 2.5) 선택할 때마다 1씩 쓴다.
   필수 장면(관문·창업 핵심)은 예산이 없어도 나오고, 덤 장면은 예산이 있을 때만 나온다. */
function inHS() { return String(STEPS[S.step] || '').startsWith('hs:'); }
function countQ() { S.qc = S.qc || {}; S.qc[S.age] = (S.qc[S.age] || 0) + 1; if (!inHS()) S.allow = (S.allow || 0) - 1; }
function budgetOK() { return inHS() || (S.allow || 0) >= 1; }
/* ---------------- 에너지 배분 ---------------- */
const EN = [['study', '공부·연습', '📚'], ['rest', '운동·휴식', '🏃'], ['people', '사람', '🤝'], ['fun', '놀이·취미', '🎮'], ['dream', '꿈 도전', '⭐']];
async function energy(label, fixed = {}, ask = true) {
  const fixTot = Object.values(fixed).reduce((a, b) => a + b, 0);
  const total = 10 - fixTot;
  let a = Object.assign({ study: 2, rest: 2, people: 2, fun: 2, dream: 2 }, S.lastEnergy || {});
  // 남은 칸에 맞추기
  let sum = EN.reduce((x, [k]) => x + a[k], 0);
  while (sum > total) { const k = EN.map((e) => e[0]).sort((x, y) => a[y] - a[x])[0]; a[k]--; sum--; }
  while (sum < total) { a[pick(EN)[0]]++; sum++; }
  if (!ask && S.lastEnergy) { S.lastEnergy = Object.assign({}, a); return a; }
  countQ();
  if (AUTO) { a = { study: 0, rest: 0, people: 0, fun: 0, dream: 0 }; for (let i = 0; i < total; i++) a[pick(EN)[0]]++; S.lastEnergy = a; return a; }
  save();
  const render = () => {
    const used = EN.reduce((x, [k]) => x + a[k], 0);
    openSheet('<h3>' + esc(label) + '</h3><div class="left">에너지 10칸을 나눠 쓰세요' + (fixTot ? ' (일·가족에 ' + fixTot + '칸 고정)' : '') + ' · 남은 칸 <b>' + (total - used) + '</b></div>' +
      Object.entries(fixed).map(([k, v]) => '<div class="en"><span class="lab">' + ({ work: '💼 일', care: '👶 가족' })[k] + '</span><span class="pips">' + '<i class="fix"></i>'.repeat(v) + '</span></div>').join('') +
      EN.map(([k, n, e]) => '<div class="en"><span class="lab">' + e + ' ' + n + '</span><button data-k="' + k + '" data-d="-1">−</button><span class="pips">' + Array.from({ length: total }, (_, i) => '<i class="' + (i < a[k] ? 'on' : '') + '"></i>').join('') + '</span><button data-k="' + k + '" data-d="1">+</button></div>').join('') +
      '<button class="primary" id="enOk"' + (used !== total ? ' disabled style="opacity:.5"' : '') + '>이대로 보내기</button>');
    $('#sheet').querySelectorAll('.en button').forEach((b) => b.onclick = () => {
      const k = b.dataset.k, d = +b.dataset.d; const used2 = EN.reduce((x, [kk]) => x + a[kk], 0);
      if (d > 0 && used2 >= total) return; if (d < 0 && a[k] <= 0) return; a[k] += d; render();
    });
  };
  render();
  await new Promise((res) => { $('#sheet').addEventListener('click', function h(e) { if (e.target.id === 'enOk' && !e.target.disabled) { $('#sheet').removeEventListener('click', h); res(); } }); });
  closeSheet();
  S.lastEnergy = Object.assign({}, a);
  return a;
}
/* 에너지 → 성장. focus: 공부·연습이 주로 키우는 능력치들 */
function grow(a, scale = 1, focus = null) {
  const f = focus || S.focus || ['study'];
  const fx = {};
  const add = (k, v) => { fx[k] = (fx[k] || 0) + v; };
  f.forEach((k) => add(k, a.study * 1.2 * scale / f.length));
  add('study', a.study * 0.35 * scale);
  add('health', (a.rest * 2.2 - 4) * scale); add('body', a.rest * 0.6 * scale);
  add('rel', (a.people * 2.4 - 4) * scale); add('lead', a.people * 0.5 * scale); add('emp', a.people * 0.5 * scale);
  add('happy', (a.fun * 2.6 - 5) * scale); add('art', a.fun * 0.4 * scale);
  add('passion', (a.dream * 2.4 - 3) * scale);
  if (S.dream) { const j = DATA.jobs[S.dream]; j.abil.forEach((k) => add(k, a.dream * 1.0 * scale / j.abil.length)); }
  if (a.study + a.dream >= 7) { add('happy', -4 * scale); add('health', -3 * scale); }
  if (a.fun + a.rest >= 7) { add('passion', -2 * scale); }
  for (const k in fx) fx[k] = Math.round(fx[k] * 10) / 10;
  applyFx(fx, true);
  // 평균 회귀: 행복·관계·열정은 돌보지 않으면 보통(50)으로 돌아간다
  ['happy', 'rel', 'passion'].forEach((k) => { S.st[k] = clamp(S.st[k] + (50 - S.st[k]) * 0.07 * scale, 0, 100); });
  // 나이에 따른 건강 감소
  if (S.age >= 40) S.st.health = clamp(S.st.health - (S.age - 38) * 0.08 * scale * (S.body === 'weak' ? 1.3 : S.body === 'strong' ? 0.7 : 1), 0, 100);
  refreshHud();
}

    (n, j) => n + '{은는} 회사를 그만두고 ' + j + josa(j, '으로', '로') + ' 새 출발을 했다고 했다.',

    (n, j) => n + '{은는} 요즘 ' + j + josa(j, '으로', '로') + ' 이름을 날리는 중이다. 다들 사인을 받았다.',
  ];
  line('— 그날 밤, 운중고 친구들의 근황 —', 'sys');
  others.forEach((n) => { const j = DATA.jobs[pick(Object.keys(DATA.jobs).filter((x) => DATA.jobs[x].tier !== 'gold' || R() < 0.1))].n; line(pick(fates)(n, j).replace('{은는}', josa(n, '은', '는')), 'memo'); });
  line('같은 교실에서 출발했는데, 다들 이렇게 다른 곳에 서 있다.', 'memo');
}

/* ---------------- 노년 ---------------- */
RUN.old = async () => {
  S.place = '🌇'; S.phaseName = '은퇴 후';
  if (!S.lifespan) {
    const avgH = S.st.health;
    S.lifespan = clamp(Math.round(S.lifeBase + (avgH - 55) / 4 + (S.body === 'strong' ? 3 : S.body === 'weak' ? -3 : 0) + rnd(-2, 4)), 68, 104);
  }
  while (S.age < 57) {
    // 일찍 일을 내려놓은 경우(엑싯·해임 후 등): 남은 중년
    setAge(S.age + 3);
    line(pick(S.exited || S.job === 'founder' ? ['후배 창업가들의 발표를 들으며 조언을 건넸다.', '작은 회사 몇 곳에 투자했다.', '강연 요청이 이어졌다.', ...FLAVOR.adult] : FLAVOR.adult));
    if (R() < 0.5) await randomScene(P.midlife, 1); else if (R() < 0.5) await randomScene(P.family, 1); else await beat();
  }
  if (S.age < 60) { setAge(60); line('일에서 한 걸음 물러났다.'); }
  while (S.age + 3 < S.lifespan) {
    setAge(S.age + 3);
    line(pick(FLAVOR.old));
    S.st.health = clamp(S.st.health - 2.5, 5, 100);
    if (R() < 0.7) await randomScene(P.old, 1); else await beat();
    if (S.child && S.age - S.child.born >= 16 && !S.childSchool) { S.childSchool = true; line('🏫 ' + S.child.name + '(이)가 운중고에 입학했다. 교문 앞에서 사진을 찍으며 한참 웃었다.', 'gold'); }
  }
  setAge(S.lifespan);
};
RUN.end = async () => {
  if (S.age >= 100) unlock('centenarian');
  const goldJob = Object.keys(S.jobYears).concat(S.job ? [S.job] : []).some((id) => DATA.jobs[id] && DATA.jobs[id].tier === 'gold') || S.ach.includes('principal');
  if (!goldJob && S.st.happy >= 65) unlock('ordinary');
  line('향년 ' + S.age + '세. {name}의 일생이 막을 내렸다.', 'big');
  await beat(1.5);
  const presets = ['구름 속에서 시작해, 구름 위에서 끝났다.', '후회 없이 살았다.', '사랑했던 모든 순간에 고맙다.', '꿈은 이루는 것보다 꾸는 동안이 더 좋았다.', '다시 태어나도 이 길을 고를 것이다.'];
  let words = pick(presets);
  if (!AUTO) {
    openSheet('<h3>마지막 한마디</h3><div class="txt">{name}의 삶에 남길 한마디. 공유 카드의 맺음말이 됩니다.</div>'.replace('{name}', esc(S.name)) +
      '<textarea id="lw" maxlength="40" placeholder="40자 이내">' + esc(words) + '</textarea>' +
      presets.map((p) => '<button class="ch" data-p="' + esc(p) + '">' + esc(p) + '</button>').join('') + '<button class="primary" id="lwOk">남기기</button>');
    $('#sheet').querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { $('#lw').value = b.dataset.p; });
    words = await new Promise((r) => { $('#lwOk').onclick = () => r(($('#lw').value || '').trim().slice(0, 40) || pick(presets)); });
    closeSheet();
  }
  S.words = words;
  line('"' + words + '"', 'memo');
  S.over = true;
  const d = dex(); d.lives = (d.lives || 0) + 1; store.set(DEX_KEY, d);
  store.del(SAVE_KEY);
  await beat(1);
  // 앱 기록: 업적 수와 살아온 해로 '인생 점수'를 남긴다(순위보다는 기념)
  try { UnjungGame.submitScore(S.ach.length * 100 + S.age, { hold: true }); } catch (e) { /* */ }
  if (IN_APP) flushApp();
  showCard();
};

/* ---------------- 공유 카드 ---------------- */
function lifeTitle() {
  const reg = regionName();
  if (S.ach.includes('moon')) return reg + '에서 달까지';
  if (S.ach.includes('billboard')) return reg + '에서 세계 무대까지';
  if (S.ach.includes('richest')) return reg + '에서 세계 1위까지';
  if (S.ach.includes('unicorn')) return '오피스텔에서 유니콘까지';
  if (S.ach.includes('returned_ceo')) return '돌아온 대표';
  if (S.ach.includes('principal')) return '다시, 운중고로';
  if (S.dreamChanges >= 2) return '세 번째 꿈의 주인';
  if (S.ach.includes('second_dream')) return '두 번째 꿈을 이룬 사람';
  if (S.ach.includes('child_dream')) return '어릴 적 꿈 그대로';
  if (S.ach.includes('ordinary')) return '조용히 빛난 사람';
  if (S.st.rel >= 80) return '사람 부자';
  if (S.st.passion >= 80) return '끝까지 꿈꾼 사람';
  const j = S.job ? DATA.jobs[S.job].n : '나';
  return '평생 ' + j;
}
function cardData() {
  const j = S.job ? DATA.jobs[S.job] : null;
  const dol = DATA.dol.find((d) => d.id === S.dol);
  const h3 = S.hopes.find((h) => h.label === '초등학교 3학년'); const hm = S.hopes.find((h) => h.label === '중학교 3학년');
  return {
    title: lifeTitle(),
    who: S.name + ' · ' + (S.gender === 'm' ? '남' : '여') + ' · ' + regionName() + ' · ' + S.quint + '분위',
    dol: dol ? dol.em + ' ' + dol.n : '-',
    hope: (h3 ? DATA.jobs[h3.job].n : '-') + ' → ' + (hm ? DATA.jobs[hm.job].n : '-'),
    school: (S.clubs.length ? [...new Set(S.clubs)].map((k) => DATA.clubs[k].n).join(' → ') : '-') + (S.traits.length ? ' · [' + S.traits.map((t) => DATA.traits[t].n).join(', ') + ']' : '') + (S.flags.president ? ' · 학생회장' : ''),
    dream: (S.firstDream ? DATA.jobs[S.firstDream].n : '-') + ' → ' + (j ? j.em + ' ' + j.n + (j.tier === 'gold' ? ' ✨' : '') : '-'),
    ach: S.ach.slice(-3).map((a) => DATA.achievements[a].em + ' ' + DATA.achievements[a].n),
    age: S.age, words: S.words || '',
  };
}
function showCard() {
  const cd = cardData();
  const cv = document.createElement('canvas'); cv.width = 720; cv.height = 1180;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1180); g.addColorStop(0, '#9fd3ff'); g.addColorStop(0.5, '#eef7ff'); g.addColorStop(1, '#ffe9d6');
  x.fillStyle = g; x.fillRect(0, 0, 720, 1180);
  x.fillStyle = '#ffffffdd'; roundRect(x, 36, 36, 648, 1108, 32); x.fill();
  const F = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  x.fillStyle = '#8a93a6'; x.font = '600 22px ' + F; x.fillText('雲中一生 · 운중일생', 72, 96);
  x.fillStyle = '#1d2433'; x.font = '800 46px ' + F; wrapText(x, cd.title, 72, 160, 576, 54);
  x.font = '500 24px ' + F; x.fillStyle = '#5b6476'; x.fillText(cd.who, 72, 250);
  const rows = [['🍼 돌잡이', cd.dol], ['✏️ 장래희망', cd.hope], ['🏫 운중고', cd.school], ['⭐ 꿈 → 실제', cd.dream], ['🏆 업적', cd.ach.join('  ') || '-']];
  let y = 310;
  for (const [k, v] of rows) { x.fillStyle = '#8a93a6'; x.font = '700 22px ' + F; x.fillText(k, 72, y); x.fillStyle = '#1d2433'; x.font = '500 25px ' + F; y = wrapText(x, v, 72, y + 36, 576, 34) + 26; }
  // 인생 그래프
  const gx = 72, gy = y + 10, gw = 576, gh = 170;
  x.fillStyle = '#8a93a6'; x.font = '700 22px ' + F; x.fillText('📈 인생 그래프 (행복 · 열정)', gx, gy);
  x.strokeStyle = '#e3e7ef'; x.lineWidth = 2; x.strokeRect(gx, gy + 14, gw, gh);
  const hs = S.hist.filter((p, i, a) => i === 0 || p[0] !== a[i - 1][0]); const maxA = Math.max(1, S.age);
  [[1, '#f0a020'], [2, '#e05252']].forEach(([idx, col]) => { x.strokeStyle = col; x.lineWidth = 4; x.beginPath(); hs.forEach((p, i) => { const px = gx + (p[0] / maxA) * gw, py = gy + 14 + gh - (p[idx] / 100) * gh; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke(); });
  x.fillStyle = '#5b6476'; x.font = '500 20px ' + F; x.fillText('0세', gx, gy + gh + 42); x.textAlign = 'right'; x.fillText(S.age + '세', gx + gw, gy + gh + 42); x.textAlign = 'left';
  y = gy + gh + 90;
  x.fillStyle = '#1d2433'; x.font = '800 30px ' + F; x.fillText('향년 ' + cd.age + '세', 72, y);
  x.fillStyle = '#6a5a2a'; x.font = 'italic 600 28px ' + F; wrapText(x, '"' + cd.words + '"', 72, y + 52, 576, 38);
  x.fillStyle = '#b0b7c6'; x.font = '500 18px ' + F; x.fillText('운중고 앱 학생 개발팀', 72, 1112);
  const url = cv.toDataURL('image/png');
  const txt = '☁️ 운중일생 — ' + cd.title + '\n' + cd.who + '\n돌잡이: ' + cd.dol + '\n장래희망: ' + cd.hope + '\n운중고: ' + cd.school + '\n꿈 → 실제: ' + cd.dream + '\n업적: ' + (cd.ach.join(', ') || '-') + '\n향년 ' + cd.age + '세 — "' + cd.words + '"';
  const p = $('#panel'); p.classList.remove('hide');
  p.innerHTML = '<h2>☁️ 한 사람의 일생</h2><img id="shareImg" alt="공유 카드" src="' + url + '"><a class="primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none" download="운중일생_' + esc(S.name) + '.png" href="' + url + '">이미지로 저장</a><button class="ghost" id="cpy">글로 복사</button>' + (IN_APP ? '<button class="primary" id="appDone" style="margin-top:8px">🏁 기록 남기고 마치기</button>' : '') + '<button class="ghost" id="again">새로운 삶 시작</button><button class="ghost" id="toDex">직업 도감 · 업적</button>';
  $('#cpy').onclick = () => { try { navigator.clipboard.writeText(txt); $('#cpy').textContent = '복사했어요'; } catch (e) { $('#cpy').textContent = '복사가 안 되는 환경이에요'; } };
  $('#again').onclick = () => { p.classList.add('hide'); start(true); };
  if ($('#appDone')) $('#appDone').onclick = () => { const b = $('#appDone'); b.disabled = true; b.textContent = '기록하는 중…'; flushApp(); setTimeout(() => UnjungGame.done(), 400); };
  $('#toDex').onclick = () => showDex(true);
  window.__lastCard = { title: cd.title, txt };
}
function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function wrapText(x, t, a, b, w, lh) { let line2 = ''; let y = b; for (const ch of String(t)) { if (x.measureText(line2 + ch).width > w) { x.fillText(line2, a, y); line2 = ch; y += lh; } else line2 += ch; } if (line2) x.fillText(line2, a, y); return y; }

/* ---------------- 도감 ---------------- */
function showDex(fromCard) {
  const d = dex();
  const jobs = Object.entries(DATA.jobs);
  const got = jobs.filter(([id]) => d.jobs[id]).length;
  const p = $('#panel'); p.classList.remove('hide');
  p.innerHTML = '<h2>📖 직업 도감 <span style="font-size:14px;color:#5b6476">' + got + ' / ' + jobs.length + '</span></h2><div class="grid3">' +
    jobs.map(([id, j]) => '<div class="cell ' + (d.jobs[id] ? (j.tier === 'gold' ? 'gold' : '') : 'no') + '"><div class="em">' + (d.jobs[id] ? j.em : '❔') + '</div>' + (d.jobs[id] ? esc(j.n) : (j.tier === 'gold' ? '✨ 특수' : '???')) + '</div>').join('') +
    '</div><h2 style="margin-top:20px">🏆 업적 <span style="font-size:14px;color:#5b6476">' + Object.keys(d.ach).length + ' / ' + Object.keys(DATA.achievements).length + '</span></h2><div class="grid3">' +
    Object.entries(DATA.achievements).map(([id, a]) => '<div class="cell ' + (d.ach[id] ? 'gold' : 'no') + '"><div class="em">' + (d.ach[id] ? a.em : '🔒') + '</div><b>' + esc(a.n) + '</b><div style="font-size:10.5px;color:#5b6476">' + (d.ach[id] ? esc(a.d) : '???') + '</div></div>').join('') +
    '</div><p style="color:#5b6476;font-size:13px">지금까지 살아 본 삶: ' + (d.lives || 0) + '번</p><button class="primary" id="dexClose">닫기</button>';
  $('#dexClose').onclick = () => { if (fromCard) showCard(); else p.classList.add('hide'); };
}

/* ---------------- 시작·메뉴 ---------------- */
function setupSpeed() {
  const box = $('#speed');
  box.innerHTML = [1, 2, 4, 8].map((v) => '<button data-v="' + v + '" class="' + (v === speed ? 'on' : '') + '">' + v + '×</button>').join('') + '<button data-v="p">' + (paused ? '▶' : '⏸') + '</button>';
  box.querySelectorAll('button').forEach((b) => b.onclick = () => { if (b.dataset.v === 'p') paused = !paused; else { speed = +b.dataset.v; paused = false; } $('#paused').classList.toggle('hide', !paused); setupSpeed(); });
}
function start(fresh) {
  $('#cover').classList.add('hide');
  $('#log').innerHTML = '';
  if (fresh || !S) newLife();
  else S.logTail.forEach(([t, c]) => drawLine(t, c));
  refreshHud();
  live().catch((e) => { console.error(e); line('⚠️ 오류가 났어요: ' + e.message, 'sys'); });
}
$('#btnNew').onclick = () => { if (store.get(SAVE_KEY) && !confirmNew()) return; start(true); };
let newArmed = false;
function confirmNew() {
  if (AUTO) return true;
  if (!IN_APP) return window.confirm('저장된 삶이 있어요. 새로 시작하면 지워집니다. 계속할까요?');
  // 앱 안에서는 확인 창이 막혀 있어서 두 번 누르게 한다
  if (newArmed) return true;
  newArmed = true; $('#btnNew').textContent = '한 번 더 누르면 저장된 삶이 지워져요';
  setTimeout(() => { newArmed = false; $('#btnNew').textContent = '새로운 삶 시작'; }, 4000);
  return false;
}
$('#btnCont').onclick = () => { S = store.get(SAVE_KEY); start(false); };
$('#btnDex').onclick = () => showDex(false);
$('#btnMenu').onclick = () => {
  paused = true; setupSpeed(); $('#paused').classList.remove('hide');
  const p = $('#panel'); p.classList.remove('hide');
  p.innerHTML = '<h2>메뉴</h2><button class="primary" id="mResume">계속하기</button><button class="ghost" id="mDex">직업 도감 · 업적</button><button class="ghost" id="mHome">처음 화면으로 (저장됨)</button>' +
    '<h3 style="margin-top:22px">지금의 나</h3><div style="font-size:13.5px;line-height:1.8;color:#2b3345">' + ABIL_KEYS.map((k) => ABIL[k] + ' ' + Math.round(S.abil[k]) + (S.revealed.includes(k) ? ' ✨' : '')).join(' · ') + '<br>꿈: ' + (S.dream ? DATA.jobs[S.dream].n : '-') + (S.traits.length ? '<br>특성: ' + S.traits.map((t) => DATA.traits[t].n).join(', ') : '') + '</div>';
  $('#mResume').onclick = () => { p.classList.add('hide'); paused = false; setupSpeed(); $('#paused').classList.add('hide'); };
  $('#mDex').onclick = () => showDex(false);
  $('#mHome').onclick = () => { save(); location.reload(); };
};
setupSpeed();
function pauseNow() { if (!S || S.over) return; paused = true; setupSpeed(); $('#paused').classList.remove('hide'); }
try { UnjungGame.onPause(pauseNow); } catch (e) { /* */ }
if (IN_APP) {
  $('#btnNew').disabled = true; $('#btnNew').textContent = '불러오는 중…';
  const ready = (d) => { if (d && d.s) MEM[SAVE_KEY] = d.s; if (d && d.d) MEM[DEX_KEY] = d.d; $('#btnNew').disabled = false; $('#btnNew').textContent = '새로운 삶 시작'; if (MEM[SAVE_KEY]) $('#btnCont').classList.remove('hide'); };
  let done = false; const once = (d) => { if (!done) { done = true; ready(d); } };
  UnjungGame.load().then(once).catch(() => once(null)); setTimeout(() => once(null), 8000);
} else if (store.get(SAVE_KEY)) $('#btnCont').classList.remove('hide');
if (AUTO) { speed = 8; setTimeout(() => start(true), 50); }

</script>
