<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>운중 디펜스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0f0c29;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
#app{--bg:radial-gradient(circle at 50% -10%,#5b34a8 0%,#251d63 45%,#0f0c29 100%);--txt:#fff;--sub:#c9c4ff;--p1:#332d7a;--p2:#241f5c;--pb:2px solid rgba(255,255,255,.12);--navA:#1d1850;--navB:#130f38;--navT:#9c97d8;--on1:#5b4ad6;--on2:#3f30a8;--onS:#2a1f7a;--lg1:#ff4f86;--lg2:#7a1f4a;--qb1:#5b4ad6;--qb2:#3f30a8;--qbS:#2a1f7a;position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg);color:var(--txt)}
#app.th1{--bg:linear-gradient(170deg,#ffe1ef 0%,#e6dcff 50%,#d6f3ff 100%);--txt:#3a2a5a;--sub:#8064a8;--p1:#ffffff;--p2:#fff3fa;--pb:2px solid #ffd0e6;--navA:#ffffff;--navB:#fff0f7;--navT:#b49ad6;--on1:#ff8fb3;--on2:#ff5d9e;--onS:#c2457a;--lg1:#ff8fb3;--lg2:#c2457a;--qb1:#b9a6ff;--qb2:#8f74f0;--qbS:#6a52c8}
#app.th2{--bg:radial-gradient(circle at 50% 0%,#2f5d46,#1c3a2c 60%,#122a1f);--txt:#f4f1e4;--sub:#cfe8d6;--p1:#2a503d;--p2:#1f3e2f;--pb:4px solid #8a5a32;--navA:#6b4426;--navB:#4a2e18;--navT:#e8cfa8;--on1:#a5703f;--on2:#7d5230;--onS:#4a2e18;--lg1:#f2c230;--lg2:#8a5a32;--qb1:#a5703f;--qb2:#7d5230;--qbS:#4a2e18}
#app.th3{--bg:radial-gradient(circle at 50% -10%,#0d3a66 0%,#071c36 50%,#030b17 100%);--txt:#e8fbff;--sub:#8fd8ff;--p1:#0c2846;--p2:#071a30;--pb:2px solid #18c8ff;--navA:#071a30;--navB:#030b17;--navT:#5fa8d0;--on1:#0fb5d8;--on2:#0a72a8;--onS:#05436a;--lg1:#00e5ff;--lg2:#0050c8;--qb1:#0fb5d8;--qb2:#0a72a8;--qbS:#05436a}
#app.th3 .panel{box-shadow:0 0 18px rgba(24,200,255,.35)}
#app.th4{--bg:repeating-linear-gradient(#fdf8ea 0 27px,#d6e4f5 27px 28px);--txt:#2a2a3a;--sub:#6b6f8a;--p1:#ffffff;--p2:#fffdf6;--pb:2px solid #e8dcc0;--navA:#fffaf0;--navB:#f5ecd8;--navT:#9a8f78;--on1:#ff9f1c;--on2:#f07d00;--onS:#b85c00;--lg1:#3a86ff;--lg2:#1d4aa8;--qb1:#3a86ff;--qb2:#2f6fe0;--qbS:#1d4aa8}
#app.th1::before,#app.th4::before{opacity:.25}
#app.th5{--bg:radial-gradient(circle at 50% -10%,#2a2a2a 0%,#0b0b0b 60%);--txt:#fff;--sub:#a8a8a8;--p1:#1c1c1c;--p2:#111;--pb:2px solid #fff;--navA:#111;--navB:#000;--navT:#8a8a8a;--on1:#fff;--on2:#dcdcdc;--onS:#6b6b6b;--onT:#111;--lg1:#6b6b6b;--lg2:#2a2a2a;--qb1:#2a2a2a;--qb2:#1a1a1a;--qbS:#000}
#app.th6{--bg:#f2f2f2;--txt:#111;--sub:#6b6b6b;--p1:#fff;--p2:#fff;--pb:2px solid #111;--navA:#fff;--navB:#f2f2f2;--navT:#9a9a9a;--on1:#111;--on2:#000;--onS:#6b6b6b;--onT:#fff;--lg1:#111;--lg2:#6b6b6b;--qb1:#111;--qb2:#000;--qbS:#6b6b6b}
#app.th5::before,#app.th6::before{display:none}
#app.th5 .gbtn,#app.th5 .qbtn{background:linear-gradient(#fff,#dcdcdc);color:#111;text-shadow:none;box-shadow:0 6px 0 #6b6b6b}
#app.th5 .gbtn.gray,#app.th5 .qbtn{background:linear-gradient(#3a3a3a,#222);color:#fff;box-shadow:0 6px 0 #000;border:2px solid #fff}
#app.th6 .gbtn,#app.th6 .qbtn{background:linear-gradient(#222,#000);color:#fff;text-shadow:none;box-shadow:0 6px 0 #8a8a8a}
#app.th6 .gbtn.gray,#app.th6 .qbtn{background:#fff;color:#111;border:2px solid #111;box-shadow:0 6px 0 #111}
#app.th5 .qbtn.glow,#app.th6 .qbtn.glow{animation:wiggle 1.6s ease-in-out infinite}
#app.th5 .pill,#app.th5 .lvb,#app.th6 .pill,#app.th6 .lvb{filter:grayscale(1)}
#app.th6 .pill,#app.th6 .lvb,#app.th6 .rbtn{background:#111;border-color:#111;color:#fff}
#app.th5 .ccard,#app.th6 .ccard,#app.th5 .dk,#app.th6 .dk,#app.th5 .node .dot,#app.th6 .node .dot{filter:grayscale(1) contrast(1.15)}
#app.th5 .tag,#app.th6 .tag{background:#fff;color:#111}#app.th6 .tag{background:#111;color:#fff}
#app.th5 .ribbon,#app.th6 .ribbon{background:#fff;color:#111;text-shadow:none;box-shadow:0 6px 0 #6b6b6b}
#app.th5 .stars,#app.th6 .stars{filter:grayscale(1) brightness(1.4)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 14px 92px;gap:14px;overflow-y:auto}
.scr.on{display:flex}
.scr>*{flex-shrink:0}
p,div,span,small,b{font-size:15px}
.c{text-align:center}
/* 버튼 */
.gbtn{border:0;border-radius:18px;min-height:56px;padding:0 18px;font-family:inherit;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 6px 0 #b86400,0 10px 18px rgba(0,0,0,.35);cursor:pointer;transition:transform .05s}
.gbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b86400}
.gbtn.green{background:linear-gradient(#63f29a,#1fb35d);box-shadow:0 6px 0 #0e7a3a,0 10px 18px rgba(0,0,0,.35)}
.gbtn.blue{background:linear-gradient(#62cdff,#2f78f0);box-shadow:0 6px 0 #1c4aa8,0 10px 18px rgba(0,0,0,.35)}
.gbtn.pink{background:linear-gradient(#ff8fb3,#ff4f86);box-shadow:0 6px 0 #b8245a,0 10px 18px rgba(0,0,0,.35)}
.gbtn.gray{background:linear-gradient(#8f92b8,#5d6090);box-shadow:0 6px 0 #393b63,0 10px 18px rgba(0,0,0,.35)}
.gbtn.sm{min-height:46px;font-size:16px;border-radius:14px;padding:0 12px}
.gbtn:disabled{filter:grayscale(1) brightness(.7)}
.rbtn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font-size:20px;font-family:inherit}
/* 상단 바 / 알약 */
.topbar{display:flex;gap:8px;align-items:center}
.topbar>.rbtn{flex-shrink:0}.topbar>.lvb{flex-shrink:1;min-width:0}.lvb .xb{flex-shrink:1;min-width:16px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 12px 3px 4px;font-weight:900;font-size:16px;white-space:nowrap}
.pill .i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(#ffe066,#f7b500)}
.pill .i.r{background:linear-gradient(#ff7b8f,#e5334f)}
.pill .i.p{background:linear-gradient(#ffa6d1,#ff5d9e)}
.pill .i.s{background:linear-gradient(#a98bff,#6c4ce0)}
.pill .i.ci{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23f 45%,#e39b00);box-shadow:inset 0 0 0 2.5px #f2a900,inset 0 0 0 5px #ffe48a,0 2px 0 #b87400}
.pill .i.ci::after{content:'★';color:#c98400;font-size:15px;font-weight:900;text-shadow:0 1px 0 #fff3b0}
.panel{background:linear-gradient(var(--p1),var(--p2));border:var(--pb);border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.logo{text-align:center;font-weight:900;font-size:42px;letter-spacing:-1px;line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--lg1),0 8px 0 var(--lg2),0 12px 24px rgba(0,0,0,.35)}
.tag{display:inline-block;background:linear-gradient(#ff8fb3,#ff4f86);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
/* 하단 메뉴 */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(var(--navA),var(--navB));border-top:2px solid rgba(255,255,255,.1);z-index:6}
.nav button{flex:1;min-height:58px;border:0;border-radius:16px;background:none;color:var(--navT);font-family:inherit;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nav button b{font-size:24px}
.nav button.on{background:linear-gradient(var(--on1),var(--on2));color:var(--onT,#fff);box-shadow:0 4px 0 var(--onS)}
/* 로비 */
.stagecard{position:relative;text-align:center;padding:12px 8px 12px;overflow:hidden}
.stagecard .big{font-size:56px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.stagecard h2{font-size:26px;font-weight:900;margin-top:6px}
@media (max-height:780px){#lobby .logo{font-size:38px;line-height:1}#lQuote{display:none}#lobby{gap:10px}#lobby .qbtn{min-height:52px}}
@media (max-height:690px){#lobby .logo{font-size:32px}#lobby .tag{display:none}.sc2a img{max-height:96px}}
.sc2{display:grid;grid-template-columns:44% 1fr;gap:8px;align-items:center;padding:0 40px}.stagecard .arrow{width:44px;height:44px;font-size:18px}.stagecard .arrow[data-d='-1']{left:2px!important}.stagecard .arrow[data-d='1']{right:2px!important}.sc2 .boss{font-size:14px;padding:3px 8px;margin-top:0}.sc2 h2{font-size:22px;margin-top:2px}.sc2 .stars{margin:2px 0 4px}.sc2a img{max-height:128px;object-fit:contain}
.boss{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;margin-top:8px;font-weight:800}
.stars{color:#ffd23f;font-size:24px;letter-spacing:2px;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:900}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
/* 지도 */
.node{display:flex;align-items:center;gap:12px;border:0;font-family:inherit;color:var(--txt);text-align:left;background:none;width:100%}
.node .dot{width:76px;height:76px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(#6f5ae8,#4733b8);box-shadow:0 6px 0 #2a1f7a,0 0 0 4px rgba(255,255,255,.12)}
.node.done .dot{background:linear-gradient(#63f29a,#1fb35d);box-shadow:0 6px 0 #0e7a3a,0 0 0 4px rgba(255,255,255,.15)}
.node.lock{opacity:.4}
.node .t b{font-size:18px;font-weight:900;display:block}
.node .t small{font-size:14px;color:var(--sub)}
.node.r{flex-direction:row-reverse;text-align:right}
.link{width:6px;height:22px;margin:0 auto;border-left:6px dotted rgba(255,255,255,.25)}
/* 카드 */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{position:relative;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 6px 0 var(--d),0 10px 18px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.25)}
.ccard .art{width:100%;height:84px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:52px}
.ccard{color:#fff}
.ccard .lv{color:#fff;position:absolute;top:4px;left:4px;background:#130f38;border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:1px 8px;font-weight:900;font-size:14px}
.ccard .nm{font-weight:900;font-size:16px}
.ccard .ds{font-size:14px;opacity:.9;text-align:center;line-height:1.35}
.lvbar{width:100%;height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.lvbar i{display:block;height:100%;background:#ffd23f}
.ccard.lock{filter:grayscale(1) brightness(.6)}
.rar-c{--a:#4fb3ff;--b:#2f6fe0;--d:#1d4aa8}
.rar-r{--a:#c08bff;--b:#7b3fe0;--d:#4f22a3}
.rar-e{--a:#ffb347;--b:#ff7b1c;--d:#b84f00}
.rar-l{--a:#fff0a0;--b:#f2b705;--d:#9a6a00}
/* 전투 */
#bv{position:absolute;inset:0;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px;z-index:3}
#hud .wave{flex:1;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;text-align:center;position:relative;overflow:hidden}
#hud .wave i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f86,#ffb347);opacity:.55;transition:width .3s}
#hud .wave span{position:relative;font-size:14px}
#bGold.bump{animation:bump .25s;display:inline-block}
@keyframes bump{50%{transform:scale(1.4)}}
#deck{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(var(--dc,6),minmax(0,1fr));gap:5px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(19,15,56,0),#130f38 30%);z-index:3}
.dk{flex:1;min-width:0;height:76px;border-radius:14px;border:2px solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 4px 0 var(--d)}
.dk{touch-action:none}
.dk2 .dk{height:62px}.dk2 .dk b img{width:42px!important;height:42px!important}.dk2 #ctrl{bottom:167px}.dk2 #sheet{bottom:163px}
.dk img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.dk b{font-size:28px;line-height:1}
.dk small{font-size:14px;font-weight:900;background:rgba(0,0,0,.35);border-radius:8px;padding:0 6px}
.dk.sel{transform:translateY(-8px);border-color:#fff;box-shadow:0 4px 0 var(--d),0 0 0 3px #ffd23f,0 0 18px #ffd23f}
.dk:disabled{filter:grayscale(1) brightness(.6)}
#ctrl{position:absolute;left:10px;right:10px;bottom:100px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3;pointer-events:none}
#ctrl>*{pointer-events:auto}
#bNext{min-width:150px}
#bUlt{position:relative;margin-left:auto;margin-right:8px;flex-shrink:0;pointer-events:auto;z-index:3;width:58px;height:58px;border-radius:50%;border:0;padding:0;color:#fff;font-family:inherit;background:conic-gradient(#ffd23f var(--p,0%),rgba(0,0,0,.45) 0);box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.85}
#bUlt::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#2a1f6e;z-index:-1}
#bUlt{isolation:isolate}
#bUlt span{font-size:24px;line-height:1;filter:grayscale(1)}
#bUlt small{font-size:14px;font-weight:900}
#bUlt.full{opacity:1;animation:pulse .8s ease-in-out infinite;box-shadow:0 0 18px #ffd23f,0 4px 12px rgba(0,0,0,.4)}
#bUlt.full span{filter:none}
#sheet{position:absolute;left:8px;right:8px;bottom:96px;z-index:5;display:none;flex-direction:column;gap:10px}
#sheet.on{display:flex}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;z-index:4;pointer-events:none;font-size:30px;font-weight:900;text-shadow:0 3px 0 #ff4f86,0 6px 0 #7a1f4a,0 8px 20px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:scale(1)}
#banner.big{font-size:22px;color:#fff;text-shadow:0 2px 0 #ff4f86,0 0 8px rgba(0,0,0,.5)}
/* 결과 */
#result{background:rgba(10,8,30,.75);justify-content:center;padding:14px}
.ribbon{margin:0 auto;background:linear-gradient(#ffd23f,#ff9f1c);color:#fff;font-weight:900;font-size:26px;padding:10px 34px;border-radius:14px;box-shadow:0 6px 0 #b86400;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ribbon.lose{background:linear-gradient(#8f92b8,#5d6090);box-shadow:0 6px 0 #393b63}
.rstars span{display:inline-block;font-size:52px;color:#4a4580;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.rstars span.on{color:#ffd23f;animation:pop .45s both}
.rstars span:nth-child(2).on{animation-delay:.2s}
.rstars span:nth-child(3).on{animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#modal{position:absolute;inset:0;background:rgba(10,8,30,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#mCard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:rgba(0,0,0,.75);border:2px solid rgba(255,255,255,.2);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;font-weight:800;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#app::before{content:"";position:absolute;inset:-50%;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 70% 60%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,230,120,.5),transparent),radial-gradient(1.5px 1.5px at 85% 15%,rgba(255,160,220,.5),transparent);background-size:220px 220px;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{to{transform:translate(220px,220px)}}
.lvb{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px 3px 3px}
.lvb .n{width:32px;height:32px;border-radius:50%;background:linear-gradient(#ff8fb3,#ff4f86);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;box-shadow:0 2px 0 #b8245a}
.lvb .xb{width:54px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.lvb .xb i{display:block;height:100%;background:linear-gradient(90deg,#63f29a,#ffd23f)}
.quick{display:flex;gap:10px}
.gcd{min-width:0;overflow:hidden;word-break:keep-all;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid var(--c);box-shadow:0 0 10px var(--c) inset;animation:gpop .35s both}
.gshine{box-shadow:0 0 16px var(--c),0 0 10px var(--c) inset}
@keyframes gpop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.gbtn[disabled]{opacity:.45}
.gwear{min-height:30px;padding:2px 10px;border:0;border-radius:10px;font-family:inherit;font-size:13px;font-weight:900;color:#3a2200;background:linear-gradient(#ffe27a,#ffb13b);box-shadow:0 2px 0 #b86f00}
.ganim{position:relative;width:180px;height:180px;border:0;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 68%);font-family:inherit;animation:gglow var(--d) ease-in forwards;overflow:visible}
.gtk{position:relative;z-index:2;display:block;font-size:84px;line-height:180px;animation:gshake var(--d) ease-in forwards}
.gflash{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 30%,transparent 70%);opacity:0;animation:gfl var(--d) ease-in forwards;pointer-events:none;z-index:3}
.gring{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 14px var(--c);opacity:0;animation:gring calc(var(--d)*.5) ease-out calc(var(--d)*.15) 2;pointer-events:none}

<script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
                                  앱은 1.5초 뒤 결과 화면(한 판 더 / 나가기)으로 게임을 덮어요.
   UnjungGame.submitScore(n, { hold: true }) → 점수만 기록하고, 게임의 결과 화면을 계속 보여 줘요.
                                  그 화면의 '계속' 버튼에서 UnjungGame.done() 을 부르면 앱 결과 화면이 떠요.
   UnjungGame.done()            → (hold로 보낸 뒤) 앱 결과 화면 열기
   UnjungGame.getStudyMinutes() → 오늘 스터디 윗미 공부 시간(분). Promise<number> (연습용에선 0)
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n, opts) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n, hold: !!(opts && opts.hold) }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
    done() { if (inApp) ask('done'); },
    getStudyMinutes() { return inApp ? ask('study').then((m) => Math.max(0, Math.floor(Number(m) || 0))) : Promise.resolve(0); },
  };
  window.UnjungGame = api;
  ask('ready');
})();
/* ======================= 앱 연결 코드 끝 ======================= */
</script>

function auInit(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(AU.ctx){ if(AU.ctx.state!=='running') AU.ctx.resume().catch(()=>{}); return; }
  try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  AU.ctx.resume&&AU.ctx.resume().catch(()=>{});
  try{ const b=AU.ctx.createBuffer(1,1,22050), s=AU.ctx.createBufferSource(); s.buffer=b; s.connect(AU.ctx.destination); s.start(0); }catch(e){}
  AU.bg=AU.ctx.createGain(); AU.fx=AU.ctx.createGain(); AU.bg.connect(AU.ctx.destination); AU.fx.connect(AU.ctx.destination);
  applyVol(); if(AU.want){ const w=AU.want; AU.want=null; playBgm(w); }
  setInterval(schedBgm,30);
}

function playBgm(n){ if(!AU.ctx){ AU.want=n; return; } if(AU.song===n) return; AU.song=n; AU.step=0; AU.next=AU.ctx.currentTime+0.06; }

function schedBgm(){
  const c=AU.ctx; if(!c||!AU.song||!S.set.bgm) return; const sg=SONGS[AU.song], sp=60/sg.bpm/2;
  if(AU.next<c.currentTime-0.5) AU.next=c.currentTime+0.05;
  while(AU.next<c.currentTime+0.15){
    const st=AU.step, bar=Math.floor(st/8)%4, ch=sg.ch[bar], w=AU.next, off=w-c.currentTime;
    if(st%4===0) tone(mf(ch[0]-24),sp*3.5,'triangle',0.5,off,0,AU.bg);
    tone(mf(ch[st%3]+(st%8>=4?12:0)),sp*0.9,'square',0.16,off,0,AU.bg);
    if(st%2===0){ const mi=sg.mel[(st/2)%8]; tone(mf(ch[mi]+12),sp*1.8,'triangle',0.22,off,0,AU.bg); }
    if(sg.drum){ if(st%4===0) tone(150,0.12,'sine',0.6,off,45,AU.bg); if(st%2===1) noise(0.04,0.18,w,AU.bg); if(sg.drum>1&&st%8===4) noise(0.12,0.3,w,AU.bg,1500); }
    AU.next+=sp; AU.step++;
  }
}

const bv=$('#bv'); let ctx=bv.getContext('2d');
let W=360,H=640,DPR=1,TS=48,CX=180,OY=90,B=null,last=performance.now(),speed=1;
const KY=0.92, HZ=0.75;
const fz=gy=>0.74+0.26*gy/ROWS;
function P3(gx,gy,h){ const f=fz(gy); return [CX+(gx-COLS/2)*TS*f, OY+TS*KY*(0.74*gy+0.13*gy*gy/ROWS)-(h||0)*TS*HZ*f, f]; }
let DK2=false;
function deckLayout(){ try{ if(!B) return; }catch(e){ return; } const n=deckCards().length||1, w=$('#app').getBoundingClientRect().width, two=(w-16-5*(n-1))/n<58; DK2=two; $('#battle').classList.toggle('dk2',two); $('#deck').style.setProperty('--dc',two?Math.ceil(n/2):n); }
function resize(){
  deckLayout(); const r=$('#app').getBoundingClientRect(); W=r.width; H=r.height; DPR=Math.min(1.5,window.devicePixelRatio||1);
  bv.width=W*DPR; bv.height=H*DPR; bv.style.width=W+'px'; bv.style.height=H+'px';
  const avail=H-70-(DK2?257:190); TS=Math.min(W/(COLS*1.02),avail/(KY*9.57+0.9)); CX=W/2;
  const bh=TS*KY*9.57; OY=70+TS*0.7+Math.max(0,(avail-bh-TS*0.9)/2);
}
window.addEventListener('resize',()=>{ resize(); LB.lay=null; LB.dim=''; });
function cellAt(sx,sy){
  const a=0.13/ROWS, b=0.74, c=-(sy+0.18*TS*HZ*0.9-OY)/(TS*KY);
  const gy=(-b+Math.sqrt(b*b-4*a*c))/(2*a); const gx=(sx-CX)/(TS*fz(gy))+COLS/2;
  const x=Math.floor(gx), y=Math.floor(gy); if(x<0||y<0||x>=COLS||y>=ROWS) return null; return [x,y];
}
function shade(hex,a){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; const f=v=>clamp(Math.round(a<0?v*(1+a):v+(255-v)*a),0,255); return 'rgb('+f(r)+','+f(g)+','+f(b)+')'; }
function quad(p,fill){ ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); for(let i=1;i<4;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
function emo(e,x,y,sz){ ctx.font=Math.round(sz)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e,x,y); }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(x0,y0,x1,y1,h0,h1,col){
  const cx=(x0+x1)/2;
  if(cx<COLS/2) quad([P3(x1,y0,h1),P3(x1,y1,h1),P3(x1,y1,h0),P3(x1,y0,h0)],shade(col,-0.32));
  else quad([P3(x0,y0,h1),P3(x0,y1,h1),P3(x0,y1,h0),P3(x0,y0,h0)],shade(col,-0.32));
  quad([P3(x0,y1,h1),P3(x1,y1,h1),P3(x1,y1,h0),P3(x0,y1,h0)],shade(col,-0.2));
  quad([P3(x0,y0,h1),P3(x1,y0,h1),P3(x1,y1,h1),P3(x0,y1,h1)],shade(col,0.12));
}

function rasterPath(wp){ const cells=new Set(); for(let i=0;i<wp.length-1;i++){ let [x,y]=wp[i]; const [x2,y2]=wp[i+1]; const dx=Math.sign(x2-x), dy=Math.sign(y2-y); while(true){ if(x>=0&&x<COLS&&y>=0&&y<ROWS) cells.add(x+','+y); if(x===x2&&y===y2) break; x+=dx; y+=dy; } } return cells; }

  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ if(pc.has(x+','+y)) continue; const a4=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>pc.has((x+a)+','+(y+b))), a8=[[1,1],[-1,1],[1,-1],[-1,-1]].some(([a,b])=>pc.has((x+a)+','+(y+b))), hv=hsh(x,y,si+3); if(a4||a8) spots.add(x+','+y); }
  const deco=[]; for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ const k=x+','+y; if(!pc.has(k)&&!spots.has(k)&&hsh(x,y,si+5)<0.75) deco.push([x,y]); }
  B={si,pc,spots,deco,wp:wpc.map(([x,y])=>[x+.5,y+.5]),towers:[],mobs:[],proj:[],fx:[],life:20,gold:Math.min(1000,150+si*50),wave:0,state:'build',queue:[],spawnT:0,cd:0,score:0,kills:0,shake:0,paused:false,over:false,sel:null,selCard:null,t:0,total:1,left:0,undo:[],ult:0,dc:dc||null};
  if(dc){ if(dc.mod.id==='poor') B.gold=100; if(dc.mod.id==='rich') B.gold=250; }
  show('battle'); closeSheet(); renderDeck(); updHud(); playBgm('battle'); misReset();
  let mid; do{ mid=rnd()*MIDS.length|0; }while(mid===S.lastMid); B.mid=mid; S.lastMid=mid; save(); toast(dc?'🔥 오늘의 도전 · '+dc.mod.t:st.n+' · 카드를 빛나는 칸으로 끌어다 놓아요!');
}

  const c=CARDS[t.k], st=towerStats(t), uc=upgCost(t), sell=Math.round(t.spent*0.6);

$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!B) return; const d=b.dataset;
  if(d.x!==undefined){ closeSheet(); return; }

/* --- 업데이트 --- */
function update(dt){
  B.t+=dt;
  if(B.shake>0) B.shake=Math.max(0,B.shake-dt*30);
  if(B.state==='wave'){
    B.spawnT-=dt;
    if(B.queue.length&&B.spawnT<=0){ const t=B.queue.shift(); spawn(t); B.spawnT=(t==='f'?0.25:t==='B'?1.5:Math.max(0.35,0.8-B.wave*0.03))*(B.wk==='rush'?0.6:1); }
    if(!B.queue.length&&!B.mobs.length){
      B.gold+=20; B.score+=100; bumpGold();
      if(B.wave>=WAVES){ endBattle(true); return; }
      B.state='build'; B.cd=4; if(!B.wleak){ B.gold+=10; toast('✨ 퍼펙트 웨이브! 🍬+30'); sfx('coin'); } else toast('✅ 웨이브 클리어! 🍬+20');
    }
  }else if(B.state==='build'&&B.wave>0){ B.cd-=dt; if(B.cd<=0) nextWave(); }
  for(const m of B.mobs){
    if(m.regen) m.hp=Math.min(m.max,m.hp+m.regen*dt);
    if(m.slowT>0) m.slowT-=dt; if(m.hitT>0) m.hitT-=dt; if(m.markT>0) m.markT-=dt;
    if(m.boss) m.age=(m.age||0)+dt;
    if(m.pat){ if(m.dashT>0) m.dashT-=dt; if(m.shT>0) m.shT-=dt; m.pt-=dt; if(m.pt<=0){ m.pt=(B.si===STAGES.length-1||VS(B.si)===13)?4.5:5.5; bossSkill(m,m.pat[m.pi++%m.pat.length]); } }
    if(m.frz>0){ m.frz-=dt; continue; }
    let sm=1, ex=0;
    if(m.rush){ m.rt=(m.rt==null?1.2+rnd()*2.2:m.rt)-dt; if(m.rt<=0){ m.rt=3.4; m.rushT=0.8; } if(m.rushT>0){ m.rushT-=dt; sm*=2.3; } }
    if(m.rage) sm*=1+1.3*(1-Math.max(0,m.hp)/m.max);
    if(m.hasteT>0){ m.hasteT-=dt; sm*=1.35; }
    if(m.haste||m.healA){ for(const o of B.mobs){ if(o===m||o.dead||o.boss) continue; if(Math.abs(o.x-m.x)+Math.abs(o.y-m.y)<1.7){ if(m.haste&&!o.haste) o.hasteT=0.25; if(m.healA&&o.hp<o.max) o.hp=Math.min(o.max,o.hp+o.max*0.03*dt); } } }
    if(m.blink){ m.bt=(m.bt==null?2.2+rnd()*2:m.bt)-dt; if(m.slowT>0) m.bt=Math.max(m.bt,0.7); if(m.bt<=0){ m.bt=4.2; ex=1.3; m.blT=0.3; B.fx.push({k:'r',x:m.x,y:m.y,life:0.4,max:0.4,c:'rgba(255,79,109,.9)'}); burst(m.x,m.y,0.4,'#ff4f6d',6); } if(m.blT>0) m.blT-=dt; }
    let mv=m.spd*1.25*dt*(m.slowT>0?0.55:1)*(m.dashT>0?2.6:1)*sm+ex;
    while(mv>0&&!m.dead){
      const tg=B.wp[m.seg+1]; if(!tg){ leak(m); break; }
      const dx=tg[0]-m.x, dy=tg[1]-m.y, d=Math.hypot(dx,dy);
      if(d<=mv){ m.x=tg[0]; m.y=tg[1]; m.seg++; m.dist+=d; mv-=d; } else { m.x+=dx/d*mv; m.y+=dy/d*mv; m.dist+=mv; mv=0; }
    }
  }
  B.mobs=B.mobs.filter(m=>!m.dead);
  if(B.blindT>0) B.blindT-=dt; if(B.boostT>0) B.boostT-=dt;
  for(const t of B.towers){
    if(t.kick>0) t.kick-=dt; if(t.born>0) t.born-=dt;
    if(t.stun>0){ t.stun-=dt; continue; }
    const c=CARDS[t.k]; if(c.aura) continue;
    const st=towerStats(t), tx=t.x+.5, ty=t.y+.5;
    let mul=1; for(const o of B.towers){ if(CARDS[o.k].aura&&Math.hypot(o.x-t.x,o.y-t.y)<=towerStats(o).range+0.01) mul+=towerStats(o).aura; }
    t.cd-=dt*mul*(B.boostT>0?2:1); if(t.cd>0) continue; const rg=st.range*(B.blindT>0?0.7:1);
    let best=null;
    for(const m of B.mobs){ if(Math.hypot(m.x-tx,m.y-ty)>rg) continue; if(!best) best=m; else if(c.snipe?m.hp>best.hp:m.dist>best.dist) best=m; }
    if(!best) continue;
    t.cd=1/(c.rate*(t.k==='drink'?(t.lv>=3?1.4:1+0.3*(t.lv-1)):1)); t.kick=0.12; t.tg=best; sfx(t.k);
    if(c.spin){ t.spin=(t.spin||0)+1; for(const m of B.mobs.slice()){ if(Math.hypot(m.x-tx,m.y-ty)<=rg) hit(m,st.dmg,0); } B.fx.push({k:'r',x:tx,y:ty,life:0.28,max:0.28,c:akFor(t.k)?akFor(t.k).pc:t.lv===3?'#ffd23f':t.lv===2?'#7ec8ff':'#e8ecf4',rr:rg/0.9}); }
    else if(c.pierce){ let dx=best.x-tx, dy=best.y-ty; const dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl; const len=st.range*1.15, ex=tx+dx*len, ey=ty+dy*len;
      for(const m of B.mobs.slice()){ const u=(m.x-tx)*dx+(m.y-ty)*dy; if(u<0||u>len) continue; const px=tx+dx*u, py=ty+dy*u; if(Math.hypot(m.x-px,m.y-py)<=0.42) hit(m,st.dmg,0); }
      B.fx.push({k:'b',x:tx,y:ty,x2:ex,y2:ey,life:0.22,max:0.22,c:akFor(t.k)?akFor(t.k).pc:t.k==='fountain'?(t.lv===3?'#ffd23f':'#2a3d8f'):t.lv===3?'#ff8fb3':t.lv===2?'#7ec8ff':'#ffd23f'}); B.shake=Math.max(B.shake,t.k==='fountain'?2.2:1.2); }
    else if(c.snipe){ B.shake=Math.max(B.shake,1.8); hit(best,st.dmg,0); skinHit(best.x,best.y,t.k); B.fx.push({k:'l',x:tx,y:ty,x2:best.x,y2:best.y,life:0.15,max:0.15,c:akFor(t.k)?akFor(t.k).pc:null}); }
    else B.proj.push({x:tx,y:ty,tgt:best,tx:best.x,ty:best.y,sp:t.k==='drink'?14:9,dmg:st.dmg,splash:st.splash,stick:c.stick?0.6+0.2*t.lv:0,slow:st.slow||(c.mark?1:0),mark:c.mark?0.2+0.1*(t.lv-1):0,e:c.proj,k:t.k,col:t.k==='mochi'?'#ffffff':t.k==='glue'?'#eaf6ff':t.k==='stapler'?'#c0c8d4':t.k==='hl'?(t.lv===1?'#e8ff3a':t.lv===2?['#ff8fb3','#7ec8ff','#9ef0a8'][rnd()*3|0]:'#ff3fa4'):t.k==='drink'?(t.lv===1?'#2ee86b':t.lv===2?['#ff4f86','#ffd23f','#3ddc84','#ff8a2a','#b57bff'][rnd()*5|0]:'#b3202c'):null});
  }
  for(const p of B.proj){
    if(p.tgt&&!p.tgt.dead){ p.tx=p.tgt.x; p.ty=p.tgt.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy), mv=p.sp*dt;
    if(d<=mv){
      p.done=true;
      if(p.splash){ for(const m of B.mobs) if(Math.hypot(m.x-p.tx,m.y-p.ty)<=p.splash) hit(m,p.dmg,p.slow); B.fx.push({k:'c',x:p.tx,y:p.ty,r:p.splash,life:0.3,max:0.3,c:p.k==='ice'?'120,210,255':'240,240,250'}); }
      else if(p.tgt&&!p.tgt.dead){ skinHit(p.tgt.x,p.tgt.y,p.k); if(p.stick){ p.tgt.frz=Math.max(p.tgt.frz||0,p.tgt.boss?p.stick*0.4:p.stick); } if(p.mark){ p.tgt.markT=3; p.tgt.markV=Math.max(p.tgt.markT>0&&p.tgt.markV||0,p.mark); } hit(p.tgt,p.dmg,p.slow); }
    } else { p.x+=dx/d*mv; p.y+=dy/d*mv; (p.tr||(p.tr=[])).push([p.x,p.y]); if(p.tr.length>7) p.tr.shift(); }
  }
  B.proj=B.proj.filter(p=>!p.done);
  B.mobs=B.mobs.filter(m=>!m.dead);
  B.left=B.queue.length+B.mobs.length;
  for(const f of B.fx){ f.life-=dt; if(f.k==='t') f.oy-=45*dt; if(f.k==='p'||f.k==='sp'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.h+=f.vh*dt; f.vh-=7*dt; } }
  B.fx=B.fx.filter(f=>f.life>0);
  updHud();
}
function hit(m,dmg,slow){
  if(m.dead) return;
  if(m.bub>0&&dmg>0){ m.bub--; m.hitT=0.1; m.bubT=0.2; if(slow) m.slowT=1.5; if(!m.bub){ burst(m.x,m.y,0.5,'#9fe8ff',12); fxText('방울 터짐!',m.x,m.y,1,'#9fe8ff',15); sfx('ice'); } return; }
  if(m.arm) dmg=Math.max(dmg*0.55,dmg-m.arm);
  if(m.shT>0) dmg*=0.25; if(m.markT>0) dmg*=1+(m.markV||0.2); if(m.boss&&B.ultOn!==false) B.ult=Math.min(100,(B.ult||0)+dmg/m.max*25);
  m.hp-=dmg; m.hitT=0.1; if(slow) m.slowT=1.5; if(m.boss) B.shake=Math.max(B.shake,1.5);
  if(dmg>=1) fxText(Math.round(dmg),m.x+(rnd()-.5)*0.3,m.y,0.9,m.boss?'#ff4f86':'#fff',m.boss?19:15);
  if(m.hp<=0){
    m.dead=true; B.gold+=m.g; B.kills++; B.ult=Math.min(100,(B.ult||0)+(m.boss?12:2)); B.shake=Math.max(B.shake,2.5); if(!m.boss) S.mis.k++; sfx('kill');
    if(B.t-(B.lastKill||-9)<1.2) B.combo=(B.combo||1)+1; else B.combo=1; B.lastKill=B.t; B.score+=m.g*10+(m.boss?(m.stu?500:1000):0);
    burst(m.x,m.y,0.4,m.boss?'#ffd23f':(MOBC[m.type]||'#ff8fb3'),m.boss?30:m.el?22:10); if(m.split){ const d=MOBS.f; for(let i=0;i<m.split;i++){ const c=Object.assign({},d,{type:'f',hp:Math.max(d.hp,m.max*0.3),g:1}); c.max=c.hp; c.seg=m.seg; c.x=m.x; c.y=m.y; c.dist=m.dist; c.slowT=0; c.hitT=0; c.off=(i?1:-1)*0.18; B.mobs.push(c); } } B.fx.push({k:'r',x:m.x,y:m.y,life:0.35,max:0.35,c:m.boss?'rgba(255,210,63,.9)':'rgba(255,255,255,.8)'}); if(m.boss) B.fx.push({k:'r',x:m.x,y:m.y,life:0.6,max:0.6,c:'rgba(255,79,134,.8)'}); fxText('+🍬'+m.g,m.x,m.y,1.1,'#ffd23f',15); bumpGold();
    if(m.boss){ B.shake=14; banner('💯 '+m.n+' 100점!'); fxText('💯 100점!',m.x,m.y,1.8,'#ff3b4f',26); }
  }
}
function leak(m){

  const e=B.wp[B.wp.length-1]; fxText('-'+m.leak+'❤️',e[0],ROWS-0.5,1,'#ff4f6d',20);

/* ================= 맵 꾸밈 ================= */
const hsh=(x,y,s)=>{ let h=(x*374761393+y*668265263+s*1442695041)|0; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; };
function tquad(x0,y0,x1,y1,h,col){ quad([P3(x0,y0,h),P3(x1,y0,h),P3(x1,y1,h),P3(x0,y1,h)],col); }
function tline(x0,y0,x1,y1,h,col,w){ const a=P3(x0,y0,h), b=P3(x1,y1,h); ctx.strokeStyle=col; ctx.lineWidth=w*a[2]; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
function tileDetail(si,x,y,path,h){ si=VS(si);
  const r=hsh(x,y,si);
  if(si===0){ if(path){ for(let i=0;i<3;i++) tquad(x+0.1,y+0.12+i*0.3,x+0.9,y+0.24+i*0.3,h+0.001,'rgba(255,255,255,.55)'); } else if(r<0.25){ const c=['#ff8fb3','#ffd23f','#fff'][(r*12|0)%3]; const [px,py,f]=P3(x+0.3+r*1.6,y+0.4+r,h); ctx.fillStyle=c; ctx.beginPath(); ctx.arc(px,py,2.5*f,0,Math.PI*2); ctx.fill(); } }
  else if(si===1){ if(path){ tline(x+0.12,y,x+0.12,y+1,h,'rgba(255,255,255,.7)',1.5); tline(x+0.88,y,x+0.88,y+1,h,'rgba(255,255,255,.7)',1.5); } else if(y===5) tline(x,y+0.5,x+1,y+0.5,h,'rgba(255,255,255,.75)',2); }
  else if(si===2){ for(let i=1;i<4;i++) tline(x,y+i*0.25,x+1,y+i*0.25,h,path?'rgba(120,80,40,.18)':'rgba(90,55,25,.22)',1); }
  else if(si===3){ if(path){ tline(x,y+0.5,x+1,y+0.5,h,'rgba(255,255,255,.35)',1); } }
  else if(si===4){ if(r<0.45){ const c=['#ff4f86','#3a86ff','#ffd23f','#3ddc84','#b57bff'][(r*20|0)%5]; const [px,py,f]=P3(x+0.2+r*1.3,y+0.3+r*0.8,h); ctx.fillStyle=c; ctx.globalAlpha=.55; ctx.beginPath(); ctx.ellipse(px,py,(4+r*6)*f,(2.5+r*3)*f,r*3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } }
  else if(si===5){ if(path){ const g=0.4+0.4*Math.sin(B.t*3+y*0.6); tline(x+0.5,y,x+0.5,y+1,h,'rgba(24,200,255,'+g+')',2); } else { tline(x,y,x+1,y,h,'rgba(120,200,255,.18)',1); tline(x,y,x,y+1,h,'rgba(120,200,255,.18)',1); } }
  else if(si===7){ if(!path) tline(x,y+0.5,x+1,y+0.5,h,'rgba(80,120,130,.18)',1), tline(x+0.5,y,x+0.5,y+1,h,'rgba(80,120,130,.18)',1); }
  else if(si===8){ if(path){ tline(x,y+0.5,x+1,y+0.5,h,'rgba(0,0,0,.12)',1); } else tline(x,y,x+1,y+1,h,'rgba(60,80,120,.12)',1); }
  else if(si===9){ if(path) tline(x,y+0.5,x+1,y+0.5,h,'rgba(0,0,0,.1)',1); else if(r<0.3) tline(x+0.2,y+0.2,x+0.8,y+0.8,h,'rgba(60,90,40,.12)',1); }
  else if(si===10){ tline(x,y,x+1,y,h,'rgba(120,150,180,.25)',1); tline(x,y,x,y+1,h,'rgba(120,150,180,.25)',1); }
  else if(si===11){ if(!path&&r<0.2){ tline(x+0.4,y+0.5,x+0.6,y+0.5,h,'rgba(255,90,110,.25)',2); tline(x+0.5,y+0.4,x+0.5,y+0.6,h,'rgba(255,90,110,.25)',2); } }
  else if(si===12){ if(!path){ tline(x,y,x+1,y,h,'rgba(0,0,0,.08)',1); if(r<0.15) tline(x+0.1,y+0.7,x+0.9,y+0.65,h,'rgba(0,0,0,.12)',1); } }
  else if(si===13){ for(let i=1;i<5;i++) tline(x,y+i*0.2,x+1,y+i*0.2,h,path?'rgba(0,0,0,.08)':'rgba(90,60,30,.18)',1); }
  else if(si===14){ if(!path&&r<0.5){ const [px,py,f]=P3(x+0.3+r,y+0.4+r*0.4,h); ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(px,py,1.6*f,0,Math.PI*2); ctx.fill(); } if(path){ tline(x+0.1,y,x+0.1,y+1,h,'rgba(255,210,120,.35)',1.2); tline(x+0.9,y,x+0.9,y+1,h,'rgba(255,210,120,.35)',1.2); } }
  else if(si===15){ if(!path){ for(let i=1;i<3;i++){ tline(x+i/3,y,x+i/3,y+1,h,'rgba(0,0,0,.12)',1); tline(x,y+i/3,x+1,y+i/3,h,'rgba(0,0,0,.12)',1); } } else tline(x+0.5,y+0.15,x+0.5,y+0.85,h,'rgba(0,0,0,.18)',2); }
  else if(si===16){ tline(x,y,x+1,y,h,path?'rgba(0,0,0,.06)':'rgba(120,90,50,.16)',1); if(!path&&r<0.12) tquad(x+0.3,y+0.3,x+0.6,y+0.5,h+0.001,'rgba(255,255,255,.75)'); }
