<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>운중 디펜스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0f0c29;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
#app{--bg:radial-gradient(circle at 50% -10%,#5b34a8 0%,#251d63 45%,#0f0c29 100%);--txt:#fff;--sub:#c9c4ff;--p1:#332d7a;--p2:#241f5c;--pb:2px solid rgba(255,255,255,.12);--navA:#1d1850;--navB:#130f38;--navT:#9c97d8;--on1:#5b4ad6;--on2:#3f30a8;--onS:#2a1f7a;--lg1:#ff4f86;--lg2:#7a1f4a;--qb1:#5b4ad6;--qb2:#3f30a8;--qbS:#2a1f7a;position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg);color:var(--txt)}
#app.th1{--bg:linear-gradient(170deg,#ffe1ef 0%,#e6dcff 50%,#d6f3ff 100%);--txt:#3a2a5a;--sub:#8064a8;--p1:#ffffff;--p2:#fff3fa;--pb:2px solid #ffd0e6;--navA:#ffffff;--navB:#fff0f7;--navT:#b49ad6;--on1:#ff8fb3;--on2:#ff5d9e;--onS:#c2457a;--lg1:#ff8fb3;--lg2:#c2457a;--qb1:#b9a6ff;--qb2:#8f74f0;--qbS:#6a52c8}
#app.th2{--bg:radial-gradient(circle at 50% 0%,#2f5d46,#1c3a2c 60%,#122a1f);--txt:#f4f1e4;--sub:#cfe8d6;--p1:#2a503d;--p2:#1f3e2f;--pb:4px solid #8a5a32;--navA:#6b4426;--navB:#4a2e18;--navT:#e8cfa8;--on1:#a5703f;--on2:#7d5230;--onS:#4a2e18;--lg1:#f2c230;--lg2:#8a5a32;--qb1:#a5703f;--qb2:#7d5230;--qbS:#4a2e18}
#app.th3{--bg:radial-gradient(circle at 50% -10%,#0d3a66 0%,#071c36 50%,#030b17 100%);--txt:#e8fbff;--sub:#8fd8ff;--p1:#0c2846;--p2:#071a30;--pb:2px solid #18c8ff;--navA:#071a30;--navB:#030b17;--navT:#5fa8d0;--on1:#0fb5d8;--on2:#0a72a8;--onS:#05436a;--lg1:#00e5ff;--lg2:#0050c8;--qb1:#0fb5d8;--qb2:#0a72a8;--qbS:#05436a}
#app.th3 .panel{box-shadow:0 0 18px rgba(24,200,255,.35)}
#app.th4{--bg:repeating-linear-gradient(#fdf8ea 0 27px,#d6e4f5 27px 28px);--txt:#2a2a3a;--sub:#6b6f8a;--p1:#ffffff;--p2:#fffdf6;--pb:2px solid #e8dcc0;--navA:#fffaf0;--navB:#f5ecd8;--navT:#9a8f78;--on1:#ff9f1c;--on2:#f07d00;--onS:#b85c00;--lg1:#3a86ff;--lg2:#1d4aa8;--qb1:#3a86ff;--qb2:#2f6fe0;--qbS:#1d4aa8}
#app.th1::before,#app.th4::before{opacity:.25}
#app.th5{--bg:radial-gradient(circle at 50% -10%,#2a2a2a 0%,#0b0b0b 60%);--txt:#fff;--sub:#a8a8a8;--p1:#1c1c1c;--p2:#111;--pb:2px solid #fff;--navA:#111;--navB:#000;--navT:#8a8a8a;--on1:#fff;--on2:#dcdcdc;--onS:#6b6b6b;--onT:#111;--lg1:#6b6b6b;--lg2:#2a2a2a;--qb1:#2a2a2a;--qb2:#1a1a1a;--qbS:#000}
#app.th6{--bg:#f2f2f2;--txt:#111;--sub:#6b6b6b;--p1:#fff;--p2:#fff;--pb:2px solid #111;--navA:#fff;--navB:#f2f2f2;--navT:#9a9a9a;--on1:#111;--on2:#000;--onS:#6b6b6b;--onT:#fff;--lg1:#111;--lg2:#6b6b6b;--qb1:#111;--qb2:#000;--qbS:#6b6b6b}
#app.th5::before,#app.th6::before{display:none}
#app.th5 .gbtn,#app.th5 .qbtn{background:linear-gradient(#fff,#dcdcdc);color:#111;text-shadow:none;box-shadow:0 6px 0 #6b6b6b}
#app.th5 .gbtn.gray,#app.th5 .qbtn{background:linear-gradient(#3a3a3a,#222);color:#fff;box-shadow:0 6px 0 #000;border:2px solid #fff}
#app.th6 .gbtn,#app.th6 .qbtn{background:linear-gradient(#222,#000);color:#fff;text-shadow:none;box-shadow:0 6px 0 #8a8a8a}
#app.th6 .gbtn.gray,#app.th6 .qbtn{background:#fff;color:#111;border:2px solid #111;box-shadow:0 6px 0 #111}
#app.th5 .qbtn.glow,#app.th6 .qbtn.glow{animation:wiggle 1.6s ease-in-out infinite}
#app.th5 .pill,#app.th5 .lvb,#app.th6 .pill,#app.th6 .lvb{filter:grayscale(1)}
#app.th6 .pill,#app.th6 .lvb,#app.th6 .rbtn{background:#111;border-color:#111;color:#fff}
#app.th5 .ccard,#app.th6 .ccard,#app.th5 .dk,#app.th6 .dk,#app.th5 .node .dot,#app.th6 .node .dot{filter:grayscale(1) contrast(1.15)}
#app.th5 .tag,#app.th6 .tag{background:#fff;color:#111}#app.th6 .tag{background:#111;color:#fff}
#app.th5 .ribbon,#app.th6 .ribbon{background:#fff;color:#111;text-shadow:none;box-shadow:0 6px 0 #6b6b6b}
#app.th5 .stars,#app.th6 .stars{filter:grayscale(1) brightness(1.4)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 14px 92px;gap:14px;overflow-y:auto}
.scr.on{display:flex}
.scr>*{flex-shrink:0}
p,div,span,small,b{font-size:15px}
.c{text-align:center}
/* 버튼 */
.gbtn{border:0;border-radius:18px;min-height:56px;padding:0 18px;font-family:inherit;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 6px 0 #b86400,0 10px 18px rgba(0,0,0,.35);cursor:pointer;transition:transform .05s}
.gbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b86400}
.gbtn.green{background:linear-gradient(#63f29a,#1fb35d);box-shadow:0 6px 0 #0e7a3a,0 10px 18px rgba(0,0,0,.35)}
.gbtn.blue{background:linear-gradient(#62cdff,#2f78f0);box-shadow:0 6px 0 #1c4aa8,0 10px 18px rgba(0,0,0,.35)}
.gbtn.pink{background:linear-gradient(#ff8fb3,#ff4f86);box-shadow:0 6px 0 #b8245a,0 10px 18px rgba(0,0,0,.35)}
.gbtn.gray{background:linear-gradient(#8f92b8,#5d6090);box-shadow:0 6px 0 #393b63,0 10px 18px rgba(0,0,0,.35)}
.gbtn.sm{min-height:46px;font-size:16px;border-radius:14px;padding:0 12px}
.gbtn:disabled{filter:grayscale(1) brightness(.7)}
.rbtn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font-size:20px;font-family:inherit}
/* 상단 바 / 알약 */
.topbar{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 12px 3px 4px;font-weight:900;font-size:16px;white-space:nowrap}
.pill .i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(#ffe066,#f7b500)}
.pill .i.r{background:linear-gradient(#ff7b8f,#e5334f)}
.pill .i.p{background:linear-gradient(#ffa6d1,#ff5d9e)}
.pill .i.s{background:linear-gradient(#a98bff,#6c4ce0)}
.pill .i.ci{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23f 45%,#e39b00);box-shadow:inset 0 0 0 2.5px #f2a900,inset 0 0 0 5px #ffe48a,0 2px 0 #b87400}
.pill .i.ci::after{content:'★';color:#c98400;font-size:15px;font-weight:900;text-shadow:0 1px 0 #fff3b0}
.panel{background:linear-gradient(var(--p1),var(--p2));border:var(--pb);border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.logo{text-align:center;font-weight:900;font-size:42px;letter-spacing:-1px;line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--lg1),0 8px 0 var(--lg2),0 12px 24px rgba(0,0,0,.35)}
.tag{display:inline-block;background:linear-gradient(#ff8fb3,#ff4f86);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
/* 하단 메뉴 */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(var(--navA),var(--navB));border-top:2px solid rgba(255,255,255,.1);z-index:6}
.nav button{flex:1;min-height:58px;border:0;border-radius:16px;background:none;color:var(--navT);font-family:inherit;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nav button b{font-size:24px}
.nav button.on{background:linear-gradient(var(--on1),var(--on2));color:var(--onT,#fff);box-shadow:0 4px 0 var(--onS)}
/* 로비 */
.stagecard{position:relative;text-align:center;padding:18px 12px 16px;overflow:hidden}
.stagecard .big{font-size:56px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.stagecard h2{font-size:26px;font-weight:900;margin-top:6px}
.boss{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;margin-top:8px;font-weight:800}
.stars{color:#ffd23f;font-size:24px;letter-spacing:2px;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:900}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
/* 지도 */
.node{display:flex;align-items:center;gap:12px;border:0;font-family:inherit;color:var(--txt);text-align:left;background:none;width:100%}
.node .dot{width:76px;height:76px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(#6f5ae8,#4733b8);box-shadow:0 6px 0 #2a1f7a,0 0 0 4px rgba(255,255,255,.12)}
.node.done .dot{background:linear-gradient(#63f29a,#1fb35d);box-shadow:0 6px 0 #0e7a3a,0 0 0 4px rgba(255,255,255,.15)}
.node.lock{opacity:.4}
.node .t b{font-size:18px;font-weight:900;display:block}
.node .t small{font-size:14px;color:var(--sub)}
.node.r{flex-direction:row-reverse;text-align:right}
.link{width:6px;height:22px;margin:0 auto;border-left:6px dotted rgba(255,255,255,.25)}
/* 카드 */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{position:relative;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 6px 0 var(--d),0 10px 18px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.25)}
.ccard .art{width:100%;height:84px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:52px}
.ccard{color:#fff}
.ccard .lv{color:#fff;position:absolute;top:4px;left:4px;background:#130f38;border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:1px 8px;font-weight:900;font-size:14px}
.ccard .nm{font-weight:900;font-size:16px}
.ccard .ds{font-size:14px;opacity:.9;text-align:center;line-height:1.35}
.lvbar{width:100%;height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.lvbar i{display:block;height:100%;background:#ffd23f}
.ccard.lock{filter:grayscale(1) brightness(.6)}
.rar-c{--a:#4fb3ff;--b:#2f6fe0;--d:#1d4aa8}
.rar-r{--a:#c08bff;--b:#7b3fe0;--d:#4f22a3}
.rar-e{--a:#ffb347;--b:#ff7b1c;--d:#b84f00}
/* 전투 */
#bv{position:absolute;inset:0;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px;z-index:3}
#hud .wave{flex:1;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;text-align:center;position:relative;overflow:hidden}
#hud .wave i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f86,#ffb347);opacity:.55;transition:width .3s}
#hud .wave span{position:relative;font-size:14px}
#bGold.bump{animation:bump .25s;display:inline-block}
@keyframes bump{50%{transform:scale(1.4)}}
#deck{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(19,15,56,0),#130f38 30%);z-index:3}
.dk{flex:1;min-width:0;height:76px;border-radius:14px;border:2px solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 4px 0 var(--d)}
.dk{touch-action:none}
.dk img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.dk b{font-size:28px;line-height:1}
.dk small{font-size:14px;font-weight:900;background:rgba(0,0,0,.35);border-radius:8px;padding:0 6px}
.dk.sel{transform:translateY(-8px);border-color:#fff;box-shadow:0 4px 0 var(--d),0 0 0 3px #ffd23f,0 0 18px #ffd23f}
.dk:disabled{filter:grayscale(1) brightness(.6)}
#ctrl{position:absolute;left:10px;right:10px;bottom:100px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3;pointer-events:none}
#ctrl>*{pointer-events:auto}
#bNext{min-width:150px}
#bUlt{position:absolute;right:12px;bottom:176px;z-index:3;width:66px;height:66px;border-radius:50%;border:0;padding:0;color:#fff;font-family:inherit;background:conic-gradient(#ffd23f var(--p,0%),rgba(0,0,0,.45) 0);box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.85}
#bUlt::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#2a1f6e;z-index:-1}
#bUlt{isolation:isolate}
#bUlt span{font-size:24px;line-height:1;filter:grayscale(1)}
#bUlt small{font-size:14px;font-weight:900}
#bUlt.full{opacity:1;animation:pulse .8s ease-in-out infinite;box-shadow:0 0 18px #ffd23f,0 4px 12px rgba(0,0,0,.4)}
#bUlt.full span{filter:none}
#sheet{position:absolute;left:8px;right:8px;bottom:96px;z-index:5;display:none;flex-direction:column;gap:10px}
#sheet.on{display:flex}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;z-index:4;pointer-events:none;font-size:30px;font-weight:900;text-shadow:0 3px 0 #ff4f86,0 6px 0 #7a1f4a,0 8px 20px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:scale(1)}
#banner.big{font-size:22px;color:#fff;text-shadow:0 2px 0 #ff4f86,0 0 8px rgba(0,0,0,.5)}
/* 결과 */
#result{background:rgba(10,8,30,.75);justify-content:center;padding:14px}
.ribbon{margin:0 auto;background:linear-gradient(#ffd23f,#ff9f1c);color:#fff;font-weight:900;font-size:26px;padding:10px 34px;border-radius:14px;box-shadow:0 6px 0 #b86400;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ribbon.lose{background:linear-gradient(#8f92b8,#5d6090);box-shadow:0 6px 0 #393b63}
.rstars span{display:inline-block;font-size:52px;color:#4a4580;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.rstars span.on{color:#ffd23f;animation:pop .45s both}
.rstars span:nth-child(2).on{animation-delay:.2s}
.rstars span:nth-child(3).on{animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#modal{position:absolute;inset:0;background:rgba(10,8,30,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#mCard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:rgba(0,0,0,.75);border:2px solid rgba(255,255,255,.2);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;font-weight:800;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#app::before{content:"";position:absolute;inset:-50%;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 70% 60%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,230,120,.5),transparent),radial-gradient(1.5px 1.5px at 85% 15%,rgba(255,160,220,.5),transparent);background-size:220px 220px;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{to{transform:translate(220px,220px)}}
.lvb{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px 3px 3px}
.lvb .n{width:32px;height:32px;border-radius:50%;background:linear-gradient(#ff8fb3,#ff4f86);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;box-shadow:0 2px 0 #b8245a}
.lvb .xb{width:54px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.lvb .xb i{display:block;height:100%;background:linear-gradient(90deg,#63f29a,#ffd23f)}
.quick{display:flex;gap:10px}
.qbtn{flex:1;position:relative;min-height:58px;border:0;border-radius:18px;font-family:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(var(--qb1),var(--qb2));box-shadow:0 5px 0 var(--qbS);display:flex;align-items:center;justify-content:center;gap:6px}
.qbtn b{font-size:24px}
.qbtn.glow{background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 5px 0 #b86400,0 0 18px rgba(255,210,63,.7);animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
.rdot{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b4f;border:2px solid #fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav button{position:relative}
.nav .rdot{top:2px;right:18%}
.gbtn.shine{position:relative;overflow:hidden}
.gbtn.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.mis{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:14px;padding:10px}
.mis .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.mis .bar i{display:block;height:100%;background:linear-gradient(90deg,#63f29a,#1fb35d)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px}
.tgl b{font-size:16px;font-weight:900}
.sw{width:64px;height:36px;border-radius:18px;border:0;background:#4a4580;position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#1fb35d}.sw.on::after{left:32px}
input[type=range]{width:100%;accent-color:#ffd23f;height:28px}
.chest{font-size:84px;display:inline-block}
.chest.shake{animation:cshake .5s ease-in-out 2}
@keyframes cshake{25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.lvup{font-size:46px;font-weight:900;text-shadow:0 4px 0 #ff4f86,0 8px 0 #7a1f4a}
</style>
</head>
<body>

<script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
                                  앱은 1.5초 뒤 결과 화면(한 판 더 / 나가기)으로 게임을 덮어요.
   UnjungGame.submitScore(n, { hold: true }) → 점수만 기록하고, 게임의 결과 화면을 계속 보여 줘요.
                                  그 화면의 '계속' 버튼에서 UnjungGame.done() 을 부르면 앱 결과 화면이 떠요.
   UnjungGame.done()            → (hold로 보낸 뒤) 앱 결과 화면 열기
   UnjungGame.getStudyMinutes() → 오늘 스터디 윗미 공부 시간(분). Promise<number> (연습용에선 0)
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n, opts) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n, hold: !!(opts && opts.hold) }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
    done() { if (inApp) ask('done'); },
    getStudyMinutes() { return inApp ? ask('study').then((m) => Math.max(0, Math.floor(Number(m) || 0))) : Promise.resolve(0); },
  };
  window.UnjungGame = api;
  ask('ready');
})();
/* ======================= 앱 연결 코드 끝 ======================= */

  AU.bg=AU.ctx.createGain(); AU.fx=AU.ctx.createGain(); AU.bg.connect(AU.ctx.destination); AU.fx.connect(AU.ctx.destination);
  applyVol(); if(AU.want){ const w=AU.want; AU.want=null; playBgm(w); }
  setInterval(schedBgm,30);
}

function applyVol(){ if(!AU.ctx) return; AU.bg.gain.value=S.set.bgm?S.set.bgmV*0.16:0; AU.fx.gain.value=S.set.sfx?S.set.sfxV*0.45:0; }
const mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,dur,type,vol,off,slide,dest){ const c=AU.ctx; if(!c) return; const w=c.currentTime+(off||0), o=c.createOscillator(), g=c.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,w); if(slide) o.frequency.exponentialRampToValueAtTime(slide,w+dur); g.gain.setValueAtTime(0.0001,w); g.gain.exponentialRampToValueAtTime(vol,w+0.008); g.gain.exponentialRampToValueAtTime(0.0001,w+dur); o.connect(g); g.connect(dest||AU.fx); o.start(w); o.stop(w+dur+0.03); }
let NB=null;
function noise(dur,vol,when,dest,hp){ const c=AU.ctx; if(!NB){ NB=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } const s=c.createBufferSource(); s.buffer=NB; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||6000; const g=c.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); s.connect(f); f.connect(g); g.connect(dest); s.start(when); s.stop(when+dur+0.02); }
const SFX={
  tap:()=>tone(720,0.05,'triangle',0.35),
  build:()=>{ tone(392,0.08,'square',0.3); tone(659,0.12,'square',0.3,0.07); },
  upgrade:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.1,'square',0.28,i*0.06)),
  coin:()=>{ tone(988,0.06,'square',0.25); tone(1319,0.14,'square',0.25,0.05); },
  kill:()=>tone(330,0.08,'triangle',0.3,0,700),
  combo:n=>tone(600+Math.min(n,10)*90,0.09,'square',0.25),

  wave:()=>{ tone(523,0.1,'square',0.3); tone(784,0.18,'square',0.3,0.1); },
  boss:()=>{ for(let i=0;i<4;i++) tone(i%2?466:349,0.18,'sawtooth',0.3,i*0.2); },
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.3,i*0.11)),
  lose:()=>[392,349,311,262].forEach((f,i)=>tone(f,0.26,'triangle',0.35,i*0.2)),
  star:n=>tone(880+n*220,0.16,'square',0.3),
  chest:()=>{ [523,659,784,988,1319].forEach((f,i)=>tone(f,0.12,'triangle',0.3,i*0.07)); },
  lvup:()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,0.14,'square',0.28,i*0.08)),
  book:()=>tone(200,0.06,'triangle',0.2,0,120), drink:()=>tone(1000,0.025,'square',0.08),
  pen:()=>tone(1500,0.09,'sawtooth',0.12,0,420), eraser:()=>tone(240,0.12,'triangle',0.22,0,480),
  ice:()=>tone(1900,0.07,'sine',0.16,0,2600)
};
function sfx(n,a){ if(!AU.ctx||!S.set.sfx) return; const now=AU.ctx.currentTime; if(['book','drink','pen','eraser','ice','kill'].includes(n)){ if(now-(AU.last[n]||0)<0.07) return; AU.last[n]=now; } try{ SFX[n](a); }catch(e){} }

const SONGS={
  lobby:{bpm:112,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],drum:0,mel:[0,2,1,2,0,1,2,1]},
  battle:{bpm:136,ch:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],drum:1,mel:[0,1,2,1,2,1,0,2]},
  boss:{bpm:158,ch:[[57,60,64],[58,62,65],[56,60,63],[55,59,62]],drum:2,mel:[2,1,0,1,2,2,1,0]}
};
function playBgm(n){ if(!AU.ctx){ AU.want=n; return; } if(AU.song===n) return; AU.song=n; AU.step=0; AU.next=AU.ctx.currentTime+0.06; }
function stopBgm(){ AU.song=null; AU.want=null; }
function schedBgm(){
  const c=AU.ctx; if(!c||!AU.song||!S.set.bgm) return; const sg=SONGS[AU.song], sp=60/sg.bpm/2;
  if(AU.next<c.currentTime-0.5) AU.next=c.currentTime+0.05;
  while(AU.next<c.currentTime+0.15){
    const st=AU.step, bar=Math.floor(st/8)%4, ch=sg.ch[bar], w=AU.next, off=w-c.currentTime;
    if(st%4===0) tone(mf(ch[0]-24),sp*3.5,'triangle',0.5,off,0,AU.bg);
    tone(mf(ch[st%3]+(st%8>=4?12:0)),sp*0.9,'square',0.16,off,0,AU.bg);
    if(st%2===0){ const mi=sg.mel[(st/2)%8]; tone(mf(ch[mi]+12),sp*1.8,'triangle',0.22,off,0,AU.bg); }
    if(sg.drum){ if(st%4===0) tone(150,0.12,'sine',0.6,off,45,AU.bg); if(st%2===1) noise(0.04,0.18,w,AU.bg); if(sg.drum>1&&st%8===4) noise(0.12,0.3,w,AU.bg,1500); }
    AU.next+=sp; AU.step++;
  }
}

    SKINS.slice().sort((x,y)=>GO(x)-GO(y)).map(sk=>{ const own=S.skins.includes(sk.id), on=S.skin===sk.id, gr=sk.g?GRADE[sk.g]:null; return '<button class="gbtn '+(on?'green':own?'blue':'gray')+' sm" style="display:flex;align-items:center;gap:8px;min-height:62px;text-align:left" data-sk="'+sk.id+'"><span style="display:flex;gap:2px">'+['book','pen','eraser'].map(k=>'<img src="'+skinIconURL(k,3,sk)+'" style="width:36px;height:36px">').join('')+'</span><span style="flex:1"><b style="font-size:16px">'+sk.n+'</b>'+(gr?' <span style="font-size:14px;background:'+gr[1]+';border-radius:8px;padding:1px 6px">'+gr[0]+'</span>':'')+'<br><span style="font-size:14px;font-weight:700">'+(on?'착용 중':own?'눌러서 착용':'🔒 '+sk.cond)+'</span></span></button>'; }).join('')+
    '<button class="gbtn sm" data-x>닫기</button></div>',d=>{ if(d.sk){ if(!S.skins.includes(d.sk)){ const sk=SKINS.find(k=>k.id===d.sk); toast('🔒 '+sk.cond+' 달성하면 얻어요'); return; } S.skin=d.sk; save(); toast(SKIN().n+' 스킨 착용!'); openSkins(); } else hideModal(); }); }
/* ================= 시험 괴물 ================= */
function drawExam(c,D,x,y,s,t,score){
  c.save(); c.translate(x,y); const k=s/100*(D.big?1.15:1); c.scale(k,k); c.lineJoin='round'; c.lineCap='round';
  const st=Math.sin(t*7), bob=Math.abs(Math.sin(t*3.5))*3;
  c.fillStyle='#1b1340'; c.fillRect(-18,-14+st*3,8,14); c.fillRect(10,-14-st*3,8,14);
  c.beginPath(); c.ellipse(-14,st*3,9,4,0,0,Math.PI*2); c.ellipse(14,-st*3,9,4,0,0,Math.PI*2); c.fill();
  c.translate(0,-bob);
  if(D.big){ for(let i=2;i>=1;i--){ c.fillStyle=i===2?'#d9d4c4':'#ece7d8'; c.save(); c.rotate(i*0.05); c.fillRect(-38+i*4,-104-i*3,76,92); c.restore(); } }
  c.fillStyle='#fffdf6'; c.beginPath(); c.moveTo(-38,-104); c.lineTo(24,-104); c.lineTo(38,-90); c.lineTo(38,-12); c.lineTo(-38,-12); c.closePath(); c.fill();
  c.strokeStyle='#cfc6ad'; c.lineWidth=2.5; c.stroke();
  c.fillStyle='#e8e0c8'; c.beginPath(); c.moveTo(24,-104); c.lineTo(24,-90); c.lineTo(38,-90); c.closePath(); c.fill();
  c.fillStyle=D.col; c.fillRect(-38,-104,62,16);
  c.fillStyle='#fff'; c.font='900 11px sans-serif'; c.textAlign='left'; c.textBaseline='middle'; c.fillText(D.sub+(D.big?'':' 시험'),-33,-96);
  c.strokeStyle='#b9d1f0'; c.lineWidth=1.5; for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(-30,-44+i*7); c.lineTo(30,-44+i*7); c.stroke(); }
  c.font='900 12px sans-serif'; c.fillStyle='#8a8aa0'; c.textAlign='center'; c.fillText(D.prop,-22,-24);
  const ang=1-Math.min(1,score/100);
  [-1,1].forEach(sd=>{ c.fillStyle='#fff'; c.beginPath(); c.arc(sd*13,-72,9,0,Math.PI*2); c.fill(); c.strokeStyle='#1b1340'; c.lineWidth=1.5; c.stroke(); c.fillStyle='#1b1340'; c.beginPath(); c.arc(sd*13+Math.sin(t*2)*2,-71,4.5,0,Math.PI*2); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(sd*13-1.5,-73,1.5,0,Math.PI*2); c.fill();
    c.strokeStyle='#1b1340'; c.lineWidth=3; c.beginPath(); c.moveTo(sd*5,-82-ang*2); c.lineTo(sd*21,-86+ang*3); c.stroke(); });
  c.fillStyle='#3a0d1f'; c.beginPath(); if(score>=60) c.arc(0,-56,7,0.1*Math.PI,0.9*Math.PI); else c.ellipse(0,-54,9,5,0,Math.PI,0); c.fill();
  if(score<60){ c.fillStyle='#fff'; c.fillRect(-6,-57,4,3); c.fillRect(2,-57,4,3); }
  c.strokeStyle='#1b1340'; c.lineWidth=5; c.beginPath(); c.moveTo(-38,-50); c.lineTo(-50,-38+st*4); c.moveTo(38,-50); c.lineTo(52,-62-st*4); c.stroke();
  c.save(); c.translate(52,-62-st*4); c.rotate(-0.6); c.fillStyle='#d6283c'; c.fillRect(-3,-22,6,22); c.fillStyle='#fff'; c.fillRect(-3,-22,6,4); c.restore();
  const sc=Math.max(0,Math.min(100,Math.round(score)));
  c.strokeStyle='#d6283c'; c.lineWidth=3; c.beginPath(); c.arc(22,-28,15,0,Math.PI*2); c.stroke();
  c.fillStyle='#d6283c'; c.font='900 '+(sc>=100?9:11)+'px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(sc+'점',22,-28);
  if(D.big){ c.font='26px sans-serif'; c.fillText('👑',0,-118); }
  c.restore();
}

/* --- 종료 --- */
function endBattle(win){
  if(B.over) return; B.over=true; closeSheet(); biT=0; $('#bossIntro').style.display='none';
  const si=B.si, life=Math.max(0,B.life);
  const stars=win?(life>=18?3:life>=10?2:1):0;
  const sc=Math.floor(B.score+(win?2000+life*50:0)+(B.wave-1)*50);
  try{ UnjungGame.submitScore(sc,{hold:true}); }catch(e){}
  const coins=win?40+si*25+stars*15:10+B.wave*3;
  S.coins+=coins;
  let unlockMsg='';
  if(win&&!B.dc){ if(stars>(S.stars[si]||0)) S.stars[si]=stars; if(si>S.cleared){ S.cleared=si; const nk=CARD_ORDER.find(k=>UNLOCK[k]===si); if(nk) unlockMsg='<div class="pill"><span class="i s">🃏</span>새 카드 '+CARDS[nk].e+' '+CARDS[nk].n+'</div>'; } }
  const newBest=sc>S.best; if(newBest) S.best=sc;
  const ss=String(sc); let lucky=null;
  for(const z of JSON.parse(_t('5a675a675a1e5a0d5a0c5a0c5a085a1e5a105a1c5a1e8201843b5a1c96a09a905a1c922c98245a1c5a0d5a0c5a0c5a085a1d5a1e5a105a1c5a0d5a0c5a085a615a105a1c5a675a1e5a0b5a0b5a0b5a1e5a105a1c5a1e8200857c5a1cedd18a985a1c9b04e42c5a1c5a0b5a0b5a0b5a1d5a1e5a105a1c5a0b5a0b5a615a61'))){ if(!lucky&&ss.includes(z[0])) lucky=[z[1],z[2]]; } if(!lucky&&(ss.length>=3&&/^(\d)\1+$/.test(ss))) lucky=[_t('7d145a1cf6259d7c5a1c98179dac5a1c')+ss+'!',100];
  if(lucky){ S.coins+=lucky[1]; setTimeout(()=>{ banner(lucky[0]); sfx('chest'); toast(_t('8fb59c885a1c922c98245a1ce6c8eb3498985a1c820284a55a17')+lucky[1]); },1600); }
  if(win&&stars===3) S.mis.s++;
  let dcMsg=''; if(win&&stars>0){ stpSync(); if(S.stDay!==today()){ S.stDay=today(); S.stToday=0; } const g=Math.min(stars,STAMP_CAP-(S.stToday|0)); for(let q=0;q<g;q++) addStamp(); S.stToday=(S.stToday|0)+g; dcMsg=g>0?'<div class="pill"><img src="'+EMBLEM+'" style="width:22px">도장 +'+g+' ('+((S.stamps%10)||10)+'/10)</div>':'<div class="pill" style="font-size:14px">오늘 도장 '+STAMP_CAP+'개 다 모았어요 · 내일 또!</div>'; }
  const newSk=skinUnlockCheck(); if(newSk.length) setTimeout(()=>toast('🎁 새 보상: '+newSk.map(id=>SKINS.find(k=>k.id===id).n).join(', ')+'!'),2200);
  const xp=B.kills*2+(win?60:20)+stars*20; S.pxp+=xp; let lvUp=0; while(S.pxp>=needXp(S.plv)){ S.pxp-=needXp(S.plv); S.plv++; lvUp++; S.coins+=50; }
  save(); stopBgm(); setTimeout(()=>sfx(win?'win':'lose'),win?700:300);
  $('#rXp').innerHTML='<div class="lvb"><div class="n">'+S.plv+'</div><div class="xb" style="width:120px"><i style="width:'+Math.min(100,S.pxp/needXp(S.plv)*100)+'%"></i></div></div><b style="color:#63f29a">+'+xp+' XP</b>';
  if(win) [0,1,2].forEach(i=>{ if(i<stars) setTimeout(()=>sfx('star',i),1000+i*200); });
  if(lvUp) setTimeout(()=>{ sfx('lvup'); modal('<div class="panel c" style="display:flex;flex-direction:column;gap:10px"><div class="lvup">LEVEL UP!</div><div style="font-size:60px">🎊</div><b style="font-size:20px">Lv.'+S.plv+' 달성!</b><div class="pill" style="justify-content:center;margin:0 auto"><span class="i ci"></span>+'+(50*lvUp)+'</div><button class="gbtn green" data-close>좋아!</button></div>'); },1900);
  $('#rRibbon').textContent=win?'🏆 방어 성공!':'방어 실패…'; $('#rRibbon').className='ribbon'+(win?'':' lose');
  $('#rEmoji').innerHTML=win?thumbImg(si,'width:110px;border-radius:14px;display:block;margin:0 auto'):'😵';
  $('#rStars').innerHTML=[0,1,2].map(i=>'<span class="'+(i<stars?'on':'')+'">★</span>').join('');
  countUp($('#rScore'),sc,'점',900);
  $('#rBest').textContent=(newBest?'🎉 최고 기록! ':'최고 점수 ')+S.best.toLocaleString()+'점';
  $('#rGain').innerHTML='<div class="pill"><span class="i ci"></span>+'+coins+'</div>'+(lucky?_t('5a005a585a555a4a5a1c5a5f5a505a5d5a4f5a4f5a015a1e5a4c5a555a505a505a1e5a025a005a4f5a4c5a5d5a525a1c5a5f5a505a5d5a4f5a4f5a015a1e5a555a1c5a4f5a1e5a028200857c5a005a135a4f5a4c5a5d5a525a028fb59c885a1c5a17')+lucky[1]+'</div>':'')+unlockMsg+(win?'':'<button class="gbtn blue sm" data-tocards style="width:100%">🃏 카드 강화 후 재도전!</button>');
  $('#btnNext').style.display=win&&si<STAGES.length-1&&!B.dc?'':'none'; if(dcMsg) $('#rGain').innerHTML+=dcMsg;
  if(IN_APP){ $('#btnNext').style.display='none'; $('#rBtns').style.display='none'; const bd=$('#btnDone'); bd.style.display=''; bd.disabled=false; bd.textContent='계속 ▶'; }
  setTimeout(()=>show('result'),win?700:300);
}
$('#btnRetry').onclick=()=>startBattle(B.si,B.dc);
$('#btnDone').onclick=()=>{ const bd=$('#btnDone'); bd.disabled=true; bd.textContent='기록 확인 중…'; flushSave(); setTimeout(()=>UnjungGame.done(),300); };
$('#rGain').addEventListener('click',e=>{ if(e.target.closest('[data-tocards]')){ selStage=B.si; go('cards'); } });
$('#btnNext').onclick=()=>{ selStage=B.si+1; startBattle(selStage); };
$('#btnHome').onclick=()=>{ selStage=Math.min(S.cleared+1,STAGES.length-1); go('lobby'); };

function countUp(el,to,suf,ms){ const t0=performance.now(); const f=now=>{ const p=Math.min(1,(now-t0)/ms), v=Math.round(to*(1-Math.pow(1-p,3))); el.textContent=v.toLocaleString()+suf; if(p<1) requestAnimationFrame(f); }; el.textContent='0'+suf; setTimeout(()=>requestAnimationFrame(f),700); }
/* --- 일시정지 --- */
function pauseGame(){
  if(cur!=='battle'||!B||B.over||B.paused) return;
  B.paused=true; closeSheet(); showPause();
}
function showPause(){
  const s=S.set;
  modal('<div class="panel c" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:22px;font-weight:900">⚙️ 설정 · 일시정지</b><div style="font-size:14px;color:var(--sub)">'+STAGES[B.si].n+' · 웨이브 '+Math.max(1,B.wave)+'/'+WAVES+'</div><button class="gbtn green" data-r>▶ 계속하기</button><button class="gbtn blue" data-re>🔄 다시하기</button><button class="gbtn pink" data-q>🏠 그만하기</button><button class="gbtn gray sm" data-set>⚙️ 더 많은 설정</button></div>',d=>{
    if(d.t){ S.set[d.t]=!S.set[d.t]; save(); applyVol(); if(d.t==='bgm'&&S.set.bgm&&AU.ctx) AU.next=AU.ctx.currentTime+0.05; showPause(); return; }
    if(d.r!==undefined){ hideModal(); B.paused=false; last=performance.now(); }
    if(d.re!==undefined){ modal('<div class="panel c" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:20px;font-weight:900">처음부터 다시 할까요?</b><div style="color:var(--sub)">지금 진행은 사라져요</div><button class="gbtn blue" data-y>🔄 다시하기</button><button class="gbtn gray" data-n>취소</button></div>',d2=>{ if(d2.y!==undefined){ B.over=true; startBattle(B.si); } else showPause(); }); }
    if(d.q!==undefined){ modal('<div class="panel c" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:20px;font-weight:900">그만하고 로비로 갈까요?</b><div style="color:var(--sub)">'+(IN_APP?'지금까지 점수만 기록돼요':'이번 판 보상은 받을 수 없어요')+'</div><button class="gbtn pink" data-y>🏠 그만하기</button><button class="gbtn gray" data-n>취소</button></div>',d2=>{ if(d2.y!==undefined){ B.over=true; try{ UnjungGame.submitScore(Math.floor(B.score),{hold:true}); }catch(e){} hideModal(); save(); if(IN_APP){ flushSave(); UnjungGame.done(); } go('lobby'); } else showPause(); }); }
    if(d.set!==undefined) openSettings(showPause);
  });
}
$('#bPause').onclick=pauseGame;
(function hookPause(fn){ const U=window.UnjungGame; if(!U) return; if(typeof U.onPause==='function'&&U.onPause.length>0) U.onPause(fn); else U.onPause=fn; })(pauseGame);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });

/* --- 루프 --- */
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(cur==='battle'&&B){ if(!B.paused&&!B.over){ for(let i=0;i<speed&&!B.over;i++) update(dt); } draw(); tickIntro(dt); }
  else if(cur==='lobby'){ const cv=$('#lbCv'); if(cv){ const c=prepCv(cv,130,120); if(selStage<=S.cleared+1) drawExam(c,EXAMS[selStage],65,116,86,now/1000,0); else { c.font='60px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('❓',65,60); } } }
  requestAnimationFrame(loop);
}
applyTheme(); renderLobby(); newMotto(); resize(); syncStudy(); playBgm('lobby');
(async()=>{ try{ const U=window.UnjungGame; if(!U||!U.load) return; const t=await U.load(); if(t&&t.v===1&&(t.t||0)>(S.t||0)){ S=Object.assign(defState(),t); fixLv(); lsSet(KEY,JSON.stringify(S)); applyTheme(); if(cur==='lobby') renderLobby(); } }catch(e){} })();
requestAnimationFrame(loop);
})();
</script>
