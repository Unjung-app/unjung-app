<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>잡아라, 수행평가지! - 운중고 미니게임</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #0B1830; color: #F7FAFF; touch-action: none; overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      position: relative; width: 100%; max-width: 430px; height: 100%; height: 100dvh;
      margin: 0 auto; overflow: hidden; background: #EAD3AE; isolation: isolate; touch-action: none;
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

    /* ---------- 오버레이 화면 (시작 · 일시정지 · 결과) ---------- */
    .screen {
      position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      padding: calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
      text-align: center; background: rgba(8, 20, 40, .86);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #start { padding-top: calc(72px + env(safe-area-inset-top)); }
    .panel { margin: auto 0; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .hidden { display: none !important; }
    .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; color: #9FD9FF; }
    .screen h1 { margin: 0; font-size: 30px; line-height: 1.2; letter-spacing: -.5px; }
    .screen p { margin: 0; font-size: 16px; line-height: 1.6; color: #D0DDEF; }
    .screen .sub { font-size: 14px; color: #9FB3CC; white-space: pre-line; }
    .paper-hero { font-size: 56px; line-height: 1; animation: flutter 1.6s ease-in-out infinite; }
    @keyframes flutter {
      0%, 100% { transform: translate(-8px, 0) rotate(-8deg); }
      50% { transform: translate(8px, -10px) rotate(10deg); }
    }
    .rules { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .rule {
      display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 14px; border-radius: 14px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(220,235,255,.14);
      font-size: 16px; line-height: 1.4; text-align: left; color: #EEF4FF;
    }
    .rule .ico { font-size: 22px; }
    .rule b.y { color: #FFD166; }
    .rule b.b { color: #7DB7FF; }

    button {
      appearance: none; min-height: 52px; min-width: 150px; padding: 13px 22px;
      border: 0; border-radius: 15px; background: #FFD166; color: #182338;
      font: inherit; font-size: 17px; font-weight: 850; cursor: pointer; touch-action: manipulation;
      box-shadow: 0 5px 0 #C18A2F, 0 10px 24px rgba(0,0,0,.18);
    }
    button:active { transform: translateY(2px); box-shadow: 0 3px 0 #C18A2F, 0 7px 18px rgba(0,0,0,.18); }
    button.secondary { background: #DCEBFF; box-shadow: 0 5px 0 #829BB9, 0 10px 24px rgba(0,0,0,.18); }
    button.ghost { color: #EAF3FF; background: rgba(255,255,255,.1); border: 1px solid rgba(220,235,255,.25); box-shadow: none; }
    button:disabled { opacity: .5; }
    button:focus-visible { outline: 3px solid #8DE7FF; outline-offset: 3px; }
    .btn-row { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 2px; }
    .btn-row button { width: min(100%, 300px); }
    #soundBtn {
      position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
      min-width: 48px; min-height: 48px; padding: 0 14px; font-size: 15px;
    }

    /* ---------- 게임 중 HUD ---------- */
    #hud {
      position: absolute; z-index: 3; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none;
    }
    .hud-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pill {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 14px;
      background: rgba(10, 24, 44, .74); border: 1px solid rgba(220,235,255,.18);
      color: #F5F8FF; font-size: 15px; font-weight: 800; white-space: nowrap;
    }
    /* 왼쪽 위: 지금 시간 카드 + 진행 막대 */
    #hudCard {
      min-width: 128px; max-width: 52%; padding: 7px 12px 9px; border-radius: 14px;
      background: rgba(10, 24, 44, .86); border: 1.5px solid rgba(255, 255, 255, .28); box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    }
    #hudPlace { font-size: 18px; font-weight: 900; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.3px; }
    .bar-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .bar { flex: 1; height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .2); overflow: hidden; }
    #hudBar { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #65E6D3, #FFD166); transition: width .12s linear; }
    #hudCombo { margin-top: 62px; } /* 큰 점수 아래쪽, 왼쪽에 (점수·길을 가리지 않게) */
    /* 점수: 화면 위 가운데에 크게 */
    #hudCenter {
      position: absolute; z-index: 3; left: 0; right: 0; top: 60px;
      display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
    }
    /* 실시간 점수: 크게, 반투명 + 굵은 테두리 (숫자 사이로 길이 보임) */
    #hudScore {
      font-size: 62px; font-weight: 900; line-height: 1.1; color: #FFFFFF; opacity: .78; font-variant-numeric: tabular-nums; letter-spacing: -1px;
      -webkit-text-stroke: 2px rgba(10, 24, 44, .55); paint-order: stroke fill;
      text-shadow: 0 3px 0 rgba(10, 24, 44, .35), 0 0 14px rgba(10, 24, 44, .35);
    }
    #hudCombo { min-height: 34px; font-size: 15px; color: #FFB86B; visibility: hidden; transition: color .2s, border-color .2s; }
    #hudCombo.lv1 { color: #FFE07A; border-color: rgba(255, 213, 74, .75); box-shadow: 0 0 12px rgba(255, 213, 74, .45); }
    #hudCombo.lv2 { color: #FFB36B; border-color: rgba(255, 138, 61, .85); box-shadow: 0 0 16px rgba(255, 138, 61, .6); }
    #hudCombo.lv3 { color: #FF9CC2; border-color: rgba(255, 61, 139, .9); animation: fever .5s ease-in-out infinite alternate; }
    @keyframes fever { from { box-shadow: 0 0 12px rgba(255, 61, 139, .65); } to { box-shadow: 0 0 24px rgba(255, 213, 74, .85); } }
    #pauseBtn {
      pointer-events: auto; width: 48px; min-width: 48px; height: 48px; min-height: 48px;
      padding: 0; border-radius: 14px; font-size: 18px; color: #FFFFFF;
      background: rgba(10, 24, 44, .74); border: 1px solid rgba(220,235,255,.18);
    }
    .bump { animation: bump .28s ease-out; }
    @keyframes bump { 0% { transform: scale(1.22); } 100% { transform: scale(1); } }
    /* 콤보 화면 효과: 가장자리 빛 (가운데 길은 비워 둠) */
    .fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; will-change: opacity; }
    .fx.lv1 { background: radial-gradient(ellipse at center, rgba(255, 213, 74, 0) 52%, rgba(255, 213, 74, .95) 100%); }
    .fx.lv2 { background: radial-gradient(ellipse at center, rgba(255, 138, 61, 0) 52%, rgba(255, 138, 61, .95) 100%); }
    .fx.lv3 { background: radial-gradient(ellipse at center, rgba(255, 61, 139, 0) 52%, rgba(255, 61, 139, .95) 100%); }
    #fxB { background: radial-gradient(ellipse at center, rgba(255, 213, 74, 0) 52%, rgba(255, 213, 74, .95) 100%); }
    /* 스테이지 알림: 이미 지나온 길이 있는 아래쪽에 작게 (앞길을 가리지 않음) */
    #toast {
      position: absolute; z-index: 4; left: 50%; bottom: calc(7% + env(safe-area-inset-bottom)); transform: translate(-50%, 0);
      padding: 10px 26px 12px; border-radius: 22px; background: rgba(10, 24, 44, .62); color: #FFFFFF; text-align: center;
      white-space: nowrap; pointer-events: none; opacity: 0;
    }
    #toastTop { font-size: 18px; font-weight: 800; color: #FFE08A; }
    #toastMain { font-size: 34px; font-weight: 900; line-height: 1.15; letter-spacing: -.5px; }

    /* ---------- 결과 화면 ---------- */
    .score-big { font-size: 44px; font-weight: 900; line-height: 1.1; color: #FFE08A; font-variant-numeric: tabular-nums; }
    .stamp-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .stamp {
      width: 88px; height: 88px; flex: none; display: flex; align-items: center; justify-content: center;
      border: 4px solid #FF5A5F; border-radius: 50%; color: #FF5A5F; font-size: 36px; font-weight: 900;
      transform: rotate(-12deg); background: rgba(255, 90, 95, .08);
    }
    .stamp.pop { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1); }
    .pc-only { display: none; } /* 컴퓨터(마우스가 있는 화면)에서만 보이는 안내 */
    @media (hover: hover) and (pointer: fine) { .pc-only { display: block; } }
    .btn-sub { display: block; margin-top: 2px; font-size: 14px; font-weight: 700; opacity: .75; }
    @keyframes stamp { 0% { transform: rotate(-12deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
    .comment { max-width: 190px; font-size: 16px; font-weight: 750; line-height: 1.45; color: #F1F5FF; text-align: left; }
    .near { min-height: 22px; font-size: 16px; font-weight: 800; color: #8DE7D6; white-space: pre-line; line-height: 1.5; }
    .near.new { color: #FFD166; }
    .stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      min-height: 64px; padding: 8px; border-radius: 14px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(220,235,255,.14);
    }
    .stat span { font-size: 14px; color: #AFC1D9; }
    .stat strong { font-size: 19px; line-height: 1.2; color: #FFE08A; font-variant-numeric: tabular-nums; }
    @media (max-height: 690px) {
      #hudScore { font-size: 52px; }
      #hudCenter { top: 54px; }
      .panel { gap: 10px; }
      .screen h1 { font-size: 26px; }
      .paper-hero { font-size: 44px; }
      .score-big { font-size: 38px; }
      .stamp { width: 76px; height: 76px; font-size: 30px; }
      .stat { min-height: 56px; }
    }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="게임 화면"></canvas>
  <div id="fxA" class="fx lv1"></div>
  <div id="fxB" class="fx"></div>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div id="hudCard">
        <div id="hudPlace">등교 · 아침</div>
        <div class="bar-row"><div class="bar"><div id="hudBar"></div></div></div>
      </div>
      <button id="pauseBtn" class="ghost" aria-label="일시정지">⏸</button>
    </div>
    <div id="hudCombo" class="pill">🔥 0콤보</div>
    <div id="hudCenter">
      <div id="hudScore">0</div>
    </div>
  </div>
  <div id="toast" aria-live="polite"><div id="toastTop"></div><div id="toastMain"></div></div>

  <section id="start" class="screen">
    <button id="soundBtn" class="ghost" aria-label="소리 켜고 끄기">🔇 소리 끔</button>
    <div class="panel">
      <div class="eyebrow">UNJUNG HIGH · 타이밍 러너</div>
      <div class="paper-hero" aria-hidden="true">📄💨</div>
      <h1 id="titleText">잡아라, 수행평가지!</h1>
      <p><b>잡아라, 수행평가지!</b><br>창문을 열었다가 수행평가지가 날아갔다!<br>한 번이라도 실수하면 처음부터.</p>
      <div class="rules">
        <div class="rule"><span class="ico">👆</span><span><b class="y">노란 표시</b>에서 탭 → 꺾기 · 점프</span></div>
        <div class="rule"><span class="ico">✋</span><span><b class="b">파란 띠</b>는 꾹 누르고, 끝에서 떼기</span></div>
      </div>
      <div class="btn-row">
        <button id="startBtn">🏃 시작하기<span class="btn-sub pc-only">스페이스바로 시작</span></button>
        <button id="exitBtn" class="ghost hidden">↩ 앱으로 돌아가기</button>
      </div>
      <p id="startBest" class="sub">최고 기록 0점</p>
    </div>
  </section>

  <section id="pause" class="screen hidden">
    <div class="panel">
      <div class="eyebrow">PAUSED</div>
      <h1>잠깐 멈춤</h1>
      <p>준비되면 이어서 달려요.<br>3 · 2 · 1 뒤에 다시 출발해요.</p>
      <div class="btn-row">
        <button id="resumeBtn">▶ 계속하기<span class="btn-sub pc-only">스페이스바로 계속</span></button>
        <button id="quitBtn" class="ghost">그만하고 결과 보기</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen hidden">
    <div class="panel">
      <h1>수행평가지를 놓쳤다!</h1>
      <p id="resReason" class="sub"></p>
      <div id="resScore" class="score-big">0점</div>
      <div class="stamp-row">
        <div id="resStamp" class="stamp">F</div>
        <div id="resComment" class="comment"></div>
      </div>
      <div id="resNear" class="near"></div>
      <div class="stats">
        <div class="stat"><span>최고 점수</span><strong id="resBest">0</strong></div>
        <div class="stat"><span>달린 거리</span><strong id="resExtra">0</strong></div>
        <div class="stat"><span>Perfect · 최대 콤보</span><strong id="resPerfect">0 · 0</strong></div>
        <div class="stat"><span>도착한 시간</span><strong id="resPlace">등교</strong></div>
      </div>
      <div class="btn-row" id="resBtns">
        <button id="retryBtn">🔁 다시 하기<span class="btn-sub pc-only">스페이스바로 다시 하기</span></button>
        <button id="homeBtn" class="ghost">🏠 처음으로</button>
      </div>
      <div class="btn-row hidden" id="doneRow">
        <button id="doneBtn">계속 ▶</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ===================== 앱 연결 코드 (고치지 마세요) =====================
   앱 안에서 열리면 진짜 앱과 연결되고, 그냥 브라우저·AI 미리보기에서 열면
   가짜(연습용)로 동작합니다. 그래서 앱 없이도 게임을 끝까지 만들어 볼 수 있어요.

   UnjungGame.player            → { nickname: '닉네임', grade: 2 }  (연습용에선 '테스트')
   UnjungGame.submitScore(n)    → 게임이 끝날 때 점수(정수)를 보냄. 결과: Promise<{ best }>
                                  앱은 1.5초 뒤 결과 화면(한 판 더 / 나가기)으로 게임을 덮어요.
   UnjungGame.submitScore(n, { hold: true }) → 점수만 기록하고, 게임의 결과 화면을 계속 보여 줘요.
                                  그 화면의 '계속' 버튼에서 UnjungGame.done() 을 부르면 앱 결과 화면이 떠요.
   UnjungGame.done()            → (hold로 보낸 뒤) 앱 결과 화면 열기
   UnjungGame.getStudyMinutes() → 오늘 스터디 윗미 공부 시간(분). Promise<number> (연습용에선 0)
   UnjungGame.save(obj)         → 이어하기용 저장(작은 데이터, 10KB까지). Promise
   UnjungGame.load()            → 저장한 것 불러오기. Promise<obj | null>
   UnjungGame.onPause(fn)       → 앱이 게임을 멈출 때(수업 시작 등) 부름
   UnjungGame.exit()            → 앱으로 돌아가기
========================================================================== */
(function () {
  const inApp = window.parent !== window && /[?&]unjung=1/.test(location.search);
  const listeners = { pause: [] };
  let seq = 0; const waiting = {};
  function ask(type, data) {
    if (!inApp) return Promise.resolve(null);
    return new Promise((resolve) => { const id = ++seq; waiting[id] = resolve; window.parent.postMessage({ unjung: 1, id, type, data }, '*'); setTimeout(() => { if (waiting[id]) { delete waiting[id]; resolve(null); } }, 8000); });
  }
  window.addEventListener('message', (e) => {
    const m = e.data; if (!m || m.unjung !== 1) return;
    if (m.reply && waiting[m.reply]) { waiting[m.reply](m.data); delete waiting[m.reply]; }
    if (m.type === 'player') Object.assign(api.player, m.data || {});
    if (m.type === 'pause') listeners.pause.forEach((f) => f());
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) listeners.pause.forEach((f) => f()); });
  const KEY = 'unjung-game-practice';
  const api = {
    inApp,
    player: { nickname: inApp ? '' : '테스트', grade: 2 },
    submitScore(n, opts) {
      n = Math.max(0, Math.floor(Number(n) || 0));
      if (inApp) return ask('score', { score: n, hold: !!(opts && opts.hold) }).then((r) => r || { best: n });
      let best = n; try { best = Math.max(n, Number(localStorage.getItem(KEY + ':best')) || 0); localStorage.setItem(KEY + ':best', best); } catch (e) {}
      return Promise.resolve({ best });
    },
    save(obj) { const s = JSON.stringify(obj ?? null); if (s.length > 10000) return Promise.reject(new Error('저장 데이터가 너무 커요(10KB까지)'));
      if (inApp) return ask('save', s); try { localStorage.setItem(KEY + ':save', s); } catch (e) { return Promise.resolve(false); } return Promise.resolve(true); },
    load() { if (inApp) return ask('load').then((s) => (s ? JSON.parse(s) : null)); try { return Promise.resolve(JSON.parse(localStorage.getItem(KEY + ':save'))); } catch { return Promise.resolve(null); } },
    onPause(fn) { listeners.pause.push(fn); },
    exit() { if (inApp) ask('exit'); },
    done() { if (inApp) ask('done'); },
    getStudyMinutes() { return inApp ? ask('study').then((m) => Math.max(0, Math.floor(Number(m) || 0))) : Promise.resolve(0); },
  };
  window.UnjungGame = api;
  ask('ready');
})();
/* ======================= 앱 연결 코드 끝 ======================= */

/* ======================= 게임 코드 ======================= */
(() => {
  'use strict';

  /* ---------- 기본 설정: 기획서 수치. 직접 해 보면서 여기 숫자만 조절하면 돼요 ---------- */
  const GAME_TITLE = '수행 러너'; // 앱 게임 목록 이름과 맞춤(11-08)
  const BASE_SPEED = 5.5;      // 시작 속도: 초당 5.5칸 (초반이 지루하지 않게 10% 올림)
  const SPEED_STEP = 0.1;      // 180칸 달릴 때마다 +0.1배씩, 조금씩 계속 빨라짐
  const SPEED_TILES = 180;     // (점수가 아니라 거리 기준: 콤보를 잘 쌓아도 혼자만 폭주하지 않고, 오늘의 코스도 모두 같은 속도)
  const WIN_GOOD = 0.5;        // Good: 표시 칸 ±0.5칸
  const WIN_PERFECT = 0.25;    // Perfect: 표시 칸 ±0.25칸
  const EARLY_ZONE = 1.0;      // 판정 범위 바로 앞 1칸 = 너무 이름(실패)
  const JUMP_LEN = 2.4;        // 점프는 2.4칸 동안 공중 (체공 시간 20% 늘림)
  const JUMP_PEAK = 0.75;      // 점프 높이(칸)
  const PAPER_AHEAD = 7;       // 시험지는 캐릭터보다 7칸 앞에서 날아감
  const BONUS_PERFECT = 5, BONUS_GOOD = 2;
  const COUNTDOWN_MS = 1800;
  const DEATH_MS = 850;        // 실패 연출 시간
  const RESULT_LOCK_MS = 500;  // 결과 화면 직후 터치 무시
  const ANCHOR_Y = 0.68;       // 캐릭터는 화면 아래 1/3쯤

  function nearText(final, isNew) {

  /* ---------- 화면 전환 · HUD ---------- */
  function showScreen(name) {

  }
  function goHome() {

  function refreshStart() {

  }
  function setText(id, txt) { if (hudText[id] !== txt) { hudText[id] = txt; $(id).textContent = txt; } } // 바뀐 글자만 고치기
  function updateHud(now) {

    hudDirty = false; hudAt = now;
    setText('hudPlace', stageName(stage, ' · '));
    setText('hudScore', fmt(score));

  function showToast(top, main) { // 스테이지 알림: 이미 지나온 길이 있는 화면 아래쪽에, 두 줄로

  /* ---------- 콤보 화면 효과: 5콤보 노란 빛 → 10콤보 주황 빛 + 속도선 → 20콤보 피버(분홍·금 + 반짝이 + 잔상) ---------- */
  function updateComboFx(dt, now) {
    const lv = state === 'PLAYING' || state === 'COUNTDOWN' ? comboLevel(combo) : 0;
    if (lv) fxLv = lv;
    const target = [0, 0.3, 0.4, 0.48][lv] + 0.22 * glowPulse;
    glowA += (target - glowA) * (1 - Math.exp(-dt * (target > glowA ? 12 : 5)));
    glowPulse = Math.max(0, glowPulse - dt * 2.5);
    const want = lv >= 3 ? 16 : lv === 2 ? 10 : 0;   // 속도선 (화면 양옆에만)
    while (fxLines.length < want) fxLines.push(newLine(true));
    if (fxLines.length > want) fxLines.length = want;
    for (const l of fxLines) { l.y += l.v * dt; if (l.y > H + l.len) Object.assign(l, newLine(false)); }
    if (lv >= 3 && state === 'PLAYING' && Math.random() < dt * 22) {
      const side = Math.random() < 0.5 ? Math.random() * W * 0.22 : W * (0.78 + Math.random() * 0.22);
      sparkles.push({ x: side, y: H * (0.15 + Math.random() * 0.8), born: now, c: Math.random() < 0.5 ? '#FFD54A' : '#FF7AB0' });
    }
    compact(sparkles, (p) => now - p.born < 800);
    if (lv >= 3 && state === 'PLAYING') { if (++trailTick % 2 === 0) { trail.push(charPos()); if (trail.length > 6) trail.shift(); } }
    else if (trail.length) trail.length = 0;
  }
  function newLine(anyY) {
    const x = Math.random() < 0.5 ? Math.random() * W * 0.2 : W * (0.8 + Math.random() * 0.2);
    const len = 40 + Math.random() * 60;
    return { x, y: anyY ? Math.random() * H : -len, len, v: 700 + Math.random() * 500 };
  }
  const fxA = $('fxA'), fxB = $('fxB'), fxSet = { a: -1, b: -1, cls: '' };
  function setGlowLayers(now) { // 가장자리 빛은 캔버스 대신 화면 레이어(GPU)로: 버벅임 없이
    const cls = `fx lv${fxLv}`;
    if (fxSet.cls !== cls) { fxSet.cls = cls; fxA.className = cls; }
    let a = glowA, b = 0;
    if (fxLv >= 3) { a = glowA * (0.65 + 0.35 * Math.sin(now / 160)); b = glowA * (0.65 + 0.35 * Math.cos(now / 160)); }
    a = Math.round(a * 50) / 50; b = Math.round(b * 50) / 50;
    if (a !== fxSet.a) { fxSet.a = a; fxA.style.opacity = a; }
    if (b !== fxSet.b) { fxSet.b = b; fxB.style.opacity = b; }
  }
  function drawComboFx(now) {
    setGlowLayers(now);
    if (fxLines.length) {

      ctx.beginPath();
      for (const l of fxLines) { ctx.moveTo(l.x, l.y - l.len); ctx.lineTo(l.x, l.y); }
      ctx.stroke();
    }
    for (const p of sparkles) {
      const k = (now - p.born) / 800, r = 3.5 * (1 - k) + 1;
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.c;
      ctx.fillRect(p.x - r, p.y - k * 40 - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 효과 ---------- */
  function addFloater(p, text, color, big, dy) {

  }
  function burst(p, n, color, power) {

      const ang = Math.PI * 2 * i / n + Math.random() * 0.4, sp = (70 + Math.random() * 130) * k;
      particles.push({ wx: p.x, wy: p.y, ox: 0, oy: 0, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, born: now, life: 420 + Math.random() * 200, r: 2.5 + Math.random() * 3, color });
    }
  }

  /* ---------- 소리 (기본 꺼짐, 켜면 8비트 비트 + 효과음) ---------- */
  function ensureAudio() {

  }

  }
  function noise(when, dur, vol) {

    }

  function sfx(kind, perfect) {

    else if (kind === 'jump') tone(520, t, 0.14, 'sine', 0.16, 980);
    else if (kind === 'slide') tone(900, t, 0.22, 'sawtooth', 0.04, 220);
    else if (kind === 'ding') { tone(1318.5, t, 0.08, 'triangle', 0.1); tone(1760, t + 0.07, 0.12, 'triangle', 0.1); }
    else if (kind === 'combo') { tone(784, t, 0.08, 'triangle', 0.09); tone(988, t + 0.07, 0.08, 'triangle', 0.09); tone(1175, t + 0.14, 0.14, 'triangle', 0.1); }
    else if (kind === 'zone') { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.07, 0.12, 'square', 0.05)); }
    else if (kind === 'crash') { noise(t, 0.35, 0.25); tone(180, t, 0.4, 'sine', 0.25, 40); }
  }
  function scheduleBeats() {

      const when = actx.currentTime + Math.max(0.005, (bs - s) / speed);
      tone(120, when, 0.16, 'sine', 0.22, 45);                         // 쿵
      const note = place.notes[nextBeat % place.notes.length];
      tone(note, when, 0.16, 'triangle', 0.05, note * 0.99);           // 멜로디
      noise(actx.currentTime + Math.max(0.005, (bs + 1 - s) / speed), 0.035, 0.05); // 칙
      nextBeat++;

  }

  /* ---------- 그리기 ---------- */
  function roundRectOn(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);

  }
  function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }

  function getTheme() { // 장소 색은 바뀔 때만 다시 계산
    const step = themeT >= 1 ? 20 : Math.round(themeT * 20);
    const key = `${themeFrom}|${themeTo}|${step}|${H}`;
    if (themeCache && themeCache.key === key) return themeCache;
    const A = PLACES[themeFrom], B = PLACES[themeTo], t = step / 20;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, mix(A.bg, B.bg, t)); grad.addColorStop(1, mix(A.bg2, B.bg2, t));

    return themeCache;
  }

  function drawBackground(now, th) {
    ctx.fillStyle = th.grad; ctx.fillRect(0, 0, W, H);

    // 바닥 격자: 카메라와 함께 움직여서 달리는 느낌
    ctx.globalAlpha = 0.28; ctx.strokeStyle = th.grid; ctx.lineWidth = 1;
    const ox = (((W / 2 - camX * T) % T) + T) % T - T / 2, oy = (((H * ANCHOR_Y + camY * T) % T) + T) % T - T / 2;
    ctx.beginPath();
    for (let x = ox; x < W; x += T) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = oy; y < H; y += T) { ctx.moveTo(0, y); ctx.lineTo(W, y); }

    // 장소 소품

    const y0 = Math.floor(camY - H * (1 - ANCHOR_Y) / T) - 1, y1 = Math.ceil(camY + H * ANCHOR_Y / T) + 1;
    ctx.globalAlpha = 0.34;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (occupied.has(cellKey(x, y))) continue;
        const h = hash(x, y);
        if (h < 0.07) drawSprite(emojiSprite(decor[Math.floor(h * 10000) % decor.length], T * 0.55), sx(x), sy(y));
      }
    }
    ctx.globalAlpha = 1;

    // 시간대 빛: 아침 · 낮 · 오후 · 노을 · 밤(별)
    if (ov[3] > 0.005) { ctx.fillStyle = `rgba(${ov[0] | 0}, ${ov[1] | 0}, ${ov[2] | 0}, ${ov[3].toFixed(3)})`; ctx.fillRect(0, 0, W, H); }

  }

  function visibleRange() {
    const base = Math.floor(s);

  }
  const onScreen = (X, Y) => X > -T && X < W + T && Y > -T && Y < H + T;

  function drawPath(now, th) {
    const [i0, i1] = visibleRange();
    const next = actions[actionIdx];

    // 1) 이어진 길: 구멍에서 끊기는 덩어리로 나눠서, 모서리가 둥근 굵은 선으로 한 번에 그림
    const runs = [];
    let cur = null;
    for (let i = i0; i <= i1; i++) {

      cur.push(t);
    }

  function drawHighObstacles(now, th) {
    const place = th.place, kind = place.high;

      if (sp) { drawSprite(sp, X, Y - lift); continue; }
      ctx.fillStyle = '#A86B37'; roundRectOn(ctx, X - w / 2, Y - lift - h / 2, w, h, 6); ctx.fill(); // 교실: 책상
      ctx.fillStyle = 'rgba(255, 255, 255, .22)';
      ctx.fillRect(X - w / 2 + 4, Y - lift - h / 2 + 3, w - 8, Math.min(4, h / 4));
    }
  }

  function drawRunner(now) {
    let p = charPos(), alpha = 1, scale = 1, rot = 0, lift = 0, squash = 1, stretch = 1;
    if ((state === 'DYING' || state === 'RESULT') && death && death.type !== 'quit') {
      const k = Math.min(1, (now - dieAt) / 600);
      p = { x: death.x, y: death.y };
      if (death.fall) {
        if (death.to) { const m = Math.min(1, k * 3); p.x += (death.to.x - death.x) * m; p.y += (death.to.y - death.y) * m; }
        else { p.x += death.dir.x * death.spd * k * 0.45; p.y += death.dir.y * death.spd * k * 0.45; }
        scale = 1 - 0.8 * k; rot = k * 4; alpha = 1 - 0.6 * k;
      } else rot = (facing < 0 ? -1.3 : 1.3) * Math.min(1, k * 3);
    } else {
      const j = jumpHeight(s);
      if (j) {
        lift = j.h;
        scale = 1 + 0.12 * Math.sin(Math.PI * j.p);
        stretch = j.p < 0.25 ? 1 + 0.18 * (1 - j.p / 0.25) : j.p > 0.85 ? 1 - 0.2 * ((j.p - 0.85) / 0.15) : 1; // 뛸 때 늘어나고 착지 직전 눌림
        rot = (facing < 0 ? -1 : 1) * -0.18 * Math.sin(Math.PI * j.p);  // 앞으로 살짝 기울기
      } else {
        const since = s - jumpStart - JUMP_LEN;
        if (since >= 0 && since < 0.35) stretch = 1 - 0.18 * (1 - since / 0.35); // 착지 후 눌렸다 펴짐
      }
      if (sliding) { rot = (facing < 0 ? 1 : -1) * Math.PI / 2 * 0.9; squash = 0.8; }
    }
    const X = sx(p.x), Y = sy(p.y);
    ctx.fillStyle = `rgba(0, 0, 0, ${(0.22 * alpha).toFixed(3)})`;
    const shadowK = Math.max(0.45, 1 - lift / (T * 1.2));
    ellipse(X, Y + T * 0.24, T * 0.28 * shadowK, T * 0.1 * shadowK);
    if (sliding && state === 'PLAYING') { // 슬라이딩 바람 선
      const d = curDir();
      ctx.strokeStyle = 'rgba(255, 255, 255, .8)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let k = -1; k <= 1; k++) {
        const o = k * T * 0.14, len = T * (0.3 + 0.15 * Math.sin(now / 60 + k));
        ctx.moveTo(X - d.x * T * 0.35 - d.y * o, Y + d.y * T * 0.35 + d.x * o);
        ctx.lineTo(X - d.x * (T * 0.35 + len) - d.y * o, Y + d.y * (T * 0.35 + len) + d.x * o);
      }
      ctx.stroke();
    }
    const sp = emojiSprite('🏃', Math.max(18, T * 0.86));
    for (let k = 0; k < trail.length; k++) { // 피버 잔상
      const tp = trail[k];
      ctx.save();
      ctx.globalAlpha = 0.07 * (k + 1);
      ctx.translate(sx(tp.x), sy(tp.y)); ctx.scale(facing > 0 ? -1 : 1, 1);
      ctx.drawImage(sp.c, -sp.w / 2, -sp.h / 2 - T * 0.08, sp.w, sp.h);
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(X, Y - lift);
    ctx.rotate(rot);
    ctx.scale(scale * (2 - stretch) * (facing > 0 ? -1 : 1), scale * squash * stretch);
    ctx.drawImage(sp.c, -sp.w / 2, -sp.h / 2 - T * 0.08, sp.w, sp.h);
    ctx.restore();
  }

  function drawPaper(now) {
    let p, alpha = 1;
    if (state === 'DYING' || state === 'RESULT') {
      const k = Math.min(1, (now - dieAt) / 700), b = posAt(s + PAPER_AHEAD);
      p = { x: b.x + k * 2.5, y: b.y + k * 6 }; alpha = 1 - k;
    } else p = posAt(s + PAPER_AHEAD + Math.sin(now / 400) * 0.3);
    if (alpha <= 0.01) return;
    const X = sx(p.x) + Math.sin(now / 180) * T * 0.12, Y = sy(p.y) - T * 0.45 + Math.cos(now / 230) * T * 0.08;
    ctx.globalAlpha = alpha * 0.85;
    drawSprite(emojiSprite('💨', T * 0.42), X + T * 0.42, Y + T * 0.12);
    ctx.globalAlpha = alpha;
    const sp = emojiSprite('📄', T * 0.62);
    ctx.save();
    ctx.translate(X, Y); ctx.rotate(Math.sin(now / 260) * 0.45);
    ctx.drawImage(sp.c, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawEffects(now) {
    for (const p of particles) {
      const a = Math.max(0, 1 - (now - p.born) / p.life), r = p.r * a + 0.5;
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.fillRect(sx(p.wx) + p.ox - r, sy(p.wy) + p.oy - r, r * 2, r * 2);
    }
    for (const f of floaters) {
      const k = (now - f.born) / 850;
      ctx.globalAlpha = Math.max(0, 1 - k * k);
      const pop = f.big ? 1 + Math.max(0, 0.3 - k) : 1, half = f.sp.w * pop / 2 + 4;
      const X = Math.min(W - half, Math.max(half, sx(f.wx))); // 화면 밖으로 잘리지 않게
      drawSprite(f.sp, X, sy(f.wy) - T * 0.7 + f.dy - k * 44, pop);
    }
    ctx.globalAlpha = 1;
  }

  function drawHints(now) {
    if (state !== 'PLAYING' && state !== 'COUNTDOWN') return;
    const a = actions[actionIdx];
    if (!a || save.tut[a.type] >= 2) return;
    let text, at = a.s;
    if (a.type === 'slide' && a.state === 'active') { text = s >= a.end - 1.2 ? '지금 떼!' : '계속 꾹~'; at = a.end; }
    else {
      const d = s - a.s;
      if (d < -2.6) return;
      text = a.type === 'slide' ? '✋ 꾹 누르고 있어!' : Math.abs(d) <= WIN_GOOD ? '👆 지금 탭!' : '👆 노란 표시에서 탭';
    }
    const sp = pillSprite(text), tile = tiles[at];
    const X = Math.min(W - sp.w / 2 - 6, Math.max(sp.w / 2 + 6, sx(tile.x)));
    drawSprite(sp, X, sy(tile.y) - T * 0.95, 1 + Math.sin(now / 120) * 0.04);
  }

  function drawCountdown(now) {
    if (state !== 'COUNTDOWN') return;
    const part = COUNTDOWN_MS / 3, rem = countdownEnd - now, n = Math.ceil(rem / part);
    const k = 1 - ((((rem % part) + part) % part) / part);
    drawSprite(textSprite(n >= 1 ? String(n) : '출발!', 64, '#FFFFFF'), W / 2, H * 0.4, 1.25 - 0.25 * k);
    if (save.tut.turn + save.tut.jump + save.tut.slide === 0) drawSprite(textSprite('노란 표시 = 탭 · 파란 띠 = 꾹', 17, '#FFFFFF'), W / 2, H * 0.4 + 58);
  }

  function draw(now) {
    if (!W || !H || !tiles.length) return;
    const th = getTheme();
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground(now, th);
    drawPath(now, th);
    drawRunner(now);
    drawHighObstacles(now, th);
    drawPaper(now);
    drawEffects(now);
    ctx.restore();
    drawComboFx(now);
    drawHints(now);
    drawCountdown(now);
    if (flash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.35, flash).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- 반복(requestAnimationFrame) · 화면 크기 ---------- */
  function loop(now) {
    requestAnimationFrame(loop);
    // [11-08] 앱 안에서 처음 크기가 0으로 읽히고 resize 알림이 안 오는 휴대폰 대비: 크기가 달라졌으면 다시 맞춤
    if ((now | 0) % 4 === 0) { const r = wrap.getBoundingClientRect(); if (r.width > 0 && r.height > 0 && (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1)) fit(); }
    const raw = Math.max(0, (now - lastFrame) / 1000), dt = Math.min(0.05, raw);
    lastFrame = now;
    update(dt, now);
    updateHud(now);
    const live = state === 'PLAYING' || state === 'COUNTDOWN' || state === 'DYING';
    if (live || needsDraw) { draw(now); needsDraw = false; } // 시작·멈춤·결과 화면에선 그림을 멈춰서 배터리·발열 줄이기
    if (state === 'PLAYING') { // 계속 느리면 해상도를 한 단계 낮춤
      slowFrames = raw > 0.024 ? slowFrames + 1 : Math.max(0, slowFrames - 0.25);
      if (slowFrames > 40 && dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); slowFrames = 0; fit(); }
    }
  }
  function fit() {
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    DPR = Math.min(dprCap, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    T = Math.max(36, Math.min(56, W / 8, H / 12)); // 칸 크기: 화면에 맞춰 다시 계산
    sprites.clear(); themeCache = null;
    prewarm();
    needsDraw = true;
  }

  /* ---------- 시작 ---------- */
  function mergeSave(o) {
    if (!o || typeof o !== 'object') return;
    if (Number.isFinite(Number(o.best))) save.best = Math.max(save.best, Math.floor(Number(o.best)));
    if (typeof o.bestGrade === 'string' && gradeRank(o.bestGrade) > gradeRank(save.bestGrade)) save.bestGrade = o.bestGrade;
    if (o.tut) for (const k of ['turn', 'jump', 'slide']) save.tut[k] = Math.max(0, Number(o.tut[k]) || 0);
    save.sound = !!o.sound;
  }

  $('titleText').textContent = GAME_TITLE;
  document.title = `${GAME_TITLE} - 운중고 미니게임`;
  $('startBtn').addEventListener('click', () => startRun());
  $('retryBtn').addEventListener('click', () => startRun());
  $('homeBtn').addEventListener('click', goHome);
  function done() { const b = $('doneBtn'); if (b.disabled) return; b.disabled = true; b.textContent = '기록 확인 중…'; UnjungGame.done(); }
  $('doneBtn').addEventListener('click', done);
  $('pauseBtn').addEventListener('click', pauseGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('quitBtn').addEventListener('click', quitRun);
  $('exitBtn').addEventListener('click', () => UnjungGame.exit());
  $('soundBtn').addEventListener('click', () => {
    save.sound = !save.sound;
    if (save.sound) { ensureAudio(); setTimeout(() => sfx('ding'), 60); } else suspendAudio();
    persist(); refreshStart();
  });
  if (UnjungGame.inApp) $('exitBtn').classList.remove('hidden');

  wrap.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  wrap.addEventListener('touchstart', (e) => {
    if (state === 'PLAYING' && !(e.target.closest && e.target.closest('button'))) e.preventDefault(); // 길게 누를 때 확대·메뉴 막기
  }, { passive: false });
  wrap.addEventListener('contextmenu', (e) => e.preventDefault());
  /* 컴퓨터: 스페이스바 = 화면 터치 (누르고 있으면 꾹), ESC = 일시정지 */
  let spaceHeld = false;
  const isSpace = (e) => e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { pauseGame(); return; }
    if (!isSpace(e)) return;
    e.preventDefault();                               // 화면이 내려가거나, 선택된 버튼이 눌리지 않게
    if (e.repeat) return;                             // 꾹 누르고 있을 때 생기는 반복 입력은 무시
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    if (state === 'PLAYING') { spaceHeld = true; press(); }
    else if (state === 'START') startRun();
    else if (state === 'RESULT' && UnjungGame.inApp) done();
    else if (state === 'RESULT' && !$('retryBtn').disabled) startRun();
    else if (state === 'PAUSED') resumeGame();
  });
  window.addEventListener('keyup', (e) => {
    if (!isSpace(e)) return;
    e.preventDefault();
    if (spaceHeld) { spaceHeld = false; release(); }
  });
  window.addEventListener('blur', () => { spaceHeld = false; pauseGame(); }); // 다른 창으로 가면 멈춤 (스페이스가 눌린 채로 남지 않게)
  window.addEventListener('resize', fit, { passive: true });
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(wrap);

  UnjungGame.onPause(() => pauseGame());

  resetCourse(randomSeed());
  refreshStart();
  showScreen('start');
  fit();
  Promise.resolve(UnjungGame.load()).then((o) => { mergeSave(o); refreshStart(); }).catch(() => {});
  lastFrame = performance.now();
  requestAnimationFrame(loop);
})();
/* ======================= 게임 코드 끝 ======================= */
</script>
</body>
</html>
