# PR이 올라오면 자동으로 검사합니다. 결과는 PR 화면 아래 'Checks'에 표시됩니다.
name: 자동 검사

on:
  pull_request:
    branches: [main]
  push:
    branches: ['lead/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 부품 설치
        run: npm ci --no-audit --no-fund

      - name: 타입 검사 (앱)
        run: npx tsc --noEmit

      - name: 타입 검사 (서버 함수)
        run: npx tsc --noEmit -p api

      - name: 웹 빌드
        run: npm run build:web
