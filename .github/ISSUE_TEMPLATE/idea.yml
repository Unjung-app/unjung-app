name: 💡 기능 아이디어
description: 앱에 있었으면 하는 기능을 남겨요. 허락 없이 바로 만들기 시작해도 돼요.
title: "[아이디어] "
labels: ["아이디어"]
body:
  - type: input
    id: name
    attributes:
      label: 기능 이름
      placeholder: 예) 점심 신청곡
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 어떤 기능인가요? (누가 쓰고, 화면에 무엇이 보이는지)
      placeholder: 예) 점심시간에 틀 노래를 학생들이 미리 신청하는 화면
    validations:
      required: true
