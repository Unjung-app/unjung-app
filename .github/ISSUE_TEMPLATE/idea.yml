name: 💡 기능 아이디어
description: 앱에 있었으면 하는 기능을 제안하고, 같이 만들 사람을 찾아요. (허락 없이 바로 시작해도 됩니다)
title: "[아이디어] "
labels: ["아이디어"]
body:
  - type: markdown
    attributes:
      value: |
        아이디어는 누구나 올릴 수 있어요. 올린 뒤 바로 `npm run new`로 만들기 시작해도 됩니다.
        직접 만들지 않고 아이디어만 남겨도 괜찮아요. 다른 사람이 맡을 수 있어요.
  - type: input
    id: name
    attributes:
      label: 기능 이름
      placeholder: 예) 점심 신청곡
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: 누가, 언제 쓰나요?
      placeholder: 예) 점심시간 방송부가 틀 노래를 학생들이 미리 신청할 때
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: 화면에 무엇이 보이고, 무엇을 누를 수 있나요?
      description: 대충 적어도 괜찮아요. 그림을 붙여넣어도 돼요.
      placeholder: |
        - 노래 제목·가수 입력칸과 [신청] 버튼
        - 오늘 신청된 노래 목록
  - type: dropdown
    id: plan
    attributes:
      label: 직접 만들 건가요?
      options:
        - 내가 만들 거예요
        - 같이 만들 사람을 찾아요
        - 아이디어만 남겨요
    validations:
      required: true
